function deliver(m, quiet){
  m.id = ++mailSeq; m.read = false; m.day = S ? S.day : 1;
  S.mail.unshift(m);
  /* One newsletter a day is right, and a hundred of them in the inbox is not.
     Read ones age out; anything unread or important stays until dealt with. */
  const stale = S.mail.filter(x => x.daily && x.read);
  if (stale.length > CONFIG.newslettersKept)
    for (const old of stale.slice(CONFIG.newslettersKept))
      S.mail.splice(S.mail.indexOf(old), 1);
  if (!quiet) softRender();

/* ===========================================================================
   4b. NEWS AND EFFECTS

   The actual game. A story fires, and at the moment it fires its true effect
   already exists as a number: which assets, which direction, how hard, how
   soon, for how long. The prose is rendered from the same object, deliberately
   vaguely. The answer exists before you guess.

   Almost nothing names the company it moves. A rail strike hurts the steel
   mill that cannot ship and the food distributor that cannot deliver, and the
   article mentions neither. Working that out from the profile pages is the
   skill the whole game is built on.

   Being right pays out more often than being wrong, and never reliably:
   magnitude, delay and duration are all rolled at fire time, and one story in
   seven goes the other way regardless of how well you read it.
   ======================================================================== */

/* Slot pools. Every story is a template; filling the slots differently is what
   makes a small bank feel larger than it is. */
const SLOTS = {
  region:   ["the upper Midwest","the Gulf coast","the Ohio valley","the Great Lakes region",
             "the central plains","the mid-Atlantic"],
  official: ["a department spokesman","an official familiar with the matter",
             "a person briefed on the negotiations","a regional administrator"],
  analyst:  ["Hargreave Partners","Doubleday Rowe","the Fentiman Group","Keel & Marsh"],
  month:    ["March","April","September","October","November"],
};
const pick = arr => arr[Math.floor(rand() * arr.length)];
function fill(str){
  return str.replace(/\{(\w+)\}/g, (_, k) => SLOTS[k] ? pick(SLOTS[k]) : _);
}

   These name their subject, and that is the point. The macro bank above makes
   you infer which companies a story touches; this bank tells you exactly which
   company, and makes you work out what the news actually means for it. A beat
   with lowered guidance is still a beat. An upgrade from an analyst is worth
   almost nothing. An acquisition rumour is worth a great deal and is often
   wrong.

   {co} is the company name, {tk} its ticker, {sec} its sector. self/sector are
   resolved against the company the story fires on.

/* ---------------------------------------------------------------------------
   COVERAGE

   The press does not distribute itself evenly. A trillion-dollar accelerator
   designer is written about every day; a regional gas utility is written about
   when its rate case is decided. Coverage is driven by size first, then by
   how much the thing is being traded today, then by sector heat.

   The practical effect: most of the hundred companies are quiet most of the
   time, a dozen names carry the narrative, and a story about one of those
   dozen is worth reading because it is going to keep happening.
   ------------------------------------------------------------------------ */
const marketCap = a => a.price * a.float;

function coverageWeight(a){
  const capB = marketCap(a) / 1e9;
  let w = Math.pow(Math.max(capB, 0.05), 0.95);          // size dominates
  const turnover = a.volume / Math.max(a.float * 0.004, 1);
  w *= 1 + Math.min(2.5, turnover);                       // today's tape
  w *= SECTOR_COVERAGE[a.sector] || 1;                    // AI runs hot
  return w;
}

function weightedCompany(){
  const list = listedAssets().filter(a => !a.isFund);
  const weights = list.map(coverageWeight);
  let roll = rand() * weights.reduce((x, y) => x + y, 0);
  for (let i = 0; i < list.length; i++){
    roll -= weights[i];
    if (roll <= 0) return list[i];
  }
  return list[list.length - 1];
}

/* The most covered names, for the market summary and the coverage panel. */
function majors(n){
  return listedAssets().filter(a => !a.isFund)
    .sort((a, b) => coverageWeight(b) - coverageWeight(a))
    .slice(0, n);
}

const availableBanks = () => Object.values(BANKS).filter(b =>
  b.tier <= S.tier && (b.tier === 1 || grants("all_banks")));

function acct(id){
  if (!S.bank[id]) S.bank[id] = { balance:0, daysHeld:0, interest:0, trust:0, opened:null };
  return S.bank[id];
}
const totalDeposits = () => Object.values(S.bank).reduce((t, a) => t + a.balance, 0);

/* trust = 40% your record + 35% what you keep here + 25% how long you have
   kept it. Recalculated at every close. */
function bankTrust(id){
  const B = BANKS[id], a = acct(id);
  const repScore = (S.rep + 100) / 2;                       // -100..100 -> 0..100
  const expect = Math.max(B.openMinimum || 0, B.minBalance || 0, 2000) * (B.difficulty || 1);
  const depScore = Math.min(100, Math.log10(1 + a.balance / expect * 9) * 100);
  const histScore = Math.min(100, a.daysHeld * 1.6 + a.interest / Math.max(expect, 1) * 400
                                   + (a.loansRepaid || 0) * 12);
  const w = B.repWeight
    ? [B.repWeight, (1 - B.repWeight) * 0.6, (1 - B.repWeight) * 0.4]
    : B.interestOnlyTrust ? [0.35, 0.05, 0.60] : [0.40, 0.35, 0.25];
  let t = w[0] * repScore + w[1] * depScore + w[2] * histScore;
  t /= (B.difficulty || 1);
  return Math.max(0, Math.min(100, t));
}

function bankApr(id){
  const B = BANKS[id], a = acct(id);
  let apr = B.apr;
  if (B.bonusAfterDays && a.daysHeld >= B.bonusAfterDays) apr += B.bonusApr;
  return apr;
}

/* Rates improve with trust, within the band each bank publishes. */
function loanRate(id){
  const B = BANKS[id], t = acct(id).trust;
  return B.bailoutHi + (B.bailoutLo - B.bailoutHi) * (t / 100);
}
function maxLoan(id){
  return 0.6 * S.peakNetWorth * (acct(id).trust / 100);
}

function canBorrow(id){
  const B = BANKS[id], a = acct(id);
  if (B.lends === false) return { ok:false, why:"This institution does not make loans. It exists to be outgrown." };
  if (B.refusesConvicted && S.convicted) return { ok:false, why:"Your application has been declined. No reason will be given." };
  if (!a.opened) return { ok:false, why:"You do not hold an account here." };
  if (a.trust < B.minTrust) return { ok:false, why:`Requires trust of ${B.minTrust}. Yours is ${a.trust.toFixed(0)}.` };
  if (S.rep < B.minRep) return { ok:false, why:`Requires a reputation of ${B.minRep}. Yours is ${S.rep.toFixed(1)}.` };
  if (S.loans.some(l => l.bank === id)) return { ok:false, why:"You already have a loan outstanding with us." };
  const m = maxLoan(id);
  if (m < 100) return { ok:false, why:"Your borrowing capacity here is negligible. Build the relationship first." };
  return { ok:true, max:m, rate:loanRate(id) };
}

function openAccount(id){
  const B = BANKS[id], a = acct(id);
  if (a.opened) return;
  if (B.openMinimum && S.cash < B.openMinimum){
    S.lastError = `${B.name} requires ${money(B.openMinimum)} to open an account. `
                + `You have ${money(S.cash)} in brokerage cash.`;
    render(); return;
  }
  if (B.openMinimum){                 // the opening deposit is taken, not merely proved
    S.cash -= B.openMinimum;
    a.balance += B.openMinimum;
  }
  a.opened = S.day;
  deliver(MAILBOX.bankOpened(B));
  flash("Account opened.");
  render();
}

function deposit(id, amount){
  S.lastError = S.lastOk = null;
  const B = BANKS[id], a = acct(id);
  if (S.phase === "open") return fail("Transfers between accounts settle after the close.");
  if (!a.opened) return fail("Open an account here first.");
  if (!(amount > 0)) return fail("Enter an amount.");
  if (amount > S.cash) return fail(`You have ${money(S.cash)} in your brokerage account.`);
  S.cash -= amount; a.balance += amount;
  S.lastOk = `${money(amount)} deposited with ${B.name}.`;
  render(); return true;
}

function withdraw(id, amount){
  S.lastError = S.lastOk = null;
  const B = BANKS[id], a = acct(id);
  if (S.phase === "open") return fail("Transfers between accounts settle after the close.");
  if (!(amount > 0)) return fail("Enter an amount.");
  if (amount > a.balance) return fail(`The balance here is ${money(a.balance)}.`);
  a.balance -= amount; S.cash += amount;
  if (B.minBalance && a.balance > 0 && a.balance < B.minBalance){
    a.balance -= B.minBalanceFee;
    S.lastOk = `${money(amount)} withdrawn. A ${money(B.minBalanceFee)} fee was applied for falling below ${money(B.minBalance)}.`;
  } else {
    S.lastOk = `${money(amount)} withdrawn from ${B.name}.`;
  }
  render(); return true;
}

function takeLoan(id, amount){
  S.lastError = S.lastOk = null;
  const c = canBorrow(id);
  if (!c.ok) return fail(c.why);
  if (!(amount > 0)) return fail("Enter an amount.");
  if (amount > c.max) return fail(`The most we will lend you is ${money(c.max)}.`);
  const term = acct(id).trust >= 70 ? 90 : acct(id).trust >= 40 ? 180 : 0;
  S.loans.push({ bank:id, principal:amount, owed:amount, rate:c.rate,
                 taken:S.day, dueDay: term ? S.day + term : null, term });
  S.cash += amount;
  deliver(MAILBOX.loanTaken(BANKS[id], amount, c.rate, term));
  S.lastOk = `${money(amount)} advanced at ${(c.rate*100).toFixed(1)}% annually.`;
  render(); return true;
}

function repayLoan(i, amount){
  S.lastError = S.lastOk = null;
  const l = S.loans[i];
  if (!l) return fail("No such loan.");
  if (!(amount > 0)) return fail("Enter an amount.");
  if (amount > S.cash) return fail(`You have ${money(S.cash)}.`);
  const pay = Math.min(amount, l.owed);
  S.cash -= pay; l.owed -= pay;
  const a = acct(l.bank);
  if (l.owed <= 0.01){
    const early = l.dueDay && S.day < l.dueDay;
    addRep(early ? 8 : 6);
    a.loansRepaid = (a.loansRepaid || 0) + 1;
    S.loans.splice(i, 1);
    S.lastOk = `Loan repaid in full${early ? ", ahead of term" : ""}. ${BANKS[l.bank].name} has noted it.`;
    deliver(MAILBOX.loanRepaid(BANKS[l.bank], early));
  } else {
    addRep(0.3);
    S.lastOk = `${money(pay)} paid. ${money(l.owed)} outstanding.`;
  }
  render(); return true;
}

/* Interest, trust and loan accrual, once per close. */
function bankDay(){
  const perDay = 1 / CONFIG.daysPerYear;
  for (const id in BANKS){
    const B = BANKS[id], a = S.bank[id];
    if (!a || !a.opened) continue;

    /* A minimum that only checks at withdrawal is not a minimum. The private
       banks charge for every day you sit below theirs, which is what makes
       Penistone and Prima Nocta expensive to hold rather than hard to reach. */
    if (B.minBalance && a.balance > 0 && a.balance < B.minBalance){
      a.balance = Math.max(0, a.balance - B.minBalanceFee);
      a.belowDays = (a.belowDays || 0) + 1;
      if (a.belowDays === 1) deliver(MAILBOX.belowMinimum(B));
      if (a.belowDays > 10){
        // the relationship lapses rather than surviving on sufferance
        S.cash += a.balance;
        deliver(MAILBOX.accountClosed(B, a.balance));
        S.bank[id] = { balance:0, daysHeld:0, interest:0, trust:0, opened:null };
        continue;
      }
    } else a.belowDays = 0;
    if (a.balance > 0){
      const int = a.balance * bankApr(id) * perDay;
      a.balance += int; a.interest += int;
      a.daysHeld++;
    } else if (BANKS[id].decayIdle){
      a.interest *= 0.97; a.daysHeld = Math.max(0, a.daysHeld - 1);
    }
    a.trust = bankTrust(id);
  }
  for (const l of S.loans){
    l.owed *= 1 + l.rate * perDay;
    if (l.dueDay && S.day > l.dueDay && !l.defaulted){
      l.lateDays = (l.lateDays || 0) + 1;
      addRep(-3);
      acct(l.bank).trust = Math.max(0, acct(l.bank).trust - 10);
      if (l.lateDays === 1) deliver(MAILBOX.loanLate(BANKS[l.bank], l));
      if (l.lateDays > 10 && !l.defaulted){
        l.defaulted = true; addRep(-25);
      }
    }
  }
}

/* ===========================================================================
   TAXES

   Filed twice a year, every 20 trading days. Realised gains only. Long-term
   treatment at 40 trading days held, which is one in-game year, and a career
   actually crosses it.

   One quiet rule closes the obvious exploit: selling a loser just before a
   statement and buying it straight back would cut the bill while changing
   nothing about your position, so a loss on anything rebought within 3 days
   is disallowed for that period and moves into the new cost basis. Selling a
   loser and staying out counts normally.

   Unlike an insider investigation there is no hidden roll here. It is a
   visible countdown. One is a gamble you took; the other is a bill you ignored.
   ======================================================================== */
const FED_BRACKETS = [[11000,.10],[47000,.12],[100000,.22],[192000,.24],
                      [244000,.32],[610000,.35],[Infinity,.37]];
const STATE_RATE = 0.05;
const LONG_TERM_DAYS = 40;

function federalTax(gains){
  let owed = 0, prev = 0;
  for (const [cap, rate] of FED_BRACKETS){
    if (gains <= prev) break;
    owed += (Math.min(gains, cap) - prev) * rate;
    prev = cap;
  }
  return owed;
}
function longTermRate(gains){
  return gains <= 47000 ? 0 : gains <= 518000 ? 0.15 : 0.20;
}

function newTaxPeriod(){
  return { shortGains:0, longGains:0, dividends:0, disallowed:0, trades:[] };
}

/* Called on every close-out. Records the realised result and decides whether
   it was short or long term. */
function recordRealised(p, pnl){
  const held = S.day - p.openedDay;
  const t = S.taxPeriod;
  t.trades.push({ ticker:p.ticker, pnl, held, day:S.day });
  if (pnl < 0){
    // held back until we know whether it gets rebought inside the window
    t.pendingLosses = t.pendingLosses || [];
    t.pendingLosses.push({ ticker:p.ticker, pnl, day:S.day });
  } else if (held >= LONG_TERM_DAYS) t.longGains += pnl;
  else t.shortGains += pnl;
}

/* A loss becomes real only if the name was not bought back within the window. */
function settleLosses(){
  const t = S.taxPeriod;
  if (!t.pendingLosses) return;
  const keep = [];
  for (const L of t.pendingLosses){
    if (S.day - L.day < CONFIG.rebuyWindowDays){ keep.push(L); continue; }
    const rebought = S.positions.some(p => p.ticker === L.ticker && p.openedDay - L.day <= CONFIG.rebuyWindowDays && p.openedDay >= L.day);
    if (rebought) t.disallowed += -L.pnl;
    else t.shortGains += L.pnl;         // negative: offsets gains in full
  }
  t.pendingLosses = keep;
}

function taxDue(){
  const t = S.taxPeriod;
  let short = t.shortGains + t.dividends - (S.taxCarry || 0);
  let carry = 0;
  if (short < 0){ carry = -short; short = 0; }
  const long = Math.max(0, t.longGains);
  const fed = federalTax(short) + long * longTermRate(long);
  const state = (short + long) * STATE_RATE;
  return { short, long, carry, fed, state, total: fed + state };
}

function fileTaxes(){
  settleLosses();
  const d = taxDue();
  S.taxCarry = d.carry;

  /* A period with nothing owed produces no bill and no letter. Otherwise a
     player who simply held cash accrues an overdue $0 assessment, gets marked
     down every day for not paying it, and is refused a loan six weeks later
     for a reputation they never spent. */
  if (d.total < 0.01){
    S.taxBill = { period:S.day, due:S.day + CONFIG.taxGraceDays, amount:0,
                  detail:d, snapshot:{ ...S.taxPeriod }, paid:true, lateDays:0, nil:true };
    S.taxPeriod = newTaxPeriod();
    return;
  }

  S.taxBill = {
    period: S.day,
    due: S.day + CONFIG.taxGraceDays,
    amount: d.total, detail: d,
    snapshot: { ...S.taxPeriod },
    paid: false, lateDays: 0,
  };
  S.taxPeriod = newTaxPeriod();
  deliver(MAILBOX.taxStatement(S.taxBill));
}

function payTaxes(){
  S.lastError = S.lastOk = null;
  const bill = S.taxBill;
  if (!bill || bill.paid) return fail("Nothing is outstanding.");
  if (bill.amount > S.cash)
    return fail(`The amount due is ${money(bill.amount)}. You have ${money(S.cash)} in your brokerage account. `
              + `The office does not seize assets; liquidate what you need to.`);
  S.cash -= bill.amount;
  bill.paid = true;
  if (!bill.lateDays) addRep(1.5);
  S.lastOk = `${money(bill.amount)} remitted. Receipt issued.`;
  deliver(MAILBOX.taxReceipt(bill));
  flash("Taxes paid.");
  render(); return true;
}

/* The visible countdown. */
function taxDay(){
  // taxDay runs at the close, before the day counter advances, so the period
  // closes on the last day of it rather than the first day of the next one
  if (S.day % CONFIG.taxPeriodDays === 0) fileTaxes();
  const bill = S.taxBill;
  if (!bill || bill.paid) return;
  if (S.day <= bill.due) return;
  bill.lateDays++;
  const n = bill.lateDays;
  addRep(n <= 3 ? -0.5 : n <= 6 ? -1 : -2);
  bill.amount *= 1 + CONFIG.taxPenaltyDaily;
  if (n === 1) deliver(MAILBOX.taxLate(bill));
  if (n >= CONFIG.taxAuditAfterDays && !S.audited){
    S.audited = true;
    const seized = netWorth() * 0.35;
    let left = seized;
    for (const id in S.bank){
      const take = Math.min(S.bank[id].balance, left);
      S.bank[id].balance -= take; left -= take;
    }
    S.cash = Math.max(0, S.cash - left);
    addRep(-40);
    bill.paid = true;
    deliver(MAILBOX.audit(seized));
  }
}

const absTick = () => (S.day - 1) * CONFIG.ticksPerDay + S.tick;

/* Roll a story's hidden truth. Everything here is decided now; the prose the
   player reads is rendered from the same object. */
function spawnEffects(story, subject){
  const inverted = rand() < CONFIG.newsInversionChance;
  for (const e of story.effects){
    let target = e.t;
    if (subject){
      if (target === "self") target = subject.ticker;
      else if (target === "sector") target = "sector:" + subject.sector;
    }
    const mag = e.mag * (0.45 + 1.15 * rand()) * (inverted ? -0.35 : 1);
    S.effects.push({
      t: target,
      dir: e.dir,
      mag,
      born: absTick(),
      delay: Math.floor(CONFIG.newsDelayMin + rand() * (CONFIG.newsDelayMax - CONFIG.newsDelayMin)),
      life: Math.floor(CONFIG.newsLifeMin + rand() * (CONFIG.newsLifeMax - CONFIG.newsLifeMin)),
    });
  }
}

/* Per-tick drift contributed by live effects, keyed by what they target.
   Front-loaded and decaying to nothing, integrating to the rolled magnitude. */
function effectDrift(){
  const out = { market:0, sector:{}, ticker:{} };
  const now = absTick();
  S.effects = S.effects.filter(e => now - e.born <= e.delay + e.life);
  for (const e of S.effects){
    const age = now - e.born;
    if (age < e.delay) continue;
    const u = (age - e.delay) / e.life;
    const perTick = e.dir * e.mag * (2 / e.life) * (1 - u);
    if (e.t === "market") out.market += perTick;
    else if (e.t.startsWith("sector:")){
      const k = e.t.slice(7);
      out.sector[k] = (out.sector[k] || 0) + perTick;
    } else if (e.t.startsWith("role:")){
      for (const tk of S.roleIndex[e.t.slice(5)] || [])
        out.ticker[tk] = (out.ticker[tk] || 0) + perTick;
    } else out.ticker[e.t] = (out.ticker[e.t] || 0) + perTick;
  }
  return out;
}

let storySeq = 0;
function fireStory(tpl, isFiller, subject){
  const outlet = OUTLETS[tpl.outlet];
  const co = subject ? {
    co: subject.name, tk: subject.ticker, sec: SECTORS[subject.sector].name,
    an: pick(SLOTS.analyst), idx: pick(Object.values(INDICES).map(i => i.name)),
    ord: pick(["eleventh","nineteenth","twenty-second","thirty-first","fourteenth"]),
    cutpct: String(20 + Math.floor(rand() * 45)),
    bb: (Math.max(0.4, marketCap(subject) / 1e9 * (0.05 + rand() * 0.2))).toFixed(1),
  } : null;
  const sub = str => co ? str.replace(/\{(\w+)\}/g, (m, k) => co[k] !== undefined ? co[k] : m) : str;
  const item = {
    n: ++storySeq,
    id: tpl.id || ("filler" + storySeq),
    outlet: tpl.outlet,
    outletName: outlet.name,
    author: pick(outlet.authors),
    tag: tpl.tag || null,
    head: sub(fill(tpl.head)),
    body: (tpl.body || []).map(x => sub(fill(x))),
    day: S.day,
    tick: S.tick,
    filler: !!isFiller,
    about: subject ? subject.ticker : null,
    weight: (tpl.effects || []).reduce((t, e) => t + Math.abs(e.mag), 0),
    read: false,
  };
  S.news.unshift(item);
  if (S.news.length > 120) S.news.pop();
  if (!isFiller) spawnEffects(tpl, subject);

  /* The wire does NOT post to the inbox. Eight stories a day turns the mail
     into a feed and buries the things that actually need answering — a tax
     statement, a loan coming due, a letter from a person. The inbox is for
     correspondence; the wire is for news, and the two are different. The only
     bridge is one newsletter at the close naming the day's main event. */
  if (!isFiller) flash("Story breaking — check the wire.");
}

/* Three significant events a day plus filler, at unannounced ticks. */
function scheduleDay(){
  const slots = [];
  const spread_ = (n, kind) => {
    for (let i = 0; i < n; i++){
      const lo = Math.floor(CONFIG.ticksPerDay * (0.04 + 0.92 * i / n));
      const hi = Math.floor(CONFIG.ticksPerDay * (0.04 + 0.92 * (i + 1) / n));
      slots.push({ tick: lo + Math.floor(rand() * Math.max(1, hi - lo)), kind });
    }
  };
  spread_(CONFIG.storiesPerDay, "macro");
  spread_(grants("full_universe") ? CONFIG.companyStoriesPerDay : 1, "company");
  for (let i = 0; i < CONFIG.fillerPerDay; i++)
    slots.push({ tick: Math.floor(rand() * CONFIG.ticksPerDay), kind:"filler" });
  S.schedule = slots.sort((a, b) => a.tick - b.tick);
}

/* Prefer stories the player has not seen recently, so a short bank does not
   feel short. */
function nextStory(){
  const recent = new Set(S.news.filter(x => !x.filler).slice(0, 8).map(x => x.id));
  const fresh = STORIES.filter(s => !recent.has(s.id));
  return pick(fresh.length ? fresh : STORIES);
}

/* Filler is noise, but the same piece of noise twice in a morning reads as a
   bug rather than as a slow news day. */
function nextFiller(){
  const usedToday = new Set(S.news.filter(x => x.filler && x.day === S.day).map(x => x.head));
  const fresh = FILLER.filter(f => !usedToday.has(f.head));
  return pick(fresh.length ? fresh : FILLER);
}

function excerpt(str, n){
  if (str.length <= n) return str.replace(/[.,;:\s]+$/, "");
  return str.slice(0, str.lastIndexOf(" ", n)).replace(/[.,;:\s]+$/, "");
}

/* Pick who the press writes about, then pick a story that fits them. */
function nextCompanyStory(){
  const subject = weightedCompany();
  const isAI = subject.sector === "ai";
  const pool = COMPANY_STORIES.filter(t => !t.only || (isAI && t.only === "ai"));
  const recent = new Set(S.news.filter(x => x.about === subject.ticker).slice(0, 4).map(x => x.id));
  const fresh = pool.filter(t => !recent.has(t.id));
  return { tpl: pick(fresh.length ? fresh : pool), subject };
}

function runSchedule(){
  if (!S.schedule) return;
  while (S.schedule.length && S.schedule[0].tick <= S.tick){
    const slot = S.schedule.shift();
    if (slot.kind === "filler") fireStory(nextFiller(), true);
    else if (slot.kind === "company"){
      const { tpl, subject } = nextCompanyStory();
      fireStory(tpl, false, subject);
    } else fireStory(nextStory(), false);
  }
}

/* ===========================================================================
   4c. THE SOCIAL SITES

   Two crowds, both mostly wrong, wrong in different ways.

   Bagel is a forum: slow, long, sincere, and occasionally carrying a rumour
   that is right about one time in twenty. Everything is generated from the
   world seed and the day, so the same day always produces the same thread and
   a player cannot reroll the feed by refreshing.

   Scoop is a chat server: fast, stupid, and the only place a pump is called
   before it runs. Catching one is rare and enormous, and most of what gets
   called is nothing at all.

   Neither of them is a signal source you can farm. They are a place to be
   tempted.
   ======================================================================== */

const HANDLE_A = ["deep","wet","moist","hefty","tiny","massive","sweaty","crusty","turbo","mega",
  "based","cursed","sigma","gamma","raw","damp","lord","big","lil","uncle","auntie","grandma",
  "certified","unhinged","feral","liquid","hard","soft","spicy","tactical"];
const HANDLE_B = ["gooner","chodemonger","tendies","bagholder","liquidator","degenerate","boomer",
  "zoomer","cucumber","moisture","ballsack","tosser","wanker","plumber","nonce","gremlin","wizard",
  "scrotum","hamster","pigeon","toenail","sausage","crumpet","knobhead","muppet","prawn","weasel"];
const HANDLE_C = ["69","420","1971","_xX","___","2008","_irl","_ftw","88","007","_uk","_ohio",
  "99","_prime","_real","_official","_hd","1337","_v2"];

/* Deterministic per (seed, day, slot) so a feed cannot be rerolled. */
function feedRng(salt){
  return mulberry32((S.seed ^ 0x1f2e3d4c) + S.day * 7919 + salt * 104729);
}
function handleFrom(r){
  const p = a => a[Math.floor(r() * a.length)];
  let h = p(HANDLE_A) + p(HANDLE_B);
  if (r() < 0.55) h += p(HANDLE_C);
  return h;
}

function bagelFeed(){
  const out = [];
  for (let i = 0; i < 14; i++){
    const r = feedRng(i + 1);
    const roll = r();
    const kind = roll < 0.40 ? "junk" : roll < 0.66 ? "nonsense" : roll < 0.87 ? "news" : "tip";
    const pool = BAGEL_POSTS[kind];
    const title = pool[Math.floor(r() * pool.length)];
    const sub = BAGEL_SUBS[Math.floor(r() * BAGEL_SUBS.length)];
    const subject = kind === "tip" ? weightedCompany() : null;

    out.push({
      id: "b" + S.day + "_" + i,
      kind, sub: sub.name, title,
      user: handleFrom(r),
      score: Math.floor(r() * (kind === "nonsense" ? 4000 : 900)) - (r() < 0.12 ? 300 : 0),
      comments: Math.floor(r() * 240) + 2,
      hours: Math.floor(r() * 20) + 1,
      about: subject ? subject.ticker : null,
      aboutName: subject ? subject.name : null,
      // one tip in twenty is real; the rest are a bloke in a pub
      real: kind === "tip" && r() < CONFIG.bagelTipAccuracy,
      dir: r() < 0.5 ? -1 : 1,
      seedN: i,
    });
  }
  return out.sort((a, b) => b.score - a.score);
}

function bagelComments(post){
  const r = feedRng(post.seedN + 500);
  const n = 4 + Math.floor(r() * 6);
  const out = [];
  for (let i = 0; i < n; i++){
    out.push({
      user: handleFrom(r),
      body: BAGEL_COMMENTS[Math.floor(r() * BAGEL_COMMENTS.length)],
      score: Math.floor(r() * 400) - 40,
      replies: r() < 0.35 ? [{
        user: handleFrom(r),
        body: BAGEL_COMMENTS[Math.floor(r() * BAGEL_COMMENTS.length)],
        score: Math.floor(r() * 90) - 10,
      }] : [],
    });
  }
  return out;
}

function scoopFeed(channel){
  const base = SCOOP_CHANNELS.findIndex(c => c.id === channel);
  const r = feedRng(900 + base);
  const lines = SCOOP_LINES[channel];
  const out = [];
  let minute = 9 * 60 + Math.floor(r() * 20);
  // Walk the channel's lines in a shuffled order rather than drawing each one
  // independently. A chat log that says the same thing three times in a screen
  // does not read as a busy room, it reads as a bug.
  const order = lines.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  for (let i = 0; i < Math.min(26, order.length * 2); i++){
    minute += Math.floor(r() * 14) + 1;
    out.push({
      user: handleFrom(r),
      body: lines[order[i % order.length]],
      time: `${String(Math.floor(minute/60)).padStart(2,"0")}:${String(minute%60).padStart(2,"0")}`,
      hue: Math.floor(r() * 360),
    });
  }
  return out;
}

/* The pump. Called in #the-calls, rarely, and it is the only thing on either
   site that is worth real money. Most of them do nothing. */
function scoopPump(){
  const r = feedRng(4242);
  if (r() > CONFIG.pumpChancePerDay) return null;
  const pool = listedAssets().filter(a => !a.isFund);
  const target = pool[Math.floor(r() * pool.length)];
  return {
    ticker: target.ticker, name: target.name,
    caller: handleFrom(r),
    genuine: r() < CONFIG.pumpGenuineChance,
    time: `${9 + Math.floor(r() * 6)}:${String(Math.floor(r() * 60)).padStart(2,"0")}`,
  };
}

/* ===========================================================================
   CREDENTIALS

   One username and one four-digit code, chosen before the first trading day.
   The username becomes your address at nscrape.com and your login at every
   institution in the game. The code unlocks each of them once, the first time
   you turn up as a customer, and never again after that.

   It is not security. It is the small ritual of being a person with accounts,
   and it makes the tier-22 private bank's passcode screen mean something,
   because by then you have typed those four digits twenty times.
   ======================================================================== */

const HANDLE_RE = /^[a-z0-9_]{3,16}$/;
const handleOk = h => HANDLE_RE.test(h);
const pinOk    = p => /^[0-9]{4}$/.test(p);
const emailOf  = () => `${S.handle}@nscrape.com`;

/* Refusals are written by the institution, not by the game. A community bank
   apologises for the inconvenience; a private bank does not acknowledge that
   there has been one. */
const REFUSALS = {
  ballsworth: "That code did not match our records. Please try again, or telephone the branch during business hours.",
  cockburn:   "The code entered does not correspond to this account. Kindly try once more.",
  hornby:     "Authentication failed.<sup>1</sup> Repeated failure may result in a review of your facilities.",
  schlongate: "Hmm, that's not it — give it another go! 🔐",
  wiener:     "That is not the code.",
  gaping:     "ENTRY REJECTED · CODE 41-B · RESUBMIT LINE 1",
  penistone:  "No.",
  prima:      "Incorrect.",
  tugmore:    "The code you entered does not match our records. Please try again.",
  squirtr:    "oops! wrong code 🙈 try again",
  titwell:    "The credentials supplied could not be verified against this account.",

const instName = id => (BANKS[id] || BROKERAGES[id] || {}).name || id;

const isUnlocked = id => !S.pin || !!(S.unlocked && S.unlocked[id]);

/* A bank asks once you are a customer; a brokerage asks on first arrival,
   because you are enrolled at one of them from day one. */
function bankLocked(id){
  if (!S.pin || id === "prima") return false;        // Prima runs its own door
  return !!acct(id).opened && !isUnlocked(id);
}
const brokerLocked = id => !!S.pin && !isUnlocked(id);

function tryUnlock(id){
  const el = document.getElementById("lock-code");

    S.lastOk = `Signed in to ${instName(id)} as ${S.handle}.`;
    if (id === "prima") S.primaUnlocked = true;
    return render();
  }
  S.pinErr = REFUSALS[id] || "That code is not correct.";
  return render();
}

   4b. GARGLE GAMES

   Two things a search engine has no business hosting, hosted by a search
   engine. They live outside S because a high score is not a save file and
   nobody should be able to load a snake.
   ======================================================================== */
const ARC = {
  active: null,               // null | "snake" | "mine"
  snake: null,
  mine: null,
  best: { snake:0, mine:null },
  timer: null,
  loop: null,
};

function arcOpen(kind){
  arcStop();
  ARC.active = kind;
  if (kind === "snake") snakeNew();
  if (kind === "mine")  mineNew(ARC.mine ? ARC.mine.level : "beginner");
  render();
}
function arcClose(){ arcStop(); ARC.active = null; render(); }
function arcStop(){
  if (ARC.loop)  { clearInterval(ARC.loop);  ARC.loop  = null; }
  if (ARC.timer) { clearInterval(ARC.timer); ARC.timer = null; }
}

/* ---- Snake -------------------------------------------------------------- */
const SNAKE_W = 24, SNAKE_H = 18;

function snakeNew(){
  const mid = { x: 6, y: (SNAKE_H / 2) | 0 };
  ARC.snake = {
    body: [{ x:mid.x, y:mid.y }, { x:mid.x-1, y:mid.y }, { x:mid.x-2, y:mid.y }],
    dir: { x:1, y:0 }, next: { x:1, y:0 },
    food: null, score: 0, alive: true, started: false, tick: 0,
  };
  snakeFood();
}
function snakeFood(){
  const g = ARC.snake, free = [];
  for (let y = 0; y < SNAKE_H; y++)
    for (let x = 0; x < SNAKE_W; x++)
      if (!g.body.some(s => s.x === x && s.y === y)) free.push({ x, y });
  g.food = free[(Math.random() * free.length) | 0] || { x:0, y:0 };
}
function snakeGo(dx, dy){
  const g = ARC.snake; if (!g) return;
  if (g.dir.x === -dx && g.dir.y === -dy) return;   // no reversing into yourself
  g.next = { x:dx, y:dy };
  if (!g.started && g.alive) snakeRun();
}
function snakeRun(){
  const g = ARC.snake; if (!g || !g.alive) return;
  g.started = true;
  arcStop();
  ARC.loop = setInterval(snakeStep, 105);
  snakePaint();
}
function snakeStep(){
  const g = ARC.snake;
  if (!g || !g.alive) return arcStop();
  if (!document.getElementById("snake-cv")) return arcStop();   // navigated away
  g.dir = g.next; g.tick++;
  const head = { x: g.body[0].x + g.dir.x, y: g.body[0].y + g.dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= SNAKE_W || head.y >= SNAKE_H;
  const hitSelf = g.body.some((s, i) => i < g.body.length - 1 && s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf){
    g.alive = false; arcStop();
    ARC.best.snake = Math.max(ARC.best.snake, g.score);
    return render();
  }
  g.body.unshift(head);
  if (head.x === g.food.x && head.y === g.food.y){
    g.score += 10;
    snakeFood();
    /* it gets faster, because otherwise it is just a long walk */
    const ms = Math.max(52, 105 - Math.floor(g.score / 10) * 3);
    arcStop(); ARC.loop = setInterval(snakeStep, ms);
    const el = document.getElementById("snake-score");
    if (el) el.textContent = String(g.score);
  } else g.body.pop();
  snakePaint();
}
function snakePaint(){
  const cv = document.getElementById("snake-cv"), g = ARC.snake;
  if (!cv || !g) return;
  const dpr = window.devicePixelRatio || 1;
  const cell = Math.max(10, Math.floor(cv.clientWidth / SNAKE_W));
  const w = cell * SNAKE_W, h = cell * SNAKE_H;
  if (cv.width !== w * dpr || cv.height !== h * dpr){
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.height = h + "px";
  }
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = "#0f1a14"; c.fillRect(0, 0, w, h);
  c.strokeStyle = "rgba(255,255,255,.035)"; c.lineWidth = 1;
  for (let x = 1; x < SNAKE_W; x++){ c.beginPath(); c.moveTo(x*cell+.5,0); c.lineTo(x*cell+.5,h); c.stroke(); }
  for (let y = 1; y < SNAKE_H; y++){ c.beginPath(); c.moveTo(0,y*cell+.5); c.lineTo(w,y*cell+.5); c.stroke(); }

  const r = Math.max(2, Math.floor(cell * 0.22));
  const box = (x, y, fill, inset) => {
    c.fillStyle = fill;
    c.beginPath();
    c.roundRect(x*cell+inset, y*cell+inset, cell-inset*2, cell-inset*2, r);
    c.fill();
  };
  box(g.food.x, g.food.y, "#ea4335", Math.max(2, cell*0.22));
  g.body.forEach((s, i) => {
    const t = i / Math.max(1, g.body.length - 1);
    box(s.x, s.y, i === 0 ? "#34a853" : `rgb(${52+t*30|0},${168-t*54|0},${83+t*60|0})`, 1);
  });
  if (g.body[0]){                                   // eyes, facing the way it is going
    const hx = g.body[0].x*cell, hy = g.body[0].y*cell, e = Math.max(1.6, cell*0.11);
    c.fillStyle = "#0f1a14";
    const off = cell*0.3, fwd = cell*0.62;
    const ex = g.dir.x ? hx + (g.dir.x > 0 ? fwd : cell-fwd) : hx + cell/2;
    const ey = g.dir.y ? hy + (g.dir.y > 0 ? fwd : cell-fwd) : hy + cell/2;
    const px = g.dir.x ? 0 : off, py = g.dir.x ? off : 0;
    c.beginPath(); c.arc(ex-px, ey-py, e, 0, 7); c.fill();
    c.beginPath(); c.arc(ex+px, ey+py, e, 0, 7); c.fill();
  }
}

/* ---- Minesweeper -------------------------------------------------------- */
const MINE_LEVELS = {
  beginner:     { w:9,  h:9,  n:10, label:"Beginner" },
  intermediate: { w:16, h:16, n:40, label:"Intermediate" },
  expert:       { w:24, h:16, n:80, label:"Expert" },
};

function mineNew(level){
  const L = MINE_LEVELS[level] || MINE_LEVELS.beginner;
  ARC.mine = {
    level: MINE_LEVELS[level] ? level : "beginner",
    w:L.w, h:L.h, n:L.n,
    cells: Array.from({ length:L.w*L.h }, () => ({ mine:false, open:false, flag:false, near:0 })),
    seeded:false, dead:false, won:false, started:0, elapsed:0, flagMode:false,
  };
}
function mineSeed(safe){
  const m = ARC.mine, idx = [];
  for (let i = 0; i < m.cells.length; i++){
    const sx = i % m.w, sy = (i / m.w) | 0, fx = safe % m.w, fy = (safe / m.w) | 0;
    if (Math.abs(sx - fx) <= 1 && Math.abs(sy - fy) <= 1) continue;   // first click is always safe
    idx.push(i);
  }
  for (let k = 0; k < m.n && idx.length; k++){
    const j = (Math.random() * idx.length) | 0;
    m.cells[idx[j]].mine = true; idx.splice(j, 1);
  }
  for (let i = 0; i < m.cells.length; i++) m.cells[i].near = mineNeighbours(i).filter(j => m.cells[j].mine).length;
  m.seeded = true; m.started = Date.now();
  arcStop();
  ARC.timer = setInterval(() => {
    if (!ARC.mine || ARC.mine.dead || ARC.mine.won) return arcStop();
    if (!document.getElementById("mine-grid")) return arcStop();
    ARC.mine.elapsed = Math.min(999, Math.floor((Date.now() - ARC.mine.started) / 1000));
    const el = document.getElementById("mine-time");
    if (el) el.textContent = String(ARC.mine.elapsed).padStart(3, "0");
  }, 250);
}
function mineNeighbours(i){
  const m = ARC.mine, x = i % m.w, y = (i / m.w) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < m.w && ny < m.h) out.push(ny * m.w + nx);
  }
  return out;
}
function mineOpen(i){
  const m = ARC.mine;
  if (!m || m.dead || m.won) return;
  const c = m.cells[i];
  if (c.flag || c.open) return;
  if (!m.seeded) mineSeed(i);
  c.open = true;
  if (c.mine){ m.dead = true; arcStop(); m.cells.forEach(x => { if (x.mine) x.open = true; }); return; }
  if (c.near === 0){
    const q = [i];
    while (q.length){
      for (const j of mineNeighbours(q.pop())){
        const d = m.cells[j];
        if (d.open || d.flag || d.mine) continue;
        d.open = true;
        if (d.near === 0) q.push(j);
      }
    }
  }
  mineCheckWin();
}
function mineFlag(i){
  const m = ARC.mine;
  if (!m || m.dead || m.won || m.cells[i].open) return;
  m.cells[i].flag = !m.cells[i].flag;
}
function mineCheckWin(){
  const m = ARC.mine;
  if (m.cells.every(c => c.open || c.mine)){
    m.won = true; arcStop();
    m.cells.forEach(c => { if (c.mine) c.flag = true; });
    const t = m.elapsed;
    const b = ARC.best.mine;
    if (!b || b.level !== m.level || t < b.time) ARC.best.mine = { level:m.level, time:t };
  }
}
const mineLeft = () => { const m = ARC.mine; return m.n - m.cells.filter(c => c.flag).length; };

}

/* The clock. Skipping is not a pause: the simulation runs every skipped day in
   full, news fires, prices move, and your positions move with them. You simply
   cannot intervene. The fee is small on purpose — the real cost of skipping is
   that a bull run skipped is a bull run missed. */
function timePanelHTML(){
  const open = S.phase === "open";
  const d = gameDate(S.day);
  return `<div class="timebar">
    <div class="tb-now">
      <div class="tb-label">${open ? "Market open" : "Closed \u2014 planning"}</div>
      <div class="tb-val num">${open ? clockLabel() : "--:--"}</div>
      <div class="tb-sub">${esc(d.label)} &middot; day ${S.day} &middot; tick ${S.tick} of ${CONFIG.ticksPerDay}</div>
    </div>
    <div class="tb-acts">
      ${open
        ? `<button id="btn-skipday">Skip the rest of today &middot; ${money(CONFIG.skipDayFee)}</button>
           <button id="btn-skipweek">Skip five days &middot; ${money(CONFIG.skipWeekFee)}</button>`
        : `<button class="primary" id="btn-openday">Open the market</button>
           <button id="btn-skipweek">Skip five days &middot; ${money(CONFIG.skipWeekFee)}</button>`}
    </div>
  </div>`;
}

function skipFee(days){
  const f = days > 1 ? CONFIG.skipWeekFee : CONFIG.skipDayFee;
  if (S.cash < f){
    S.lastError = `Skipping costs ${money(f)} and you have ${money(S.cash)} in cash. `
                + `Nothing will be sold on your behalf \u2014 raise it yourself.`;
    render(); return null;
  }
  return f;
}

function runSkip(days){
  const f = skipFee(days);
  if (f === null) return;
  S.cash -= f;
  const before = { nw:netWorth(), day:S.day };
  const seen = S.news.length;
  for (let i = 0; i < days; i++){
    if (S.phase !== "open") openDay();
    while (S.phase === "open") stepTick();
  }
  const fired = S.news.slice(0, S.news.length - seen).filter(x => !x.filler);
  const after = netWorth();
  const ch = (after - before.nw) / Math.max(before.nw, 1) * 100;
  render();
  dialog(days > 1 ? "Five days later" : "The bell", `
    <dl>
      <dt>Days elapsed</dt><dd>${S.day - before.day}</dd>
      <dt>Fee paid</dt><dd>${money(f)}</dd>
      <dt>Net worth</dt><dd class="${cls(ch)}">${money(after)} (${pct(ch)})</dd>
    </dl>
    ${S.positions.length ? `<p class="small" style="margin-top:12px">You held
      ${S.positions.map(p => p.ticker).join(", ")} throughout. Nothing was managed while you were away.</p>` : ""}
    <p class="small muted" style="margin-top:12px">${fired.length
      ? "Headlines you missed: " + fired.slice(0, 5).map(x => x.head).join("; ") + "."
      : "Nothing of substance crossed the wire."}</p>`,
    [{ label:"Close", fn:render }]);
}

const idxPct = ix => (ix.value - ix.prevClose) / ix.prevClose * 100;

  const sel = S.mail.find(m => m.id === S.openMail) || pool[0] || S.mail[0];
  if (sel && !sel.read){
    sel.read = true;
    if (sel.onRead) setTimeout(() => step(sel.onRead), 0);
  }
  const unread = S.mail.filter(m => !m.read).length;

  const list = pool.map(m => `
    <div class="msg ${m.read ? "" : "unread"} ${sel && m.id === sel.id ? "on" : ""}" data-mail="${m.id}">
      <div class="from">
        <span>${m.read ? "" : '<span class="dot"></span>'}${esc(m.from)}</span>
        <span class="small muted">Day ${m.day}</span>
      </div>
      <div class="subj">${esc(m.subject)}</div>
    </div>`).join("");

  const body = !sel ? '<div class="muted">No messages.</div>' : `
    <div class="mh">
      <h2>${esc(sel.subject)}</h2>
      <div class="meta">${esc(sel.from)} &lt;${esc(sel.addr)}&gt; &middot; trading day ${sel.day}</div>
    </div>
    <div class="bd"${sel.mono ? ' style="font-family:var(--mono);font-size:12.5px"' : ""}>
      ${sel.body.map(p => `<p>${esc(p)}</p>`).join("")}
    </div>
    ${sel.action ? `<div class="actions"><button class="primary" data-go="${sel.action.url}">${esc(sel.action.label)}</button></div>` : ""}`;

  return `<div class="site mail">
    <div class="hdr">
      <div><b>Mail</b>
        <div class="mailtabs">
          ${[["all","All"],["important","Needs you"],["unread","Unread"],["wire","Newsletters"]]
            .map(([k,l]) => `<span class="mt ${f===k?"on":""}" data-mailfilter="${k}">${l}${
              k==="important" ? ` <b>${S.mail.filter(m=>m.important&&!m.read).length||""}</b>` : ""}</span>`).join("")}
        </div>
      </div>
      <span class="small muted">${esc(emailOf())} &middot; ${unread} unread</span>
    </div>
    <div class="split"><div class="list">${list}</div><div class="read">${body}</div></div>
  </div>`;
}

function renderMarkets(){
  const q = (S.search || "").trim().toUpperCase();
  let list = listedAssets();
  if (q) list = list.filter(a => a.ticker.includes(q) || a.name.toUpperCase().includes(q));

  const k = S.sortKey, dir = S.sortDir;
  list.sort((x, y) => {
    const v = a => ({ ticker:a.ticker, name:a.name, price:a.price,
      change:(a.price - a.prevClose) / a.prevClose, volume:a.volume,
      cap:marketCap(a), coverage:coverageWeight(a),
      sector:SECTORS[a.sector].name }[k]);
    const A = v(x), B = v(y);
    return (typeof A === "string" ? A.localeCompare(B) : A - B) * dir;
  });

  const th = (key, label, right) =>
    `<th class="${right ? "r" : ""}"><span class="lnk" data-sort="${key}">${label}${
      k === key ? (dir > 0 ? " ▲" : " ▼") : ""}</span></th>`;

  const rows = list.map(a => {
    const ch = (a.price - a.prevClose) / a.prevClose * 100;
    return `<tr class="row" data-quote="${a.ticker}">
      <td><b class="lnk">${a.ticker}</b>${a.sector === "ai" ? ' <span class="hot">AI</span>' : ""}</td>
      <td>${esc(a.name)}</td>
      <td class="small muted">${esc(SECTORS[a.sector].name)}</td>
      <td class="r num" ${lv("price",a.ticker)}>${money(a.price)}</td>
      <td class="r num ${cls(ch)}" ${lv("change",a.ticker)}>${pct(ch)}</td>
      <td class="r num muted" ${lv("bidask",a.ticker)}>${money(bidOf(a))} / ${money(askOf(a))}</td>
      <td class="r num muted" ${lv("vol",a.ticker)}>${a.volume.toLocaleString("en-US")}</td>
      <td class="r num muted" ${lv("cap",a.ticker)}>${capLabel(a)}</td>
      <td class="r num">${a.div.toFixed(1)}%</td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="muted" style="padding:20px">No matches for "${esc(q)}".</td></tr>`;

  return `<div class="site quill">
    <div class="masthead">
      <h1>The Quill Street Journal</h1>
      <div class="sub">Markets &amp; Quotations \u2014 prices, screens and company profiles</div>
    </div>
    <div class="navbar"><span class="on">Markets</span>
      <span class="lnk" data-go="quillstreet.com/news">News</span><span>Opinion</span><span>Archive</span></div>
    ${indexStripHTML()}
    <div class="wrap">
      <div class="toolrow">
        <input id="q-search" placeholder="Ticker or company name" value="${esc(S.search || "")}" style="width:240px">
        <button id="q-go">Search</button>
        ${q ? '<button id="q-clear">Clear</button>' : ""}
        <span class="muted small">Click a column heading to sort.</span>
      </div>
      <table>
        <tr>${th("ticker","Symbol")}${th("name","Company")}${th("sector","Sector")}
            ${th("price","Last",1)}${th("change","Change",1)}
            <th class="r">Bid / Ask</th>${th("volume","Volume",1)}${th("cap","Mkt cap",1)}<th class="r">Yield</th></tr>
        ${rows}
      </table>
      <div style="max-width:340px;margin:18px 0">${adSlot(2)}</div>
      <div class="small muted" style="margin-top:14px">
        ${list.length} of ${listedAssets().length} listed. Bid is what you will be paid. Ask is what you will pay.
      </div>
    </div>
    ${checklistHTML()}
  </div>`;
}

/* The feed. Significant stories look different from filler at a glance —
   a tag, a masthead, two paragraphs. Filler is one line in a small font from
   an outlet you learn to stop reading. Length is itself a signal. */
function renderNews(){
  const open = S.news.find(x => x.n === S.openNews);
  const filter = S.newsFilter;
  let items = S.news;
  if (filter === "significant") items = items.filter(x => !x.filler);
  if (filter === "today") items = items.filter(x => x.day === S.day);

  if (open){
    open.read = true;
    if (!open.filler) setTimeout(() => step("read_story"), 0);
    const o = OUTLETS[open.outlet];
    return `<div class="site quill">
      <div class="masthead"><h1>${esc(o.name)}</h1><div class="sub">${open.tag ? esc(open.tag) : "Report"}</div></div>
      <div class="navbar"><span class="lnk" data-go="quillstreet.com/news">&larr; Back to the feed</span></div>
      <div class="wrap">
        <article>
          ${open.tag ? `<div class="tagpill ${open.tag === "BREAKING" ? "brk" : "imp"}">${esc(open.tag)}</div>` : ""}
          <h2 style="font:400 28px var(--serif);letter-spacing:-.5px;margin:6px 0 4px;max-width:620px">${esc(open.head)}</h2>
          <div class="byline">By ${esc(open.author)} &middot; ${esc(o.name)} &middot; ${gameDate(open.day).label}, ${tickClock(open.tick)}</div>
          ${open.body.length ? open.body.map(p => `<p>${esc(p)}</p>`).join("")
            : '<p class="muted">No further detail was filed.</p>'}
        </article>
        <div class="small muted" style="margin-top:26px;max-width:620px;border-top:1px solid var(--line);padding-top:14px">
          Nothing on this page tells you which companies it touches. Look them up.
        </div>
      </div>
    </div>`;
  }

  const lead = items.find(x => !x.filler);
  const rest = items.filter(x => x !== lead);

  return `<div class="site quill">
    <div class="masthead"><h1>The Wire</h1>
      <div class="sub">News \u2014 aggregated from everything you subscribe to</div></div>
    <div class="navbar">
      <span class="lnk ${filter==="all"?"on":""}" data-newsfilter="all">Everything</span>
      <span class="lnk ${filter==="significant"?"on":""}" data-newsfilter="significant">Significant only</span>
      <span class="lnk ${filter==="today"?"on":""}" data-newsfilter="today">Today</span>
      <span class="lnk" data-go="quillstreet.com/markets">Markets</span>
    </div>
    <div class="wrap">
      ${!items.length ? '<div class="muted" style="padding:40px 0">Nothing has printed yet. The wire runs during market hours.</div>' : ""}
      ${lead ? `<div class="lead" data-news="${lead.n}">
        ${lead.tag ? `<div class="tagpill ${lead.tag === "BREAKING" ? "brk" : "imp"}">${esc(lead.tag)}</div>` : ""}
        <h2>${esc(lead.head)}</h2>
        <div class="byline">By ${esc(lead.author)} &middot; ${esc(lead.outletName)} &middot; day ${lead.day}, ${tickClock(lead.tick)}</div>
        <p>${esc(excerpt(lead.body[0] || "", 220))}&hellip;</p>
      </div>` : ""}
      <div style="max-width:340px;margin:0 0 18px">${adSlot(3)}</div>
      <div class="feed">
        ${rest.map(x => x.filler ? `
          <div class="fillerrow" data-news="${x.n}">
            <span class="src">${esc(x.outletName)}</span>
            <span class="hd">${esc(x.head)}</span>
            <span class="tm">day ${x.day}</span>
          </div>` : `
          <div class="storyrow ${x.read ? "" : "fresh"}" data-news="${x.n}">
            <div>
              ${x.tag ? `<span class="tagpill sm ${x.tag === "BREAKING" ? "brk" : "imp"}">${esc(x.tag)}</span>` : ""}
              <span class="hd">${esc(x.head)}</span>

function renderIndex(){
  const ix = S.indices[S.openIndex] || S.indices.STR;

  return `<div class="site quill">
    <div class="masthead"><h1>${esc(ix.name)}</h1>
      <div class="sub">${esc(ix.symbol)} &middot; ${ix.weight === "price" ? "price-weighted" : "capitalisation-weighted"} &middot; ${members.length} constituents &middot; since ${ix.inception}</div></div>

      <h3 style="font:600 13px var(--ui);margin:0 0 8px">Largest constituents by weight</h3>

        regardless of how large the company behind it is.</div>` : ""}
    </div>
  </div>`;
}

/* ===========================================================================
   THE BROKERAGES

   Six firms, six interfaces that share nothing but the data behind them. A
   brokerage is the screen a player spends the whole career staring at, and
   "the same page with a different header colour" is the laziest thing a game
   like this can do.

   Every layout is fed by brokerData(), so the numbers cannot diverge from each
   other, and every layout keeps the same control ids so the same keystrokes
   and the same tests work everywhere.
   ======================================================================== */
function brokerData(){
  const a = S.assets[S.watchSel] || S.assets.IVS;
  const ch = (a.price - a.prevClose) / a.prevClose * 100;
  return {
    a, ch,
    open: S.phase === "open",
    held: holding(S.watchSel),
    firms: availableBrokers(),
    list: listedAssets(),
    full: grants("full_universe"),
    slots: slotCount(),
    canBuy: S.phase === "open" && !holding(S.watchSel) && S.positions.length < slotCount(),
    canSell: S.phase === "open" && !!holding(S.watchSel),
  };
}

/* Shared fragments. Each firm decides where they go and what they look like,
   never what they say. */
function fragPositions(d, cls){
  if (!S.positions.length)
    return `<div class="${cls}-empty">No open positions. Your account supports ${d.slots} at a time.</div>`;
  return `<table class="${cls}-postable">
    <tr><th>Symbol</th><th class="r">Shares</th><th class="r">Cost</th><th class="r">Last</th>
        <th class="r">Value</th><th class="r">Open P/L</th><th></th></tr>
    ${S.positions.map(p => {
      const pa = S.assets[p.ticker], q = pnlOf(p);
      return `<tr class="row" data-watch="${p.ticker}">
        <td><b>${p.ticker}</b><div class="tiny">${esc(pa.name)}</div></td>
        <td class="r num">${p.shares.toFixed(4)}</td>
        <td class="r num">${money(p.costBasis)}</td>
        <td class="r num" ${lv("poslast", p.ticker)}>${money(q.bid)}</td>
        <td class="r num" ${lv("posvalue", p.ticker)}>${money(q.value)}</td>
        <td class="r num ${cls_(q.pnl)}" ${lv("pospnl", p.ticker)}>${money(q.pnl)}</td>
        <td class="r"><button class="mini" data-sellone="${p.ticker}" ${d.open ? "" : "disabled"}>Sell</button></td>
      </tr>`;
    }).join("")}
  </table>`;
}
const cls_ = cls;   // the layouts shadow `cls` with a class-name argument

function fragSymbolInput(d){
  return d.full
    ? `<input id="t-sym" value="${esc(S.watchSel)}" spellcheck="false" autocomplete="off">`
    : `<select id="t-sym">${d.list.map(x =>
        `<option ${x.ticker === S.watchSel ? "selected" : ""}>${x.ticker}</option>`).join("")}</select>`;
}

function fragBrokerPicker(d){
  if (d.firms.length < 2) return "";
  return `<select id="t-broker">${d.firms.map(f =>
    `<option value="${f.id}" ${f.id === S.broker ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>`;
}

function fragFeeLine(){
  const b = broker();
  if (b.feeRate) return `${(b.feeRate*100).toFixed(2)}% per trade, each way.`;
  return b.commission ? `${money(b.commission)} commission each way.` : "No commission.";
}

function fragMsg(){
  return (S.lastError ? `<div class="err">${esc(S.lastError)}</div>` : "")
       + (S.lastOk ? `<div class="ok">${esc(S.lastOk)}</div>` : "");
}

function renderBroker(){
  const id = broker().id;
  if (brokerLocked(id)) return lockHTML(id);
  const d = brokerData();
  if (id === "gooner" && S.venueDown) return layoutGoonerDown();
  return ({ tugmore:layoutTugmore, squirtr:layoutSquirtr, titwell:layoutTitwell,
            girthmore:layoutGirthmore, chodebase:layoutChodebase, gooner:layoutGooner }[id]
          || layoutTugmore)(d);
}

/* Titwell's analyst notes are right more often than the other firms', which is
   what its higher fee and its tighter spread are buying you. */
function titwellNote(a){
  const r = mulberry32((S.seed ^ 0x7177) + S.day * 31 + a.ticker.charCodeAt(0) * 7);
  const p = arr => arr[Math.floor(r() * arr.length)];
  const bull = r() < 0.55;
  return {
    head: bull ? `${a.name}: we remain constructive`
                : `${a.name}: the risk-reward has narrowed`,
    by: p(["Marian Whitlock","P. R. Deane","Anne Stallybrass","Curtis Vane"]),
    rating: bull ? p(["BUY","ADD","OUTPERFORM"]) : p(["HOLD","REDUCE","NEUTRAL"]),
    target: Math.round(a.price * (bull ? 1.08 + r()*0.22 : 0.86 + r()*0.16) * 100)/100,
    conviction: p(["Low","Moderate","Moderate","High"]),
    paras: [
      bull
        ? `We retain a positive stance. Our estimates are unchanged, which we recognise is an unsatisfying thing to write beneath a raised target, and we would direct clients to the margin commentary rather than to the headline.`
        : `We move to the sidelines. The operating performance is not in question; the price is. Clients holding from lower levels are not being advised to sell, a distinction our compliance department asks us to make explicit.`,
      p([
        `The market is, in our view, underweighting the cost base and overweighting the announcement.`,
        `Management's language on the last call was carefully constructed. We have read it four times and are no longer certain what it commits them to.`,
        `Our channel work suggests conditions are neither as good nor as bad as the two loudest sell-side houses currently maintain.`,
        `We would note that the shares have moved a long way on very little new information, which is either an opportunity or a warning depending on how the quarter lands.`,
      ]),
    ],
  };
}

   METCAST — weather. Genuinely load-bearing: drought, heat and storms all
   move utilities, agriculture and refiners, and the forecast here is the one
   place the player gets a look at the weather before the wire does.
   ====================================================================== */
const MET_CONDITIONS = [
  { k:"sun",   label:"Clear",          icon:"\u2600", hi:[22,34] },
  { k:"cloud", label:"Overcast",       icon:"\u2601", hi:[9,18] },
  { k:"rain",  label:"Rain",           icon:"\u2602", hi:[7,16] },
  { k:"storm", label:"Thunderstorms",  icon:"\u26a1", hi:[16,27] },
  { k:"heat",  label:"Extreme heat",   icon:"\u2600", hi:[33,42] },
  { k:"ice",   label:"Freezing rain",  icon:"\u2744", hi:[-6,2] },
  { k:"dry",   label:"Dry, no rainfall in sight", icon:"\u2600", hi:[26,36] },
];
const MET_CITIES = ["Cincinnati","Tulsa","Gary","Harrisburg","Springfield","Duluth","Mobile"];
const MET_QUIPS = [
  "Take a coat. Or do not. We are not your mother.",
  "A good day to be indoors looking at numbers.",
  "Grid operators have issued a conservation advisory, which nobody will read.",
  "Farmers are not happy. Farmers are never happy, but this time they have a point.",
  "Pleasant. Suspiciously pleasant.",
  "If you have outdoor plans, reconsider them.",
  "The kind of weather that ends up in somebody's earnings call.",
];

function metForecast(){
  const r = feedRng(3300);
  const days = [];
  for (let i = 0; i < 7; i++){
    const c = MET_CONDITIONS[Math.floor(r() * MET_CONDITIONS.length)];
    days.push({ ...c, hi: Math.round(c.hi[0] + r() * (c.hi[1] - c.hi[0])),
                lo: Math.round(c.hi[0] - 6 + r() * 5),
                day: `Day ${S.day + i}`, quip: MET_QUIPS[Math.floor(r() * MET_QUIPS.length)] });
  }
  return days;
}

function renderMet(){
  const f = metForecast();
  const now = f[0];
  const city = MET_CITIES[Math.floor(feedRng(3301)() * MET_CITIES.length)];
  return `<div class="site met met-${now.k}">
    <div class="mt-top"><div class="mt-brand">metcast<span>.tv</span></div>
      <div class="mt-nav">FORECAST &middot; RADAR &middot; SEVERE &middot; POLLEN &middot; ABOUT</div></div>
    <div class="mt-hero">
      <div class="mt-place">${esc(city)}</div>
      <div class="mt-now"><span class="mt-icon">${now.icon}</span><span class="mt-temp">${now.hi}&deg;</span></div>
      <div class="mt-cond">${esc(now.label)} &middot; low ${now.lo}&deg;</div>
      <div class="mt-quip">${esc(now.quip)}</div>
    </div>
    <div class="mt-week">
      ${f.map((d,i) => `<div class="mt-card ${i===0?"on":""}">
        <div class="mt-d">${esc(d.day)}</div>
        <div class="mt-i">${d.icon}</div>
        <div class="mt-t"><b>${d.hi}&deg;</b> <span>${d.lo}&deg;</span></div>
        <div class="mt-l">${esc(d.label)}</div>
      </div>`).join("")}
    </div>
    <div class="mt-foot">
      Metcast forecasts are produced by a model, reviewed by a person, and wrong at roughly
      the rate you would expect. Seven-day outlooks beyond day three are provided for
      entertainment.
    </div>
  </div>`;
}

/* Acting on a call. Rare, enormous when it lands, and most of the time the
   thing simply does not move. No heat: a public shout in a chat room is not
   material nonpublic information, it is a bloke with a keyboard. */
function actOnPump(ticker){
  const pump = scoopPump();
  if (!pump || pump.ticker !== ticker) return;
  S.caughtPump = ticker;
  if (pump.genuine){
    const a = S.assets[ticker];
    /* A steep run, then a collapse that undercuts where it started. Whoever is
       still holding at the end is the exit liquidity, and on a good day that
       is not you. */
    const run = 0.24 + rand() * 0.28;
    const runLife = Math.floor(55 + rand() * 70);
    S.effects.push({ t:ticker, dir:+1, mag:run, born:absTick(),
                     delay:Math.floor(4 + rand() * 14), life:runLife });
    S.effects.push({ t:ticker, dir:-1, mag:run * (1.35 + rand() * 0.45), born:absTick(),
                     delay:runLife + Math.floor(10 + rand() * 25),
                     life:Math.floor(90 + rand() * 110) });
    flash("Something is happening.");
  } else {
    flash("Nothing happened.");
  }
  render();
}

/* ===========================================================================
   THE BANKS

   Eight institutions, eight interfaces. The doc is specific about each one and
   the specifics are the joke: Ballsworth loads slowly on purpose, Schlongate
   nags, Wiener hides your balance until you ask, Penistone confirms twice, and
   Prima Nocta makes you type a passcode to see a page with almost nothing on
   it. Every one of them is running the same deposit and loan machinery.
   ======================================================================== */
function bankData(id){
  const B = BANKS[id], a = acct(id);
  return { B, a, id,
    open: !!a.opened,
    planning: S.phase !== "open",
    loan: S.loans.find(l => l.bank === id),
    borrow: canBorrow(id),
    others: availableBanks().filter(x => x.id !== id),
    apr: bankApr(id),
  };
}

/* Shared machinery, laid out differently by every bank. */
function fragDeposit(d, cls){
  if (!d.planning)
    return `<div class="${cls}-note">Transfers settle after the close. The market is open.</div>`;
  return `<div class="${cls}-xfer">
    <input id="bk-amt" class="num" placeholder="Amount" inputmode="decimal">

    <button data-withdraw="${d.id}">Withdraw</button>
    <div class="${cls}-avail">Brokerage cash: ${money(S.cash)}</div>
  </div>`;
}

function fragBorrow(d, cls){
  if (d.loan){
    const i = S.loans.indexOf(d.loan);
    return `<table class="${cls}-tbl">
        <tr><td>Outstanding</td><td class="r num"><b>${money(d.loan.owed)}</b></td></tr>

    <td class="r num gap-val">${val}</td></tr>`;
  return `<div class="site bnk bnk-gap">
    <div class="gap-head">

        <div class="gap-form">FORM GFT-1040</div>
        <h1>Gaping Federal Trust</h1>
        <div class="gap-sub">Statement of Account &middot; Period ending day ${S.day}</div>
      </div>
      <div class="gap-omb">OMB No. 1545-0074<br>Sequence No. 04</div>
    </div>
    <div class="gap-wrap">
      ${d.open ? `
        <table class="gap-tbl">
