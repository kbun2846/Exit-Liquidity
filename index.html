<!DOCTYPE html>
<!--
  EXIT LIQUIDITY — Tier 1
  ========================
  The tutorial tier, complete. Four dull stocks, one position slot, market
  orders, charts, ticker search and sort, one brokerage, one bank, mail, and
  the calendar. Tier 1 hides the world rather than disabling it: there are no
  greyed-out entries and no "unlocks later" labels anywhere in this file.

  Two things worth knowing before reading on.

  1. The page is NOT rebuilt on every tick. A tick fires every three seconds,
     and rebuilding the DOM that often destroys open dropdowns and steals
     focus mid-keystroke. Instead, elements that change carry a data-lv
     attribute and liveUpdate() rewrites just those. Full render() happens on
     navigation and on player actions only.

  2. One self-contained file, because it has to open from a local disk and run
     inside a cross-origin iframe, neither of which tolerates module imports.

  Order below: CONFIG / DATA / ENGINE / MAIL / SITES / CHARTS / SHELL / BOOT.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dee1e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Exit Liquidity">
<meta name="description" content="A stock market career game. You start with five hundred dollars and no idea what you are doing.">
<title>Exit Liquidity</title>
<style>
/* ===========================================================================
   Browser chrome — modern, quiet, gets out of the way.
   ======================================================================== */
:root{
  /* Browser chrome. Deliberately neutral so the sites inside it can be loud. */
  --bg:#dee1e6; --bar:#fff; --line:#e6e8eb; --line2:#d3d6da;
  --ink:#1f2023; --ink2:#5f6470; --ink3:#8b909a;
  --accent:#1a73e8; --accent-weak:#e8f0fe;
  --up:#0f7b3d; --down:#c5221f; --flat:#5f6470;

  /* Type. One family per job, sized on a scale rather than by eye. Numbers are
     always monospace with tabular figures, because a price that reflows as it
     ticks is unreadable and every real terminal knows it. */
  --ui:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,
       "Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,
          "Times New Roman",serif;
  --news:Georgia,"Times New Roman",serif;
  --round:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display",
          "Hiragino Maru Gothic ProN",Avenir,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",
         "Segoe UI Mono",Menlo,Consolas,monospace;

  --t-xs:11px; --t-sm:12.5px; --t-md:13.5px; --t-lg:15px;
  --t-xl:19px; --t-2xl:24px; --t-3xl:31px;
  --lh:1.5;

  --r:8px; --r-sm:6px; --r-lg:12px;
  --sh-1:0 1px 2px rgba(31,32,35,.08);
  --sh-2:0 2px 8px rgba(31,32,35,.10);
  --sh-3:0 12px 40px rgba(31,32,35,.22);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#202124;color:var(--ink);
  font:var(--t-md)/var(--lh) var(--ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  /* stop the double-tap-to-zoom delay and rubber-banding on iOS */
  touch-action:manipulation;
  overscroll-behavior:none;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.r{text-align:right}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.muted{color:var(--ink2)}
.small{font-size:11.5px}
.hidden{display:none !important}

button{
  font:500 var(--t-md)/1.2 var(--ui);color:var(--ink);background:#f1f3f4;
  border:1px solid transparent;padding:8px 15px;border-radius:var(--r-sm);cursor:pointer;
  transition:background .12s,box-shadow .12s;letter-spacing:.1px;
}
@media (hover:hover){button:hover:not(:disabled){background:#e4e6e9}}
button:active:not(:disabled){background:#d9dbdf}
button:disabled{color:#b0b3b8;cursor:default;background:#f6f7f8}
button.primary{background:var(--accent);color:#fff}
@media (hover:hover){button.primary:hover:not(:disabled){background:#1765cc}}
button.primary:disabled{background:#c3d7f5;color:#fff}
input,select{
  font:var(--t-md) var(--ui);color:var(--ink);background:#fff;
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;outline:none;
  transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,115,232,.15)}
input.num{font-family:var(--mono)}

/* ---- window ---- */
#browser{
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  /* dvh so the layout does not sit under Safari's collapsing toolbar */
  height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}

/* tab strip — the little curve where the active tab meets the toolbar is the
   single detail that makes a fake browser read as a real one */
.tabstrip{display:flex;align-items:flex-end;gap:1px;padding:8px 8px 0;height:46px;flex:none}
.tab{
  position:relative;display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;
  border-radius:10px 10px 0 0;font-size:var(--t-sm);color:#41454c;
  max-width:250px;min-width:120px;overflow:hidden;white-space:nowrap;cursor:default;
}
.tab::after{content:"";position:absolute;right:0;top:11px;bottom:11px;width:1px;background:#b6bbc2}
.tab.on::after,.tab:hover::after{opacity:0}
.tab .fav{width:16px;height:16px;border-radius:4px;flex:none;background:#8b9096;
  font:700 9px var(--ui);color:#fff;display:flex;align-items:center;justify-content:center;
  letter-spacing:-.3px}
.tab .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab.on{background:var(--bar);color:var(--ink);font-weight:500}
/* the two outward curves either side of the active tab */
.tab.on::before{content:"";position:absolute;bottom:0;left:-8px;width:8px;height:8px;
  background:radial-gradient(circle at 0 0,transparent 8px,var(--bar) 8px)}
.tab.on .curve{position:absolute;bottom:0;right:-8px;width:8px;height:8px;
  background:radial-gradient(circle at 100% 0,transparent 8px,var(--bar) 8px)}
.tabstrip .newtab{width:30px;height:30px;border-radius:50%;background:transparent;
  display:flex;align-items:center;justify-content:center;color:#5f6470;font-size:18px;
  margin-bottom:4px;flex:none}
.tabstrip .newtab:hover{background:rgba(0,0,0,.07)}
.tab .tabx{width:18px;height:18px;border-radius:50%;display:none;align-items:center;
  justify-content:center;font-size:9px;color:var(--ink2);flex:none}
.tab:hover .tabx,.tab.on .tabx{display:flex}
.tab .tabx:hover{background:rgba(0,0,0,.10);color:var(--ink)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:5px;padding:6px 9px;background:var(--bar);flex:none;
  position:relative}
/* the navigation progress line, as every browser has had since 2011 */
.toolbar::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:0;
  background:var(--accent);transition:width .22s ease-out,opacity .2s .18s;opacity:0}
.toolbar.loading::after{width:100%;opacity:1;transition:width .5s cubic-bezier(.1,.7,.3,1)}
.iconbtn{width:30px;height:30px;border-radius:50%;background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:14px;border:0}
@media (hover:hover){.iconbtn:hover:not(:disabled){background:#f1f3f4}}
.omni{flex:1;display:flex;align-items:center;gap:9px;background:#f1f3f4;border-radius:18px;
  padding:0 6px 0 13px;height:34px;border:1px solid transparent;transition:background .12s}
.omni:hover{background:#eaecef}
.omni:focus-within{background:#fff;border-color:#c9cdd3;box-shadow:var(--sh-2)}
.omni .lock{color:#5f6470;font-size:11px;flex:none;line-height:1}
.omni input{flex:1;border:0;background:transparent;padding:0;font-size:var(--t-md);
  font-family:var(--ui);color:var(--ink);box-shadow:none;letter-spacing:.1px}
.omni .host{font-weight:500}
.omni .star{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:13px;flex:none}
.omni .star:hover{background:#e4e6e9;color:var(--ink2)}
.omni input:focus{box-shadow:none;border:0}
.repchip{display:flex;align-items:center;gap:6px;background:#f1f3f4;border-radius:16px;
  padding:6px 12px;font-size:var(--t-xs);color:var(--ink2);white-space:nowrap;
  letter-spacing:.2px;font-weight:500}
.repchip b{color:var(--ink);font-family:var(--mono);font-size:var(--t-sm);font-weight:600}

/* bookmarks */
.bookmarks{display:flex;align-items:center;gap:1px;padding:0 9px 6px;background:var(--bar);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none;
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.bookmarks::-webkit-scrollbar{display:none}
.bm{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:var(--r-sm);
  font-size:var(--t-sm);color:#41454c;white-space:nowrap;cursor:default;letter-spacing:.1px}
@media (hover:hover){.bm:hover{background:#f1f3f4}}
.bm .fav{width:14px;height:14px;border-radius:3px;flex:none;
  font:700 8px var(--ui);color:#fff;display:flex;align-items:center;justify-content:center}
.bm .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

/* ticker tape */
.tape{overflow:hidden;background:#202124;height:26px;flex:none;position:relative}
.tape .run{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:11.5px;
  line-height:26px;color:#9aa0a6;will-change:transform}
.tape .sym{color:#e8eaed;font-weight:600}
.tape .u{color:#81c995}.tape .d{color:#f28b82}

#viewport{flex:1;overflow:auto;background:#fff;-webkit-overflow-scrolling:touch}

/* status bar */
.statusbar{display:flex;align-items:center;gap:0;background:#f4f5f7;border-top:1px solid var(--line);
  padding:0 12px;height:28px;font-size:var(--t-xs);color:var(--ink2);flex:none;letter-spacing:.1px}
.statusbar .cell{padding:0 12px 0 0;margin-right:12px;border-right:1px solid var(--line2);line-height:26px}
.statusbar .cell:last-child{border:0;margin:0}
.statusbar .grow{flex:1;border:0}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px}
.dotlive.shut{background:#9aa0a6}

/* ===========================================================================
   Shared site furniture
   ======================================================================== */
.site{min-height:100%}
a,.lnk{color:var(--accent);text-decoration:none;cursor:pointer}
@media (hover:hover){a:hover,.lnk:hover{text-decoration:underline}}

table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;font-size:var(--t-xs);letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:var(--t-md)}
tbody tr:last-child td,table tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
@media (hover:hover){tr.row:hover{background:#f8f9fa}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;
  overflow:hidden;box-shadow:var(--sh-1)}
.card>h3{margin:0;font-size:var(--t-xs);font-weight:600;letter-spacing:.55px;text-transform:uppercase;
  color:var(--ink3);padding:12px 15px;border-bottom:1px solid var(--line)}
.card>.body{padding:15px}
/* -- news feed -- */
.tagpill{display:inline-block;font:700 9.5px var(--ui);letter-spacing:.9px;padding:3px 8px;
  border-radius:3px;text-transform:uppercase;vertical-align:middle}
.tagpill.brk{background:#c5221f;color:#fff}
.tagpill.imp{background:#0f2440;color:#fff}
.tagpill.sm{font-size:8.5px;padding:2px 6px;margin-right:7px}
.quill .navbar span.lnk{color:var(--ink2);cursor:pointer;text-decoration:none}
@media (hover:hover){.quill .navbar span.lnk:hover{color:var(--ink)}}
.quill .navbar span.lnk.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.lead{max-width:680px;padding-bottom:20px;margin-bottom:8px;border-bottom:2px solid var(--ink);cursor:pointer}
.lead h2{font:400 30px var(--serif);letter-spacing:-.6px;margin:8px 0 5px;line-height:1.2}
@media (hover:hover){.lead:hover h2{color:var(--accent)}}
.lead p{font:15px/1.6 var(--serif);color:#3c4043;margin:10px 0 0}
.feed{max-width:680px}
.storyrow{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.storyrow .hd{font:600 15px var(--ui);letter-spacing:-.2px}
@media (hover:hover){.storyrow:hover .hd{color:var(--accent)}}
.storyrow.fresh .hd::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-left:8px;vertical-align:middle}
.storyrow .meta{font-size:11.5px;color:var(--ink2);margin-top:4px}
.fillerrow{display:flex;gap:12px;align-items:baseline;padding:7px 0;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;color:#80868b}
.fillerrow .src{width:170px;flex:none;font-size:10.5px;letter-spacing:.2px}
.fillerrow .hd{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fillerrow .tm{font-size:10.5px}
@media (hover:hover){.fillerrow:hover{color:var(--ink2)}}

.ranges{display:flex;gap:3px;padding:8px 12px 0}
.rg{padding:4px 12px;border-radius:14px;font-size:11.5px;font-weight:600;letter-spacing:.3px;
  background:transparent;color:var(--ink2);border:0}
@media (hover:hover){.rg:hover:not(.on){background:#f1f3f4}}
.rg.on{background:#e8f0fe;color:var(--accent)}
.chartwrap{padding:4px 10px 10px}
.chartwrap canvas{cursor:crosshair}
.tierchip{cursor:pointer;gap:5px}
.tierchip:hover{background:#e4e6e9}
.tierchip .of{color:var(--ink2);font-size:11px;margin-left:-2px}
.tierbar{display:inline-block;width:42px;height:5px;border-radius:3px;background:#d3d6da;
  overflow:hidden;margin-left:4px}
.tierbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ladhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.ladbig{font-size:34px;font-weight:600;letter-spacing:-1.5px;line-height:1}
.ladbig .of{font-size:15px;color:var(--ink2);margin-left:4px;letter-spacing:0}
.ladwrap{max-height:46vh;overflow-y:auto;margin:0 -26px;padding:0 26px}
table.ladder td,table.ladder th{padding:7px 8px;font-size:12px}
table.ladder th{position:sticky;top:0;background:#fff}
tr.lad-off{color:#bdc1c6}
tr.lad-off td{color:#bdc1c6}
tr.lad-next{background:#e8f0fe}
tr.lad-next td{color:var(--ink)}

/* =========================================================================
   BAGEL — a forum. Warm paper, serif headings, vote gutters, generous
   leading. Nothing here shares a single value with Scoop.
   ====================================================================== */
.bagel{background:#f6f3ee;min-height:100%;font-family:var(--ui)}
.bg-top{display:flex;align-items:center;gap:16px;background:#fff;padding:10px 20px;
  border-bottom:1px solid #e0dad0;position:sticky;top:0;z-index:2}
.bg-logo{display:flex;align-items:center;gap:8px;font:600 17px var(--serif);
  letter-spacing:-.3px;color:#8a3b12}
.bg-mark{width:26px;height:26px;border-radius:50%;background:#d2571f;color:#fff;
  display:flex;align-items:center;justify-content:center;font:700 14px var(--ui)}
.bg-search{flex:1;max-width:460px;background:#f2efe9;border:1px solid #e0dad0;
  border-radius:18px;padding:8px 14px;font-size:var(--t-md)}
.bg-user{font-size:var(--t-sm);color:#8a7f6f}
.bg-cols{display:grid;grid-template-columns:1fr 300px;gap:20px;padding:20px;max-width:1120px}
@media (max-width:900px){.bg-cols{grid-template-columns:1fr}.bg-side{display:none}}
.bg-post{display:flex;gap:2px;background:#fff;border:1px solid #e6e0d6;border-radius:6px;
  margin-bottom:9px;overflow:hidden;cursor:pointer}
.bg-post:hover{border-color:#c9bfae}
.bg-votes{width:44px;background:#faf7f2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:11px;color:#b3a894;padding:10px 0;flex:none}
.bg-votes b{font:600 12.5px var(--mono);color:#41454c}
.bg-votes .up{color:#d2571f}
.bg-body{padding:11px 14px;min-width:0;flex:1}
.bg-meta{font-size:var(--t-xs);color:#a0937f;margin-bottom:4px}
.bg-meta b{color:#6f6353;font-weight:600}
.bg-post h3{margin:0;font:500 var(--t-lg)/1.35 var(--serif);color:#2a251e}
.bg-post.open h2{margin:2px 0 8px;font:500 25px/1.3 var(--serif);color:#2a251e}
.bg-post:hover h3{color:#8a3b12}
.bg-count{font-size:var(--t-xs);color:#b3a894;margin-top:7px;letter-spacing:.2px}
.bg-tick{font-size:var(--t-sm);background:#fdf6e9;border:1px solid #ecdcbd;border-radius:5px;
  padding:7px 10px;margin:8px 0;color:#7a5c1d;display:inline-block}
.bg-wrap{padding:20px;max-width:800px}
.bg-back{display:inline-block;margin-bottom:12px;font-size:var(--t-sm);color:#8a3b12}
.bg-comments{margin-top:14px;border-left:2px solid #e6e0d6;padding-left:14px}
.bg-c{padding:10px 0;border-bottom:1px solid #efe9df}
.bg-cmeta{font-size:var(--t-xs);color:#a0937f}
.bg-cmeta b{color:#6f6353}
.bg-ctext{font:var(--t-md)/1.6 var(--ui);color:#3a352c;margin-top:3px}
.bg-reply{margin:8px 0 0 18px;padding-left:12px;border-left:2px solid #e6e0d6;border-bottom:0}
.bg-foot{margin-top:20px;font-size:var(--t-xs);color:#b3a894;font-style:italic}
.bg-card{background:#fff;border:1px solid #e6e0d6;border-radius:6px;margin-bottom:12px;padding:12px 14px}
.bg-card h4{margin:0 0 8px;font:600 var(--t-xs) var(--ui);letter-spacing:.6px;
  text-transform:uppercase;color:#a0937f}
.bg-sub{padding:7px 0;border-bottom:1px solid #f2ece2;font-size:var(--t-md);cursor:pointer;color:#4a4437}
.bg-sub:last-child{border-bottom:0}
.bg-sub.on{color:#8a3b12;font-weight:600}
.bg-blurb{font-size:var(--t-xs);color:#b3a894;margin-top:2px}
.bg-rules{margin:0;padding-left:18px;font-size:var(--t-sm);color:#6f6353;line-height:1.9}

/* =========================================================================
   SCOOP — a chat client. Near-black, three columns, dense, coloured names.
   ====================================================================== */
.scoop{display:grid;grid-template-columns:62px 220px 1fr;height:100%;min-height:100%;
  background:#1a1b20;color:#d6d8de;font-family:var(--ui)}
@media (max-width:820px){.scoop{grid-template-columns:52px 1fr}.sc-main{grid-column:2}
  .sc-channels{display:none}}
.sc-servers{background:#0f1013;padding:10px 0;display:flex;flex-direction:column;
  align-items:center;gap:9px}
.sc-server{width:40px;height:40px;border-radius:14px;background:#2c2e36;color:#b9bcc5;
  display:flex;align-items:center;justify-content:center;font:600 15px var(--ui);cursor:pointer}
.sc-server.on{background:#5865f2;color:#fff;border-radius:13px}
.sc-channels{background:#20222a;padding:0 0 12px;display:flex;flex-direction:column}
.sc-name{padding:15px 15px;font:600 var(--t-lg) var(--ui);color:#fff;
  border-bottom:1px solid #16171b;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.sc-cat{padding:15px 15px 5px;font:600 10.5px var(--ui);letter-spacing:.8px;color:#7b7f8b}
.sc-ch{padding:7px 15px;margin:0 8px;border-radius:5px;font-size:var(--t-md);color:#9aa0ac;cursor:pointer}
.sc-ch span{color:#6f7480;margin-right:4px}
.sc-ch:hover{background:#292c35;color:#d6d8de}
.sc-ch.on{background:#32353f;color:#fff;font-weight:500}
.sc-me{margin-top:auto;padding:10px 15px;background:#191a1f;font-size:var(--t-sm);color:#b9bcc5;
  display:flex;align-items:center;gap:8px}
.sc-dot{width:9px;height:9px;border-radius:50%;background:#3ba55d;flex:none}
.sc-main{display:flex;flex-direction:column;min-width:0;background:#24262e}
.sc-header{padding:14px 18px;border-bottom:1px solid #1a1b20;font:600 var(--t-lg) var(--ui);
  color:#fff;display:flex;align-items:baseline;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.sc-topic{font:400 var(--t-sm) var(--ui);color:#8a8f9b;border-left:1px solid #3a3d47;padding-left:12px}
.sc-msgs{flex:1;overflow-y:auto;padding:14px 18px}
.sc-msg{display:flex;gap:13px;padding:7px 0}
.sc-av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff;font:600 15px var(--ui)}
.sc-mh{display:flex;align-items:baseline;gap:9px}
.sc-mh b{font-size:var(--t-md);font-weight:600}

/* =========================================================================
   BANKS — eight institutions, eight interfaces.
   ====================================================================== */
.bnk{min-height:100%}
.bnk .down{color:#c5221f}
.bnk input{max-width:180px}
.bnk [class$="-others"] h4{margin:0;font:600 10px var(--ui);letter-spacing:1.8px;text-transform:uppercase;
  opacity:.62;padding:10px 14px;border-bottom:1px solid currentColor;border-color:inherit}
.bal-others h4,.wie-others h4,.pen-others h4{padding-left:0;padding-right:0}
.bal-others h4{padding:6px 9px;background:#e6dfc6;color:#5d5233}

/* --- account setup ------------------------------------------------------ */
.setup{background:#fff;border-radius:16px;max-width:460px;width:100%;margin:auto;
  padding:28px 30px 22px;box-shadow:0 10px 44px rgba(0,0,0,.28)}
.su-brand{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.su-mark{width:42px;height:42px;border-radius:12px;background:#0f2440;color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font:700 21px var(--ui);
  position:relative;overflow:hidden}
.su-mark span{position:absolute;inset:-40% -40% auto auto;width:150%;height:150%;
  background:radial-gradient(circle at 70% 30%,rgba(96,165,250,.85),transparent 55%)}
.setup h1{margin:0;font:600 21px var(--ui);letter-spacing:-.6px}
.su-tag{font-size:12.5px;color:var(--ink2);margin-top:1px}
.su-lead{font-size:var(--t-sm);color:var(--ink2);line-height:1.65;margin:0 0 20px}
.su-lab{display:block;font:600 10.5px var(--ui);letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:6px}
.su-in{width:100%;max-width:none;font-size:16px;padding:11px 13px;border-radius:9px}
.su-pin{letter-spacing:9px;font-family:var(--mono);text-align:center;max-width:170px}
.su-preview{font-size:var(--t-xs);color:var(--ink3);margin:7px 0 18px;line-height:1.55}
.su-preview b{color:var(--ink);font-family:var(--mono);font-size:var(--t-sm)}
.su-err{background:#fdeaea;border:1px solid #f4c7c3;color:#a50e0e;border-radius:9px;
  padding:9px 12px;font-size:var(--t-sm);margin-bottom:14px;line-height:1.5}
.su-go{width:100%;background:var(--accent);color:#fff;border:0;border-radius:24px;
  padding:12px;font:600 var(--t-md) var(--ui);cursor:pointer}
.su-foot{text-align:center;font-size:var(--t-xs);color:var(--ink3);margin-top:16px}

/* --- the lock on each institution --------------------------------------- */
.lockpage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:52px 20px}
.lk-box{width:100%;max-width:340px;border:1px solid;border-radius:14px;padding:28px 26px 22px;
  text-align:center;backdrop-filter:blur(2px)}
.lk-seal{width:44px;height:44px;border-radius:50%;margin:0 auto 14px;color:#fff;
  display:flex;align-items:center;justify-content:center;font:600 19px var(--ui)}
.lk-name{font-size:var(--t-lg);font-weight:600;letter-spacing:-.2px}
.lk-sub{font:600 9.5px var(--ui);letter-spacing:2.4px;text-transform:uppercase;margin-top:5px}
.lk-user{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 16px;
  padding-bottom:9px;border-bottom:1px solid rgba(128,128,128,.28);font-size:var(--t-sm);text-align:left}
.lk-user span{opacity:.6}
.lk-user b{font-family:var(--mono);font-size:var(--t-sm);font-weight:600}
.lk-lab{display:block;font:600 9.5px var(--ui);letter-spacing:1.8px;text-transform:uppercase;
  opacity:.6;margin-bottom:7px;text-align:left}
.lk-code{width:100%;max-width:none;font:600 22px var(--mono);letter-spacing:12px;text-align:center;
  padding:11px 0 11px 12px;border:1px solid;border-radius:9px}
.lk-go{width:100%;margin-top:11px;border:0;border-radius:22px;padding:11px;
  font:600 var(--t-md) var(--ui);cursor:pointer}
.lk-bad{margin-top:13px;font-size:var(--t-sm);line-height:1.5;color:#c5221f;
  background:rgba(197,34,31,.09);border-radius:8px;padding:8px 11px}
.lk-bad sup{font-size:9px}
.lk-help{margin-top:16px;font-size:var(--t-xs);opacity:.55;line-height:1.6}
.lk-link{text-decoration:underline;cursor:pointer}

/* --- the note on the hub ------------------------------------------------- */
.hub-note{background:#fdf6b8;border:1px solid #e8d97a;box-shadow:0 1px 3px rgba(0,0,0,.12);
  position:relative}
.hub-note h3{background:transparent;border-bottom:1px dashed #ddc96a;color:#6b5d14;
  font-family:var(--ui)}
.hub-note .body{font-family:var(--mono);font-size:var(--t-sm);color:#4a4110}
.nt-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;
  border-bottom:1px dotted #ddc96a}
.nt-row:last-of-type{border-bottom:0}
.nt-row span{color:#8a7a2a;font-family:var(--ui);font-size:var(--t-xs);letter-spacing:.3px}
.nt-row b{font-weight:600;word-break:break-all;text-align:right}
.nt-hide{cursor:pointer;text-decoration:underline;color:#8a7a2a;font-family:var(--ui);
  font-size:var(--t-xs)}
.nt-scrawl{margin-top:11px;font:italic 12px var(--serif);color:#8a7a2a;line-height:1.55}

/* --- Gargle Games ------------------------------------------------------- */
.arc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;
  max-width:760px;margin:0 0 22px}
.arc-bar{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
.arc-name{font:600 var(--t-md) var(--ui);display:flex;align-items:center;gap:8px}
.arc-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.arc-stats{display:flex;gap:16px;align-items:center;margin-left:auto;font-size:var(--t-sm);color:var(--ink2);
  flex-wrap:wrap}
.arc-stats b{color:var(--ink);font-weight:600}
.arc-x{font-size:var(--t-sm)}
.arc-foot{padding:9px 14px;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--ink3)}

.arc-stage{position:relative;background:#0f1a14;padding:14px}
#snake-cv{display:block;width:100%;image-rendering:auto;border-radius:8px}
.arc-veil{position:absolute;inset:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(8,16,12,.82);border-radius:8px;text-align:center;padding:20px}
.arc-veil-in{max-width:340px}
.arc-big{font:600 21px var(--ui);color:#e8f5ec;letter-spacing:-.4px}
.arc-small{font-size:var(--t-sm);color:#9fbcab;margin-top:8px;line-height:1.6}
.arc-small b{color:#e8f5ec}
.arc-play{margin-top:16px;background:#34a853;color:#fff;border:0;border-radius:22px;
  padding:9px 26px;font:600 var(--t-md) var(--ui);cursor:pointer}
.arc-pad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);
  gap:7px;justify-content:center;padding:14px}
.arc-pad button{background:#eef1ef;border:1px solid var(--line);border-radius:12px;font-size:17px;
  color:#3c4a42}

.pri-lockbox button{width:100%;margin-top:9px;background:transparent;border:1px solid #3a3a3a;
  color:#d8d8d8;border-radius:0;letter-spacing:1.6px}
.pri-hint{margin-top:18px;font-size:10.5px;color:#5a5a5a;line-height:1.7}
.pri-bad{margin-top:12px;font-size:var(--t-sm);color:#8a3a3a}
.pri-wrap{max-width:440px;margin:0 auto;padding:46px 26px 60px}
.pri-line{display:flex;justify-content:space-between;padding:8px 0;font-size:var(--t-md)}
.pri-line span{color:#6a6a6a}
.pri-sep{height:1px;background:#1a1a1a;margin:20px 0}
.pri-xfer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pri-xfer input{background:#0b0b0b;border:1px solid #232323;color:#d8d8d8;border-radius:0}
.pri-xfer button{background:transparent;border:1px solid #3a3a3a;color:#d8d8d8;border-radius:0}
.pri-avail,.pri-note,.pri-small{width:100%;font-size:var(--t-xs);color:#5a5a5a;margin-top:8px}
.pri-lend,.pri-openbox{font-size:var(--t-sm);line-height:1.7;color:#a8a8a8}
.pri-tbl td{border-color:#1a1a1a;color:#d8d8d8;font-size:var(--t-sm)}
.pri-other{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;padding:8px 0;
  border-bottom:1px solid #141414;cursor:pointer;font-size:var(--t-xs);color:#6a6a6a}
.pri-foot{margin-top:26px;font-size:10.5px;color:#4a4a4a;text-align:center;letter-spacing:.6px}

/* adverts */
.adbox{position:relative;border-radius:var(--r);padding:16px 16px 14px;margin-bottom:14px;
  cursor:pointer;overflow:hidden;box-shadow:var(--sh-2);transition:box-shadow .14s,filter .14s}
@media (hover:hover){.adbox:hover{box-shadow:var(--sh-3);filter:saturate(1.15) brightness(1.04)}}
.ad-kick{font:700 9.5px var(--ui);letter-spacing:1.3px;opacity:.85;margin-bottom:5px}
.ad-head{font:800 var(--t-xl)/1.15 var(--ui);letter-spacing:-.5px}
.ad-sub{font-size:var(--t-sm);opacity:.9;margin-top:5px}
.ad-cta{display:inline-block;margin-top:11px;background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 14px;
  font:700 var(--t-xs) var(--ui);letter-spacing:.8px}
.ad-tag{position:absolute;top:8px;right:9px;font:600 8.5px var(--ui);letter-spacing:.6px;
  background:rgba(0,0,0,.22);padding:2px 5px;border-radius:3px}

/* gutter press */
.gutter{background:#fff;min-height:100%;font-family:"Arial Narrow",Arial,var(--ui)}
.gt-top{background:#c1121f;color:#fff;padding:12px 24px}
.gt-logo{font:900 30px/1 "Arial Black",Impact,var(--ui);letter-spacing:-1px}
.gt-logo span{background:#fff;color:#c1121f;padding:0 7px}
.gt-nav{font:700 var(--t-xs) var(--ui);letter-spacing:1.4px;margin-top:7px;opacity:.9}
.gt-wrap{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:20px 24px 40px;max-width:1080px}
@media (max-width:860px){.gt-wrap{grid-template-columns:1fr}}
.gt-kick{display:inline-block;background:#c1121f;color:#fff;font:700 10px var(--ui);
  letter-spacing:1.2px;padding:3px 8px;margin-bottom:8px}
.gt-lead h1{font:900 34px/1.05 "Arial Black",Impact,var(--ui);margin:0 0 14px;letter-spacing:-1px}
.gt-lead p{font:var(--t-lg)/1.6 Georgia,serif;margin:0 0 13px;color:#222}
.gt-side h4{font:800 var(--t-xs) var(--ui);letter-spacing:1.2px;border-bottom:3px solid #c1121f;
  padding-bottom:6px;margin:0 0 10px}
.gt-most{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #eee;font-size:var(--t-sm);line-height:1.4}
.gt-most b{color:#c1121f;font:900 17px var(--ui);line-height:1}
.gt-foot{background:#f2f2f2;padding:16px 24px;font-size:var(--t-xs);color:#777;line-height:1.6}

.mailtabs{display:flex;gap:2px;margin-top:8px}
.mailtabs .mt{padding:4px 10px;border-radius:14px;font-size:11.5px;color:var(--ink2);cursor:pointer}
.mailtabs .mt:hover{background:#f1f3f4}
.mailtabs .mt.on{background:#e8f0fe;color:var(--accent);font-weight:600}
.mailtabs .mt b{color:var(--accent)}

/* the clock, on the portal */
.timebar{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--line);padding:14px 28px}
.tb-label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2)}
.tb-val{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.tb-sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.tb-acts{display:flex;gap:8px;flex-wrap:wrap}

/* bank skins, driven by each bank's own palette */
.bankskin{background:var(--bk-bg);color:var(--bk-ink);min-height:100%}
.bankskin .bk-crest{display:flex;align-items:center;gap:16px;padding:22px 28px;
  background:var(--bk-ink);color:var(--bk-acc);border-bottom:4px solid var(--bk-acc)}
.bankskin .bk-seal{width:46px;height:46px;border:2px solid var(--bk-acc);border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font:600 14px var(--serif)}
.bankskin .bk-crest h1{margin:0;font-size:19px;letter-spacing:2px;font-weight:400}
.bankskin .bk-est{font-size:11px;opacity:.7;margin-top:3px;letter-spacing:.3px}
.bankskin .bk-wrap{padding:24px 28px 44px;max-width:640px}
.bankskin .card{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12)}
.bankskin .card>h3{color:var(--bk-ink);opacity:.75;border-color:rgba(0,0,0,.1)}
.bankskin td,.bankskin th{border-color:rgba(0,0,0,.08)}
.bankskin .muted{color:var(--bk-ink);opacity:.6}

/* dev tools */
.devpanel{margin-top:10px;border:1px dashed #c5221f;border-radius:8px;padding:10px;background:#fff8f8}
.devrow{display:flex;align-items:center;gap:7px;padding:5px 0;flex-wrap:wrap}
.devrow>span:first-child{width:78px;font-weight:600;font-size:11.5px}
.devrow>span.num{width:96px;color:var(--ink2)}
.devrow button{padding:4px 10px;font-size:11.5px;min-height:0}
.pipdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
  vertical-align:middle;margin-left:5px}
.tug .tabs div[data-go]{cursor:pointer}
.idxstrip{display:flex;gap:0;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
.idxcell{padding:11px 22px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;
  min-width:190px;flex:1 1 auto}
@media (hover:hover){.idxcell:hover{background:#f8f9fa}}
.idxcell .nm{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--ink2)}
.idxcell .vv{margin-top:3px;display:flex;gap:9px;align-items:baseline}
.idxcell .vv .num:first-child{font-size:16px;font-weight:600;letter-spacing:-.4px}
.hot{display:inline-block;font:700 8.5px var(--ui);letter-spacing:.7px;padding:1px 5px;
  border-radius:3px;background:#7b1fa2;color:#fff;vertical-align:middle;margin-left:4px}
button.mini{padding:3px 10px;font-size:11.5px;border-radius:5px}

.err{background:#fce8e6;border-radius:6px;color:#c5221f;padding:9px 12px;margin-top:11px;font-size:12.5px}
.ok{background:#e6f4ea;border-radius:6px;color:#137333;padding:9px 12px;margin-top:11px;font-size:12.5px}

/* -- portal -- */
.portal{background:#f8f9fa;min-height:100%}
/* --- Netscrape hub ------------------------------------------------------ */
.hub-top{display:flex;align-items:center;gap:24px;padding:20px 28px;background:#fff;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.hub-brandwrap{display:flex;align-items:center;gap:14px}
.hub-mark{width:42px;height:42px;border-radius:12px;background:#0f2440;color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font:700 21px var(--ui);position:relative;
  overflow:hidden}
.hub-mark span{position:absolute;inset:-40% -40% auto auto;width:150%;height:150%;
  background:radial-gradient(circle at 70% 30%,rgba(96,165,250,.85),transparent 55%)}
.portal h1{margin:0;font:600 22px var(--ui);letter-spacing:-.6px}
.portal .tagline{font-size:12.5px;color:var(--ink2);margin-top:2px}
.hub-search{flex:1;min-width:260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:26px;padding:6px 8px 6px 16px;background:#f8f9fa;transition:box-shadow .12s,background .12s}
.hub-search:focus-within{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.11)}
.hub-mag{color:var(--ink3);font-size:15px;transform:rotate(-45deg)}
.hub-search input{flex:1;border:0;background:transparent;padding:6px 0;font-size:var(--t-md);min-width:0}
.hub-search input:focus{outline:none;box-shadow:none}
.hub-search button{border-radius:20px;padding:8px 20px}
.hub-date{text-align:right;min-width:112px}
.hub-dnum{font:300 34px/1 var(--ui);letter-spacing:-2px}
.hub-dsub{font-size:var(--t-xs);color:var(--ink2);line-height:1.5;margin-top:4px}

.hub-decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;
  padding:16px 20px 4px}
.hub-deck{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hub-dh{font:600 10.5px var(--ui);letter-spacing:1.8px;text-transform:uppercase;color:#fff;
  background:var(--tint);padding:8px 14px}
.hub-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:2px;padding:10px}
.hub-tile{padding:11px 8px 12px;border-radius:10px;cursor:pointer;text-align:center;
  transition:background .1s}
.hub-tile:hover{background:#f1f3f4}
.hub-ic{width:36px;height:36px;border-radius:10px;margin:0 auto 8px;color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.hub-tt{font:600 var(--t-sm) var(--ui);position:relative;display:inline-block}
.hub-badge{position:absolute;top:-5px;right:-16px;background:#d93025;color:#fff;border-radius:9px;
  font:600 9.5px var(--ui);font-style:normal;padding:1px 5px}
.hub-td{font-size:var(--t-xs);color:var(--ink3);margin-top:2px;line-height:1.35}

.hub-games{margin:14px 20px 4px;border:1px solid var(--line);border-radius:var(--r);background:#fff;
  overflow:hidden}
.hub-gh{padding:10px 14px;border-bottom:1px solid var(--line);font:600 var(--t-sm) var(--ui)}
.hub-gh span{font-weight:400;color:var(--ink3)}
.hub-grow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px;padding:8px}
.hub-game{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer}
.hub-game:hover{background:#f1f3f4}
.hub-gic{width:38px;height:38px;border-radius:11px;color:#fff;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:17px}
.hub-game b{display:block;font-size:var(--t-md)}
.hub-game span{font-size:var(--t-xs);color:var(--ink3)}

.hub-nm{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub-q{font-size:var(--t-md);font-weight:600;margin-bottom:12px;line-height:1.4}
.hub-opt{display:block;width:100%;text-align:left;margin-bottom:7px;background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:var(--t-sm)}
.hub-opt:hover{background:#f1f3f4}
.hub-res{position:relative;margin-bottom:7px;padding:9px 13px;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;gap:8px;font-size:var(--t-sm);border:1px solid var(--line)}
.hub-res.mine{border-color:var(--ink);font-weight:600}
.hub-bar{position:absolute;inset:0;z-index:0}
.hub-bar i{display:block;height:100%;background:#eaf0f8}
.hub-res.mine .hub-bar i{background:#dbe8fb}
.hub-res span,.hub-res b{position:relative;z-index:1}
.hub-res b{margin-left:auto}
.hub-wx,.hub-top5{cursor:pointer}
.hub-wxrow{display:flex;align-items:center;gap:14px}
.hub-wxic{font-size:32px;line-height:1}
.hub-wxt{font:300 30px/1 var(--ui);letter-spacing:-1.5px}
.hub-sign{font:600 var(--t-lg) var(--ui)}
.hub-word{font:400 21px var(--serif);font-style:italic}
.hub-t5{font-size:var(--t-md);line-height:1.45;font-weight:600}
.portal .cols{display:block;columns:4 280px;column-gap:14px;padding:14px 20px 26px}
.portal .cols > *{break-inside:avoid;display:inline-block;width:100%}
.portal .card table{width:100%;table-layout:fixed}
.portal .hub-nm{max-width:none}
.portal .card td:first-child{width:4.6em}
.portal .card td:nth-child(3){width:5.6em}
.portal .card td:nth-child(4){width:4.6em}
@media(max-width:980px){.portal .cols{columns:2 260px}}
@media(max-width:620px){.portal .cols{columns:1}}

.portal .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
  gap:14px;padding:20px 28px;align-items:start}
.cal{width:100%;border-collapse:separate;border-spacing:4px}
.cal td{text-align:center;border:1px solid var(--line);border-radius:6px;padding:9px 0;
  font-family:var(--mono);font-size:12px;color:var(--ink2)}
.cal td.today{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cal td.past{color:#bdc1c6;background:#fafafa}

/* -- Quill Street -- */
.quill{background:#fff}
.quill .masthead{border-bottom:1px solid var(--line);padding:22px 28px 16px;text-align:left}
.quill .masthead h1{margin:0;font:400 30px var(--serif);letter-spacing:-.5px;color:#111}
.quill .masthead .sub{font:italic 12.5px var(--serif);color:var(--ink2);margin-top:3px}
.quill .navbar{border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:24px}
.quill .navbar span{padding:11px 0;font-size:11.5px;letter-spacing:.7px;font-weight:600;
  color:var(--ink2);text-transform:uppercase}
.quill .navbar span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.quill .wrap{padding:20px 28px 40px}
.quill .toolrow{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.quill article{font:16px/1.65 var(--serif);max-width:640px;color:#202124}
.quill article h3{font:600 15px var(--ui);margin:0 0 3px;letter-spacing:-.2px}
.quill .byline{font:italic 12.5px var(--serif);color:var(--ink2);margin-bottom:14px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}

/* -- Tugmore -- */
.tug{background:#f8f9fa;min-height:100%}
.tug .bar{background:#0b3d6b;color:#fff;padding:14px 24px;display:flex;align-items:baseline;gap:12px}
.tug .bar b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.tug .bar .sm{font-size:11.5px;color:#9fc0dd}
.tug .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;gap:26px}
.tug .tabs div{padding:12px 0;font-size:13px;color:var(--ink2);font-weight:500}
.tug .tabs div.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tug .grid{display:grid;grid-template-columns:200px minmax(340px,1fr) 250px;
  gap:14px;padding:20px 24px 40px;align-items:start}
@media (max-width:1080px){.tug .grid{grid-template-columns:1fr}}
.tug .navlist div{padding:9px 15px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.tug .navlist div:last-child{border:0}
@media (hover:hover){.tug .navlist div:hover{background:#f8f9fa}}
.tug .navlist div.on{background:#e8f0fe;color:var(--accent);font-weight:600}
.tug .ticket label{display:block;margin:13px 0 5px;font-size:11px;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.tug .ticket label:first-child{margin-top:0}
.tug .ticket input,.tug .ticket select{width:100%}
.tug .big{font:600 32px var(--mono);letter-spacing:-1.5px}
.tug .quote-row{display:flex;gap:18px;align-items:baseline;padding:15px;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.tug .bidask{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tug .statline{padding:9px 15px;font-size:11.5px;color:var(--ink2);font-family:var(--mono)}

/* -- bank -- */
.ckh{background:#faf8f3;min-height:100%}
.ckh .crest{background:#0f2440;color:#d9bd74;padding:22px 28px;display:flex;align-items:center;gap:15px}
.ckh .crest .seal{width:44px;height:44px;border:2px solid #d9bd74;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);flex:none}
.ckh .crest h1{margin:0;font:400 20px var(--serif);letter-spacing:2.5px}
.ckh .crest .est{font-size:10px;color:#9d894f;letter-spacing:3px;margin-top:3px}
.ckh .wrap{padding:24px 28px;max-width:600px}
.ckh .photo{background:#efe9dc;border:1px solid #e0d8c6;border-radius:var(--r);padding:34px;
  text-align:center;font:italic 12.5px var(--serif);color:#9c9274;margin-top:14px}

/* -- mail -- */
.mail{display:flex;flex-direction:column;height:100%;min-height:100%;background:#fff}
.mail .hdr{padding:15px 22px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex:none}
.mail .hdr b{font-size:16px;font-weight:600;letter-spacing:-.3px}
.mail .split{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0}
@media (max-width:820px){.mail .split{grid-template-columns:1fr}}
.mail .list{border-right:1px solid var(--line);overflow-y:auto}
.mail .list .msg{padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
@media (hover:hover){.mail .list .msg:hover{background:#f8f9fa}}
.mail .list .msg.on{background:#e8f0fe}
.mail .list .msg .from{display:flex;justify-content:space-between;gap:9px;align-items:center;
  font-size:12.5px;color:var(--ink2)}
.mail .list .msg.unread .from{color:var(--ink);font-weight:600}
.mail .list .msg .subj{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.mail .list .msg.unread .subj{font-weight:600}
.mail .list .msg .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent);flex:none;margin-right:5px}
.mail .read{padding:24px 30px 40px;overflow-y:auto}
.mail .read .mh{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.mail .read .mh h2{margin:0 0 5px;font:600 19px var(--ui);letter-spacing:-.4px}
.mail .read .mh .meta{font-size:12px;color:var(--ink2);font-family:var(--mono)}
.mail .read .bd{font:15px/1.7 var(--serif);max-width:620px;color:#202124}
.mail .read .bd p{margin:0 0 15px}
.mail .read .actions{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* -- checklist -- */
.chk{background:#fef7e0;border:1px solid #f5e0a3;border-radius:var(--r);padding:14px 18px;margin:20px 28px}
.chk h3{margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;color:#8a6d00}
.chk ol{margin:0;padding-left:20px;font-size:12.5px;color:#5f4c00}
.chk li{padding:2px 0}
.chk li.done{color:#b0a37a;text-decoration:line-through}

/* -- modal -- */
.veil{position:fixed;inset:0;background:rgba(32,33,36,.55);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.veil.setup-veil{align-items:flex-start;overflow-y:auto;padding:28px 16px;
  background:linear-gradient(160deg,#0b1a2e,#17324f 55%,#0b1a2e)}
.dlg{background:#fff;border-radius:var(--r-lg);min-width:340px;max-width:560px;width:100%;
  box-shadow:var(--sh-3);overflow:hidden}
.dlg .tb{font-size:17px;font-weight:600;letter-spacing:-.3px;padding:22px 26px 0}
.dlg .bd{padding:14px 26px 0;font-size:13.5px;line-height:1.6}
.dlg .bd p{margin:0 0 12px}
.dlg .ft{padding:18px 26px 22px;display:flex;gap:9px;justify-content:flex-end}
.dlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 20px;
  padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dlg dt{color:var(--ink2);font-size:12.5px}
.dlg dd{margin:0;text-align:right;font-family:var(--mono);font-size:13px}
textarea{width:100%;height:74px;font:11px var(--mono);border:1px solid var(--line2);
  border-radius:6px;padding:9px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
canvas{display:block;max-width:100%;touch-action:none}

/* ---------------------------------------------------------------------------
   Touch. Two things matter on an iPad and neither is layout: Safari zooms the
   whole page when you focus an input smaller than 16px, and a 30px button is
   a coin toss under a fingertip. Both are fixed here rather than by shrinking
   the interface.
   ------------------------------------------------------------------------ */
@media (pointer:coarse){
  input,select,textarea{font-size:16px;min-height:44px}
  button{min-height:44px;padding:10px 18px}
  button.mini{min-height:36px;padding:7px 14px;font-size:13px}
  .rg{min-height:38px;padding:8px 16px;font-size:13px}

  textarea{user-select:text;-webkit-user-select:text}
}

/* A narrow tablet in portrait: let wide tables scroll sideways on their own

@media (max-width:900px){

}

const VOWELS = new Set("aeiouAEIOU");
const strongConsonants = w => w.split("").filter(c => /[a-z]/i.test(c) && !VOWELS.has(c));

function tickerFor(name, taken){
  const words = name.replace(/&/g, " ").split(/\s+/).filter(Boolean);
  let base;
  if (words.length >= 2){
    const cons = strongConsonants(words[0].slice(1));
    base = (words[0][0] + (cons[0] || words[0][1] || "X") + words[1][0]).toUpperCase();
  } else {
    const w = words[0];
    base = (w[0] + strongConsonants(w.slice(1)).slice(0, 3).join("")).toUpperCase();
    if (base.length < 3) base = w.slice(0, 3).toUpperCase();
  }
  if (!taken.has(base)) return base;
  // collisions resolve by extending a letter, then by substituting one
  const src = name.replace(/[^A-Za-z]/g, "").toUpperCase();
  for (const c of src + "XYZ"){
    const t = base + c;
    if (t.length <= 5 && !taken.has(t)) return t;
  }
  let n = 2;
  while (taken.has(base + n)) n++;
  return base + n;
}

const between = (r, lo, hi) => lo + r() * (hi - lo);

function generateUniverse(seed, anchors){
  const r = mulberry32(seed ^ 0x5bf03635);
  const p = arr => arr[Math.floor(r() * arr.length)];
  const taken = new Set(anchors.map(a => a.ticker));
  const usedNames = new Set(anchors.map(a => a.name));
  const out = anchors.slice();
  const sectorKeys = Object.keys(SECTOR_KIT);
  // Roles cycle within each sector rather than being drawn at random. Random
  // assignment can leave a role with no companies at all, and then every story
  // written against that role quietly moves nothing.
  const roleTurn = {};

  let guard = 0;
  while (out.length < CONFIG.universeSize && guard++ < 6000){
    const sector = sectorKeys[out.length % sectorKeys.length];
    const kit = SECTOR_KIT[sector];

    // three name shapes
    let name;
    const shape = r();
    if (shape < 0.28) name = p(ROOTS);
    else if (shape < 0.82) name = p(ROOTS) + " " + p(kit.desc);
    else {
      const a = p(SURNAMES); let b2 = p(SURNAMES);
      while (b2 === a) b2 = p(SURNAMES);
      name = r() < 0.5 ? `${a} & ${b2}` : `${a} ${b2}`;
    }
    if (usedNames.has(name)) continue;
    usedNames.add(name);

    const ticker = tickerFor(name, taken);
    taken.add(ticker);

    roleTurn[sector] = (roleTurn[sector] || 0);
    const roles = kit.roles[roleTurn[sector]++ % kit.roles.length];
    /* Market cap is drawn from a heavy tail, not a uniform range. Real markets
       are a handful of giants and a very long spine of companies nobody has
       heard of, and coverage only concentrates the way it does in life if the
       sizes concentrate first. AI and technology skew larger on top of that. */
    const u = Math.max(r(), 0.004);
    let cap = 3.0e8 * Math.pow(1 / u, 1.35);
    if (sector === "ai") cap *= 2.6;
    else if (sector === "technology") cap *= 1.5;
    else if (sector === "utilities" || sector === "realestate") cap *= 0.55;
    cap = Math.min(cap, 2.6e12);

    const price = Math.round(between(r, 9, 340) * 100) / 100;
    const float = Math.max(5e6, Math.round(cap / price));
    const line = p(kit.lines).replace(/\{n\}/g, String(Math.floor(between(r, 3, 60))))
      .replace(/\{input\}/g, p(["iron ore","bauxite","limestone","recovered scrap","potash"]))
      .replace(/\{output\}/g, p(["plate and coil","industrial gases","polymers","structural sections","fertiliser"]));

    out.push({
      ticker, name, sector, roles,
      price,
      beta: Math.round(between(r, 0.55, 1.55) * 100) / 100,
      vol: between(r, kit.vol[0], kit.vol[1]),
      drift: between(r, kit.drift[0], kit.drift[1]),
      div: Math.round(between(r, kit.div[0], kit.div[1]) * 10) / 10,
      float,
      employees: Math.round(between(r, 300, 60000) / 100) * 100,
      hq: p(CITIES),
      ceo: p(INITIALS) + ". " + p(LASTNAMES),
      founded: Math.floor(between(r, 1878, 1998)),
      liquidity: Math.min(0.97, 0.55 + Math.log10(float / 1e6) / 5),
      desc: `${name} ${line}. ` + p([
        "Margins are thin and volumes large, so small changes in input costs matter more than they look.",
        "Roughly two thirds of revenue is contracted a year ahead; the balance is exposed to spot pricing.",
        "The business is cyclical and carries more debt than its peers, which cuts both ways.",
        "Management has prioritised the dividend over growth for most of the last decade.",
        "Costs are dominated by labour and energy, and the company has limited ability to pass either through quickly.",
        "A single customer accounts for a meaningful share of revenue, a fact disclosed in the filings and rarely discussed.",
      ]),
    });
  }
  return out;
}


/* ===========================================================================
   3. ENGINE
   ======================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1);
function gauss(){
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const money = n => (n < 0 ? "-$" : "$") + Math.abs(n)
  .toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
const pct = n => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const cls = n => n > 0.0001 ? "up" : n < -0.0001 ? "down" : "flat";

/* Several years of daily closes with a sector-appropriate trend. The chart is
   a lure by design: it shows the past, and the forward drift comes from the
   engine, not from this line. */
function backfill(a){
  const n = 3 * CONFIG.daysPerYear, closes = [], vols = [];
  // The chart is a lure. AI names show years of climbing because that is what
  // a bubble looks like from inside it, not because the engine owes them
  // anything going forward.
  const trend = a.drift * (a.sector === "ai" ? 4.2 : 2.2);
  let p = a.price / Math.pow(1 + trend, n);
  for (let i = 0; i < n; i++){
    const r = trend + a.vol * 0.8 * gauss();
    p *= Math.exp(r);
    closes.push(p);
    vols.push(Math.round(a.float * 0.004 * (0.5 + rand()) * (1 + Math.abs(r) * 40)));
  }
  const adj = a.price / closes[closes.length - 1];
  return { closes: closes.map(x => x * adj), vols };
}

/* ---------------------------------------------------------------------------
   FUNDS

   ETFs hold their constituents and derive their price from them, so the sector
   ripple flows through a fund for free: read a drought story, buy the
   agriculture fund, and you have bought certainty instead of precision.

   Leveraged funds track the daily percentage move, multiplied. That is not a
   simplification — it is exactly why they decay. A basket that falls 10% and
   then rises 11.1% is flat; a 3x fund on the same basket is down 6%. Nothing
   in the interface explains this and nothing should.
   ------------------------------------------------------------------------ */
const FUND_SPECS = [
  { t:"STRX", n:"Sterling 500 Index Fund",        kind:"index", idx:"STR", exp:0.0009 },
  { t:"BIAX", n:"Brackford 30 Index Fund",        kind:"index", idx:"BIA", exp:0.0016 },

function buildFunds(assets, indices){
  const out = {};
  const companies = Object.values(assets).filter(a => !a.isFund);
  for (const f of FUND_SPECS){
    let holdings;
    if (f.kind === "index" || (f.kind === "lev" && f.idx)) holdings = indices[f.idx].members.slice();
    else if (f.sec) holdings = companies.filter(a => a.sector === f.sec).map(a => a.ticker);
    else {
      const by = { dividend: (a,b) => b.div - a.div,
                   large:    (a,b) => marketCap(b) - marketCap(a),
                   small:    (a,b) => marketCap(a) - marketCap(b),
                   lowvol:   (a,b) => a.vol - b.vol }[f.pick];
      holdings = companies.slice().sort(by).slice(0, 25).map(a => a.ticker);
    }
    if (!holdings.length) continue;

    const basket = () => holdings.reduce((t, k) => t + assets[k].price * assets[k].float, 0);
    const start = f.kind === "lev" ? 40 : 100;
    out[f.t] = {
      ticker:f.t, name:f.n, sector:"funds", roles:[], isFund:true,
      fundKind:f.kind, holdings, expense:f.exp, leverage:f.lev || 1,
      price:start, open:start, prevClose:start, dayHigh:start, dayLow:start,
      volume:0, intraday:[start], intradayVol:[0], sessions:[],
      divisor: basket() / start,
      lastBasket: basket(),
      beta:1, vol:0.01, drift:0,
      div: f.pick === "dividend" ? 3.4 : f.kind === "lev" ? 0 : 1.4,
      float: 40e6, liquidity: f.kind === "lev" ? 0.80 : 0.94,
      employees:0, hq:"\u2014", ceo:"\u2014", founded:0,
      desc: fundBlurb(f, holdings.length),
      history:[], histVol:[], backfillLen:0,
    };
  }
  return out;
}

function fundBlurb(f, n){
  if (f.kind === "lev"){
    const d = f.lev < 0 ? "the inverse of" : `${f.lev} times`;
    return `Seeks daily results corresponding to ${d} the daily performance of its benchmark, `
      + `before fees and expenses of ${(f.exp*100).toFixed(2)}% annually. The objective is DAILY. `
      + `Held for longer than a day, the fund's return will differ from ${d} the benchmark's return `
      + `over that period, and the difference grows with volatility. This is disclosed in every `
      + `document the fund publishes and is the single most misunderstood sentence in the industry.`;
  }
  if (f.kind === "index")
    return `Tracks its benchmark by holding all ${n} constituents in proportion to their market value. `
      + `Annual expenses of ${(f.exp*100).toFixed(2)}%, which is roughly the cheapest way to own the market.`;
  if (f.kind === "sector")
    return `Holds the ${n} listed companies in its sector, weighted by market value. Annual expenses `
      + `of ${(f.exp*100).toFixed(2)}%. Buying the sector rather than the company trades precision for certainty: `
      + `you give up the winner and you are spared the loser.`;
  return `Holds ${n} companies selected by a published screen, rebalanced on a schedule nobody reads. `
    + `Annual expenses of ${(f.exp*100).toFixed(2)}%.`;
}

/* Funds are priced from their basket, never from the random walk. */
function updateFunds(){
  const perTick = 1 / CONFIG.ticksPerDay;
  for (const t in S.assets){
    const f = S.assets[t];
    if (!f.isFund) continue;
    const basket = f.holdings.reduce((sum, k) => {
      const a = S.assets[k];
      return a ? sum + a.price * a.float : sum;
    }, 0);
    if (f.leverage === 1){
      f.price = basket / f.divisor;
    } else {
      const r = f.lastBasket ? basket / f.lastBasket - 1 : 0;
      f.price = Math.max(0.01, f.price * (1 + f.leverage * r));
    }
    f.lastBasket = basket;
    f.price = Math.max(0.01, f.price * (1 - f.expense * perTick));
    f.dayHigh = Math.max(f.dayHigh, f.price);
    f.dayLow = Math.min(f.dayLow, f.price);
    f.volume += Math.round(f.float * 0.00003 * (0.5 + rand()));
    f.intraday.push(f.price);
    f.intradayVol.push(0);
  }
}

/* role -> [tickers]. Rebuilt whenever the universe is built, and the only
   thing news effects ever resolve against. */
function buildRoleIndex(assets){
  const idx = {};
  for (const t in assets)
    for (const r of assets[t].roles || [])
      (idx[r] = idx[r] || []).push(t);
  return idx;
}

/* Tier 1 shows four names. It is not a filter over a visible list — the rest
   of the market simply is not there yet, with no greyed-out rows to tease it. */
function listedAssets(){
  if (!grants("full_universe"))
    return CONFIG.starterTickers.map(t => S.assets[t]).filter(Boolean);
  const all = Object.values(S.assets);
  return grants("etfs") ? all : all.filter(a => !a.isFund);
}
const isListed = t => listedAssets().some(a => a.ticker === t);

/* ---------------------------------------------------------------------------
   A CENTURY OF INVENTED HISTORY

   Purely cosmetic, and worth it. Each index runs back as far as the thing it
   is a parody of: the industrial average to 1896, the broad index to 1957, the
   composite to 1971. Long enough that pulling the chart out to MAX shows a
   shape a person actually recognises — the twenties boom, the crater after it,
   the post-war run, the seventies going nowhere in a hurry, the long bull, the
   bubble and the hole it left.

   Years that mattered are scripted. Every other year is drawn from a lognormal
   with a positive drift, because the honest long-run shape of an equity index
   is up and to the right with the floor falling out every couple of decades.

   None of this feeds the price engine. It is a lure, exactly like the
   companies' three-year charts: the past is dramatic, and the forward drift
   owes it nothing.
   ------------------------------------------------------------------------ */
const HISTORY_SCRIPT = {
  1907:-0.38, 1908:+0.46,                                  // the panic
  1915:+0.82, 1916:-0.04, 1917:-0.22, 1919:+0.30,
  1920:-0.33, 1921:+0.13,
  1924:+0.26, 1925:+0.30, 1926:+0.03, 1927:+0.29, 1928:+0.48,
  1929:-0.17, 1930:-0.34, 1931:-0.53, 1932:-0.23, 1933:+0.67, // the crater
  1937:-0.33, 1938:+0.28,
  1941:-0.15, 1942:+0.08, 1945:+0.27,
  1954:+0.44, 1958:+0.34,
  1962:-0.11, 1966:-0.19, 1968:+0.08,
  1969:-0.15, 1970:+0.05, 1973:-0.17, 1974:-0.28, 1975:+0.38, // the seventies
  1977:-0.12, 1981:-0.09,
  1982:+0.20, 1983:+0.23, 1985:+0.28, 1986:+0.23,
  1987:-0.02,                                                // crashed, ended flat
  1989:+0.28, 1990:-0.08, 1991:+0.27, 1995:+0.34, 1996:+0.20,
  1997:+0.31, 1998:+0.27, 1999:+0.20,
  2000:-0.10, 2001:-0.13, 2002:-0.23,                        // the unwind
  2003:+0.26, 2004:+0.09, 2005:+0.03, 2006:+0.14, 2007:+0.04,
  2008:-0.38, 2009:+0.23,                                    // the financial crisis
  2010:+0.13, 2011:0.00, 2012:+0.13, 2013:+0.30, 2014:+0.11,
  2015:-0.01, 2016:+0.10, 2017:+0.19, 2018:-0.06, 2019:+0.29,
  2020:+0.16,                                                // fell through the floor, closed up
  2021:+0.27, 2022:-0.19, 2023:+0.24,
};

/* The composite is the same market with the volume turned up: it runs harder
   in the boom and falls through the floor afterwards. */
const TECH_SCRIPT = {
  1973:-0.31, 1974:-0.35, 1975:+0.30,
  1990:-0.18, 1991:+0.57, 1995:+0.40, 1996:+0.23, 1997:+0.22,
  1998:+0.40, 1999:+0.86,
  2000:-0.39, 2001:-0.21, 2002:-0.32,
  2003:+0.50, 2008:-0.41, 2009:+0.44, 2013:+0.38, 2017:+0.28,
  2019:+0.35, 2020:+0.44, 2021:+0.21, 2022:-0.33, 2023:+0.43,
};

/* A crash inside a year that closed near flat still has to be visible, or 1987
   is just a boring sideways stretch. */
const INTRAYEAR_CRASH = { 1929:0.48, 1987:0.34, 1907:0.30, 2001:0.26,
                          2008:0.42, 2020:0.38, 2022:0.24 };

function deepHistory(def, endValue, rng){
  // ends where the constituent-derived three-year backfill takes over
  const startYear = def.since, endYear = CONFIG.epochYear - 3;
  const dpy = CONFIG.daysPerYear;
  const g = () => {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  const out = [];
  let p = def.sinceValue;
  for (let y = startYear; y < endYear; y++){
    let annual = (def.flavor === "tech" && TECH_SCRIPT[y] !== undefined)
      ? TECH_SCRIPT[y] : HISTORY_SCRIPT[y];
    if (annual === undefined){
      const vol = def.flavor === "tech" ? 0.26 : def.flavor === "old" ? 0.19 : 0.17;
      annual = Math.exp(0.072 + vol * g()) - 1;
    }
    const perDay = Math.pow(1 + annual, 1 / dpy) - 1;
    const noise = (def.flavor === "tech" ? 0.022 : 0.016);
    const dip = INTRAYEAR_CRASH[y];
    for (let d = 0; d < dpy; d++){
      p *= (1 + perDay) * Math.exp(noise * g());
      // a scripted intra-year crater, cut in fast and clawed back slowly
      if (dip){
        const t = d / dpy;
        const shape = t < 0.55 ? 0 : t < 0.65 ? (t - 0.55) / 0.10 : 1 - (t - 0.65) * 0.9;
        p *= 1 - dip * 0.055 * Math.max(0, shape);
      }
      out.push(Math.max(0.5, p));
    }
  }

  // Pin both ends without flattening the shape: spread the correction
  // geometrically across the series.
  const raw = out[out.length - 1];
  const k = Math.pow(endValue / raw, 1 / out.length);
  return out.map((v, i) => v * Math.pow(k, i + 1));
}

/* Membership is fixed when the world is built, so the index is a consistent
   basket rather than whatever happens to qualify this morning. */
function buildIndices(assets){
  const out = {};
  for (const k in INDICES){
    const def = INDICES[k];
    let members = Object.values(assets).filter(def.member);
    if (def.limit)
      members = members.sort((a, b) => marketCap(b) - marketCap(a)).slice(0, def.limit);
    const tickers = members.map(a => a.ticker);
    const divisor = def.weight === "price"
      ? members.reduce((t, a) => t + a.price, 0) / def.base
      : members.reduce((t, a) => t + marketCap(a), 0) / def.base;
    out[k] = { ...def, members:tickers, divisor,
               value:def.base, prevClose:def.base, open:def.base,
               intraday:[def.base], history:[], histVol:[] };
  }
  return out;
}

function backfillFunds(){
  const companies = Object.values(S.assets).filter(a => !a.isFund);
  const n = companies[0] ? companies[0].history.length : 0;
  for (const t in S.assets){
    const f = S.assets[t];
    if (!f.isFund) continue;
    const hist = [];
    let lev = 40, lastB = null;
    for (let d = 0; d < n; d++){
      let basket = 0;
      for (const k of f.holdings){
        const a = S.assets[k];
        if (a && a.history[d] !== undefined) basket += a.history[d] * a.float;
      }
      if (f.leverage === 1) hist.push(basket / f.divisor);
      else {
        const r = lastB ? basket / lastB - 1 : 0;
        lev = Math.max(0.05, lev * (1 + f.leverage * r) * (1 - f.expense / CONFIG.daysPerYear));
        hist.push(lev);
      }
      lastB = basket;
    }
    // pin the last historical point to today's price so the chart joins up
    const k = hist.length ? f.price / hist[hist.length - 1] : 1;
    f.history = hist.map(v => v * k);
    f.histVol = hist.map(() => 0);
    f.backfillLen = f.history.length;
    f.lastBasket = f.holdings.reduce((sum, x) => {
      const a = S.assets[x]; return a ? sum + a.price * a.float : sum; }, 0);
  }
}

function indexValue(ix){
  let agg = 0;
  for (const t of ix.members){
    const a = S.assets[t];
    if (!a) continue;
    agg += ix.weight === "price" ? a.price : marketCap(a);
  }
  return agg / ix.divisor;
}

function updateIndices(){
  for (const k in S.indices){
    const ix = S.indices[k];
    ix.value = indexValue(ix);
    ix.intraday.push(ix.value);
  }
}

/* Backfill index history from the constituents' invented past, so the charts
   go back as far as the companies do. */
function backfillIndices(){
  const n = 3 * CONFIG.daysPerYear;
  for (const k in S.indices){
    const ix = S.indices[k];
    const hist = [];
    for (let d = 0; d < n; d++){
      let agg = 0;
      for (const t of ix.members){
        const a = S.assets[t];
        const px = a.history[d];
        if (px === undefined) continue;
        agg += ix.weight === "price" ? px : px * a.float;
      }
      hist.push(agg / ix.divisor);
    }
    const deep = deepHistory(ix, hist[0], mulberry32((S.seed ^ 0x9e3779b9) + k.charCodeAt(0)));
    ix.history = deep.concat(hist);
    ix.histVol = ix.history.map(() => 0);
    ix.backfillLen = ix.history.length;
    ix.inception = ix.since;
  }
}

const spread = a =>
  Math.max(CONFIG.spreadFloor, (1 - a.liquidity) * 0.010 + a.vol * 0.05) * broker().spreadMult;
/* Per-trade cost at the firm you are routed through. Most charge a flat
   commission; the crypto venues take a percentage, which is why a small
   order at Chodebase is so much worse than it looks. */
function feeOn(dollars){
  const b = broker();
  return b.feeRate ? dollars * b.feeRate : b.commission;
}
const fee = () => broker().commission;
const askOf  = a => a.price * (1 + spread(a) / 2);
const bidOf  = a => a.price * (1 - spread(a) / 2);

function stepTick(){
  /* Nothing ticks while the market is shut. Without this, anything that keeps
     calling stepTick past the bell re-runs the close on every tick: the day
     counter runs away, and every live news effect expires instantly because
     its window is measured in absolute ticks. */
  if (S.phase !== "open") return;
  const tpd = CONFIG.ticksPerDay;
  runSchedule();
  const fx = effectDrift();

  const marketFactor = (CONFIG.dailyMarketDrift + CONFIG.earlyBullTilt) / tpd
                     + (CONFIG.dailyMarketVol / Math.sqrt(tpd)) * gauss()
                     + fx.market;

  const sVol = CONFIG.dailySectorVol / Math.sqrt(tpd);
  for (const k in S.sectorState) S.sectorState[k] = sVol * gauss() + (fx.sector[k] || 0);

  for (const t in S.assets){
    const a = S.assets[t];
    if (a.isFund) continue;             // priced from holdings, not walked
    let jump = 0;
    if (rand() < CONFIG.jumpChancePerTick)
      jump = (rand() < 0.5 ? -1 : 1) * CONFIG.jumpSize * (0.5 + rand());

    const r = a.beta * marketFactor
            + SECTORS[a.sector].beta * S.sectorState[a.sector]
            + a.drift / tpd
            + (fx.ticker[t] || 0)
            + (a.vol / Math.sqrt(tpd)) * gauss()
            + jump;

    a.price = Math.max(0.01, a.price * Math.exp(r));
    a.dayHigh = Math.max(a.dayHigh, a.price);
    a.dayLow  = Math.min(a.dayLow, a.price);

    const tickVol = Math.round(a.float * 0.00002 * (0.5 + rand()) * (1 + Math.abs(r) * 260));
    a.volume += tickVol;
    a.intraday.push(a.price);
    a.intradayVol.push(tickVol);
  }
  updateFunds();
  updateIndices();
  /* Gooner goes down when volatility spikes, which is exactly when you want it.
     Measured off the broad index rather than any one name, so it is the market
     moving that breaks them, not a single stock. */
  const ix = S.indices.STR;
  S.venueDown = ix ? Math.abs((ix.value - ix.prevClose) / ix.prevClose) > CONFIG.goonerBreaksAt : false;
  S.tick++;
  if (S.tick >= CONFIG.ticksPerDay) closeDay();
}

function openDay(){
  for (const t in S.assets){
    const a = S.assets[t];
    a.prevClose = a.price;
    if (!a.isFund) a.price = Math.max(0.01, a.price * Math.exp(CONFIG.overnightGapVol * gauss()));
    a.open = a.price;
    a.dayHigh = a.price; a.dayLow = a.price; a.volume = 0;
    a.intraday = [a.price]; a.intradayVol = [0];
  }
  for (const k in S.indices) S.indices[k].prevClose = S.indices[k].value;
  updateIndices();                       // prices gapped overnight; revalue first
  for (const k in S.indices){
    const ix = S.indices[k];
    ix.open = ix.value;
    ix.intraday = [ix.value];
  }
  updateFunds();                        // funds gap with their baskets
  for (const t in S.assets) if (S.assets[t].isFund){
    const f = S.assets[t]; f.open = f.price; f.intraday = [f.price]; f.dayHigh = f.dayLow = f.price;
  }
  S.tick = 0;
  S.phase = "open";
  scheduleDay();
  flash("Market open.");
  render();
}

function closeDay(){
  S.phase = "closed";
  for (const t in S.assets){
    const a = S.assets[t];
    // Archive the session tick by tick so week and hour views have real data
    // rather than a straight line between closes. Capped, because a thousand
    // companies' worth of tick history is not something to keep forever.
    a.sessions.push({ day:S.day, prices:a.intraday.slice(), vols:a.intradayVol.slice() });
    if (a.sessions.length > CONFIG.sessionsKept) a.sessions.shift();
    a.history.push(a.price);
    a.histVol.push(a.volume);
  }
  for (const k in S.indices){
    S.indices[k].history.push(S.indices[k].value);
    S.indices[k].histVol.push(0);
  }
  if (S.positions.length) step("hold_overnight");     // carrying it through is a step
  bankDay();
  taxDay();
  deliver(MAILBOX.newsletter());
  checkTier();
  S.day++;
  flash("Market closed. Planning.");
  render();
}

/* -- orders. Refusals are plain text in the ticket, and each one re-renders,
      or the player is told nothing at all. ------------------------------- */
function fail(msg){ S.lastError = msg; render(); return false; }

function buy(ticker, dollars){
  S.lastError = S.lastOk = null;
  const a = S.assets[ticker];
  if (!a) return fail("No such ticker.");
  if (S.phase !== "open") return fail("The market is closed. Orders cannot be placed outside trading hours.");
  if (!isListed(ticker)) return fail("That security is not available on your account.");
  if (S.positions.some(x => x.ticker === ticker))
    return fail(`You already hold ${a.ticker}. Adding to a position is not supported on this account.`);
  if (S.positions.length >= slotCount())
    return fail(slotCount() === 1
      ? "You already hold a position. Your account supports one at a time."
      : `All ${slotCount()} position slots are in use. Close one first.`);
  if (!(dollars > 0)) return fail("Enter an amount to invest.");

  const cost = feeOn(dollars);
  /* A venue that is down is down for everything. Telling the player what the
     firm does not carry, while the firm is not answering at all, is the wrong
     complaint in the wrong order. */
  if (broker().flaky && S.venueDown)
    return fail(`${broker().name} is not responding. It does this when the market is moving, `
              + `which is a coincidence they have never explained.`);
  if (!broker().carries.includes(instrumentOf(a)))
    return fail(`${broker().name} does not carry ${instrumentOf(a) === "fund" ? "funds" : instrumentOf(a) + "s"}. `
              + `Route the order through another firm.`);
  if (dollars + cost > S.cash)
    return fail(`Insufficient cash. ${money(dollars)} plus ${money(cost)} in fees `
              + `exceeds your balance of ${money(S.cash)}.`);

  const ask = askOf(a), shares = dollars / ask;
  const maxShares = a.float * CONFIG.maxFloatFraction;
  if (shares > maxShares)
    return fail(`Order too large. The maximum on ${a.ticker} is `
              + `${maxShares.toLocaleString("en-US",{maximumFractionDigits:0})} shares.`);

  S.cash -= dollars + cost;
  S.positions.push({ ticker, shares, costBasis:ask, openedDay:S.day,
                     openedTick:S.tick, commissionPaid:cost, broker:S.broker });
  S.tradesMade++;
  if (S.broker === "squirtr"){
    S.confetti = true;
    setTimeout(() => { S.confetti = false; if (currentTab().url === "tugmore.com") render(); }, 2400);
  }
  S.lastOk = `Bought ${shares.toFixed(4)} ${a.ticker} at ${money(ask)}`
           + (cost ? `. Fees ${money(cost)}.` : ", commission free.");
  step("place_buy");
  render();
  return true;
}

function sell(ticker){
  S.lastError = S.lastOk = null;
  if (S.phase !== "open") return fail("The market is closed. Orders cannot be placed outside trading hours.");
  if (!S.positions.length) return fail("You have no position to sell.");

  const idx = ticker ? S.positions.findIndex(x => x.ticker === ticker) : 0;
  if (idx < 0) return fail(`You do not hold ${ticker}.`);
  const p = S.positions[idx], a = S.assets[p.ticker], bid = bidOf(a);
  const gross = p.shares * bid;
  const exitFee = feeOn(gross);
  const proceeds = gross - exitFee;
  const pnl = proceeds - (p.shares * p.costBasis + p.commissionPaid);

  S.cash += proceeds;
  S.positions.splice(idx, 1);
  S.tradesMade++;

  // Reputation barely moves on an unleveraged trade: 4 x (pnl / net worth),
  // capped, then damped by distance from zero.
  recordRealised(p, pnl);
  addRep(Math.max(-0.6, Math.min(0.6, 4 * (pnl / Math.max(netWorth(), 1)))));

  S.lastOk = `Sold ${p.shares.toFixed(4)} ${a.ticker} at ${money(bid)}. `
           + `Realised ${pnl >= 0 ? "gain" : "loss"} of ${money(Math.abs(pnl))}.`;
  step("close_position");
  checkTier();
  render();
  return true;
}

const netWorth = () =>
  S.cash
  + S.positions.reduce((t, p) => t + p.shares * bidOf(S.assets[p.ticker]), 0)
  + totalDeposits()
  - S.loans.reduce((t, l) => t + l.owed, 0);

function pnlOf(p){
  const a = S.assets[p.ticker], bid = bidOf(a);
  const value = p.shares * bid;
  return { bid, value, pnl: value - (p.shares * p.costBasis + p.commissionPaid) - feeOn(value) };
}
const holding = t => S.positions.find(p => p.ticker === t) || null;

/* -- calendar ------------------------------------------------------------ */
/* Day numbers go negative: the backfilled history sits before the career
   starts, and the chart has to label those years properly rather than
   clamping three invented years onto day one. Floor division and a
   positive modulo handle both directions. */
function gameDate(day){
  const idx = day - 1;
  const y = Math.floor(idx / CONFIG.daysPerYear);
  const inYear = ((idx % CONFIG.daysPerYear) + CONFIG.daysPerYear) % CONFIG.daysPerYear;
  const q = Math.floor(inYear / CONFIG.daysPerQuarter) + 1;
  const inQ = inYear % CONFIG.daysPerQuarter;
  const month = q * 3 - 3 + Math.floor(inQ / 4);
  const dom = 3 + (inQ % 4) * 7;
  const yr = CONFIG.epochYear + y;
  return { y:yr, q, month, dom, inQ, label:`${MONTHS[month].slice(0,3)} ${dom}, ${yr}` };
}
function clockLabel(){
  if (S.phase !== "open") return "--:--";
  const span = CONFIG.closeMinute - CONFIG.openMinute;
  const m = CONFIG.openMinute + Math.floor(span * (S.tick / CONFIG.ticksPerDay));
  return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

const tierDef = n => TIERS.find(t => t.n === n) || TIERS[0];

function slotCount(){
  let s = 1;
  for (const t of TIERS){
    if (t.n > S.tier) break;
    if (!t.slots) continue;
    // a licence tier's slots arrive with the licence, not with the tier
    if (t.licence && !hasLicence(t.licence)) continue;
    s = t.slots;
  }
  return s;
}

const hasLicence = id => S.licences.includes(id);
function grants(feature){
  for (const id of S.licences)
    if ((LICENCES[id].grants || []).includes(feature)) return true;
  return false;
}

/** Licences visible in the shop: tier reached, not yet held. */
function offeredLicences(){
  return TIERS.filter(t => t.licence && t.n <= S.tier && !hasLicence(t.licence))
              .map(t => ({ ...LICENCES[t.licence], tier:t.n }));
}

function canBuyLicence(id){
  const t = TIERS.find(t => t.licence === id);
  if (!t) return { ok:false, why:"No such licence." };
  if (hasLicence(id)) return { ok:false, why:"Already held." };
  if (t.n > S.tier) return { ok:false, why:"Not offered on your account." };
  const L = LICENCES[id];
  if (S.rep < L.rep)
    return { ok:false, why:`Requires a reputation of ${L.rep}. Yours is ${S.rep.toFixed(1)}.`, reason:"rep" };
  if (S.cash < L.fee)
    return { ok:false, why:`The application fee is ${money(L.fee)}. You have ${money(S.cash)}.`, reason:"cash" };
  return { ok:true, fee:L.fee };
}

function buyLicence(id){
  const c = canBuyLicence(id);
  if (!c.ok){ S.lastError = c.why; render(); return false; }
  S.cash -= c.fee;
  S.licences.push(id);
  S.lastOk = `${LICENCES[id].name} approved.`;
  deliver(MAILBOX.licence(LICENCES[id]));
  flash("Licence approved.");
  render();
  return true;
}

/* Tiers trigger on peak net worth alone. Reputation never gates a tier, only
   the licence a tier puts in the shop. */
function checkTier(){
  const nw = netWorth();
  S.peakNetWorth = Math.max(S.peakNetWorth || nw, nw);
  let reached = null;
  for (;;){
    /* tierDef falls back to TIERS[0] for an unknown number, so past the final
       tier it would hand back tier 1 and quietly demote a finished career. */
    const next = TIERS.find(t => t.n === S.tier + 1);
    if (!next) break;
    if (next.tutorial){ if (stepsDone() < STEPS.length) break; }
    else if (!next.nw || S.peakNetWorth < next.nw) break;

    S.tier = next.n;
    reached = next;
    const cash = next.nw ? next.nw * CONFIG.tierCashBonusFrac : 0;
    S.cash += cash;
    const repBase = Math.abs(S.rep) * CONFIG.tierRepBonusFrac;
    S.rep = clampRep(S.rep + repDelta(repBase));
    /* A licence that costs nothing and asks nothing is not a decision, it is
       paperwork. Grant it with the tier so that reaching tier 2 feels like
       being let out of a room rather than like finding a form. */
    if (next.licence){
      const L = LICENCES[next.licence];
      if (!L.fee && !L.rep && !hasLicence(L.id)) S.licences.push(L.id);
    }
    deliver(MAILBOX.tier(next, cash));
    if (next.n === FINAL_TIER) S.careerComplete = true;
  }
  if (reached) setTimeout(() => showTierNotice(reached), 80);
  return reached;
}

const clampRep = r => Math.max(-100, Math.min(100, r));
/* Resistance: moving away from zero is damped, moving back toward it is not.
   At reputation 80 a gain is worth a fifth of face value. */
function repDelta(base){
  if ((base > 0 && S.rep >= 0) || (base < 0 && S.rep <= 0))
    return base * (100 - Math.abs(S.rep)) / 100;
  return base;
}
function addRep(base){ S.rep = clampRep(S.rep + repDelta(base)); }
