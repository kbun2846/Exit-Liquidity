<!DOCTYPE html>
<!--
  EXIT LIQUIDITY — Tier 1
  ========================
  The tutorial tier, complete. Four dull stocks, one position slot, market
  orders, charts, ticker search and sort, one brokerage, one bank, mail, and
  the calendar. Tier 1 hides the world rather than disabling it: there are no
  greyed-out entries and no "unlocks later" labels anywhere in this file.

  Two things worth knowing before reading on.

  1. The page is NOT rebuilt on every tick. A tick fires every three seconds,
     and rebuilding the DOM that often destroys open dropdowns and steals
     focus mid-keystroke. Instead, elements that change carry a data-lv
     attribute and liveUpdate() rewrites just those. Full render() happens on
     navigation and on player actions only.

  2. One self-contained file, because it has to open from a local disk and run
     inside a cross-origin iframe, neither of which tolerates module imports.

  Order below: CONFIG / DATA / ENGINE / MAIL / SITES / CHARTS / SHELL / BOOT.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Liquidity</title>
<style>
/* ===========================================================================
   Browser chrome — modern, quiet, gets out of the way.
   ======================================================================== */
:root{
  --bg:#dee1e6; --bar:#fff; --line:#e3e5e8; --line2:#d3d6da;
  --ink:#202124; --ink2:#5f6368; --accent:#1a73e8;
  --up:#137333; --down:#c5221f; --flat:#5f6368;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#202124;color:var(--ink);
  font:13px/1.45 var(--ui);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.r{text-align:right}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.muted{color:var(--ink2)}
.small{font-size:11.5px}
.hidden{display:none !important}

button{
  font:13px var(--ui);color:var(--ink);background:#f1f3f4;border:1px solid transparent;
  padding:6px 14px;border-radius:6px;cursor:pointer;transition:background .12s;
}
button:hover:not(:disabled){background:#e4e6e9}
button:active:not(:disabled){background:#d9dbdf}
button:disabled{color:#b0b3b8;cursor:default;background:#f6f7f8}
button.primary{background:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#1765cc}
button.primary:disabled{background:#c3d7f5;color:#fff}
input,select{
  font:13px var(--ui);color:var(--ink);background:#fff;
  border:1px solid var(--line2);border-radius:6px;padding:6px 9px;outline:none;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,115,232,.15)}
input.num{font-family:var(--mono)}

/* ---- window ---- */
#browser{
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
}

/* tab strip */
.tabstrip{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;height:44px;flex:none}
.tab{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;
  background:#c8ccd1;border-radius:10px 10px 0 0;font-size:12.5px;color:#3c4043;
  max-width:240px;min-width:120px;overflow:hidden;white-space:nowrap;cursor:default;
}
.tab .fav{width:15px;height:15px;border-radius:4px;background:#8b9096;flex:none;
  font:700 9px var(--ui);color:#fff;display:flex;align-items:center;justify-content:center}
.tab .lbl{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bar);color:var(--ink);font-weight:500}
.tab.on .fav{background:var(--accent)}
.tabstrip .newtab{width:28px;height:28px;border-radius:50%;background:transparent;
  display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:17px;margin-bottom:4px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--bar);flex:none}
.iconbtn{width:30px;height:30px;border-radius:50%;background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:14px;border:0}
.iconbtn:hover:not(:disabled){background:#f1f3f4}
.omni{flex:1;display:flex;align-items:center;gap:8px;background:#f1f3f4;border-radius:18px;
  padding:0 14px;height:32px;border:1px solid transparent}
.omni:focus-within{background:#fff;border-color:#d3d6da;box-shadow:0 1px 6px rgba(32,33,36,.18)}
.omni .lock{color:#5f6368;font-size:11px;flex:none}
.omni input{flex:1;border:0;background:transparent;padding:0;font-size:13px;
  font-family:var(--mono);color:var(--ink);box-shadow:none}
.omni input:focus{box-shadow:none;border:0}
.repchip{display:flex;align-items:center;gap:6px;background:#f1f3f4;border-radius:16px;
  padding:5px 12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.repchip b{color:var(--ink);font-family:var(--mono);font-size:12.5px}

/* bookmarks */
.bookmarks{display:flex;align-items:center;gap:2px;padding:0 10px 7px;background:var(--bar);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.bookmarks::-webkit-scrollbar{display:none}
.bm{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;
  font-size:12px;color:#3c4043;white-space:nowrap;cursor:default}
.bm:hover{background:#f1f3f4}
.bm .fav{width:14px;height:14px;border-radius:3px;flex:none;
  font:700 8px var(--ui);color:#fff;display:flex;align-items:center;justify-content:center}
.bm .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

/* ticker tape */
.tape{overflow:hidden;background:#202124;height:26px;flex:none;position:relative}
.tape .run{position:absolute;white-space:nowrap;font-family:var(--mono);font-size:11.5px;
  line-height:26px;color:#9aa0a6;will-change:transform}
.tape .sym{color:#e8eaed;font-weight:600}
.tape .u{color:#81c995}.tape .d{color:#f28b82}

#viewport{flex:1;overflow:auto;background:#fff}

/* status bar */
.statusbar{display:flex;align-items:center;gap:0;background:#f1f3f4;border-top:1px solid var(--line);
  padding:0 12px;height:26px;font-size:11.5px;color:var(--ink2);flex:none}
.statusbar .cell{padding:0 12px 0 0;margin-right:12px;border-right:1px solid var(--line2);line-height:26px}
.statusbar .cell:last-child{border:0;margin:0}
.statusbar .grow{flex:1;border:0}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px}
.dotlive.shut{background:#9aa0a6}

/* ===========================================================================
   Shared site furniture
   ======================================================================== */
.site{min-height:100%}
a,.lnk{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover,.lnk:hover{text-decoration:underline}

table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--ink2);padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
tr.row{cursor:pointer}
tr.row:hover{background:#f8f9fa}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card>h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  color:var(--ink2);padding:11px 15px;border-bottom:1px solid var(--line)}
.card>.body{padding:15px}
/* -- news feed -- */
.tagpill{display:inline-block;font:700 9.5px var(--ui);letter-spacing:.9px;padding:3px 8px;
  border-radius:3px;text-transform:uppercase;vertical-align:middle}
.tagpill.brk{background:#c5221f;color:#fff}
.tagpill.imp{background:#0f2440;color:#fff}
.tagpill.sm{font-size:8.5px;padding:2px 6px;margin-right:7px}
.quill .navbar span.lnk{color:var(--ink2);cursor:pointer;text-decoration:none}
.quill .navbar span.lnk:hover{color:var(--ink)}
.quill .navbar span.lnk.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.lead{max-width:680px;padding-bottom:20px;margin-bottom:8px;border-bottom:2px solid var(--ink);cursor:pointer}
.lead h2{font:400 30px var(--serif);letter-spacing:-.6px;margin:8px 0 5px;line-height:1.2}
.lead:hover h2{color:var(--accent)}
.lead p{font:15px/1.6 var(--serif);color:#3c4043;margin:10px 0 0}
.feed{max-width:680px}
.storyrow{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.storyrow .hd{font:600 15px var(--ui);letter-spacing:-.2px}
.storyrow:hover .hd{color:var(--accent)}
.storyrow.fresh .hd::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-left:8px;vertical-align:middle}
.storyrow .meta{font-size:11.5px;color:var(--ink2);margin-top:4px}
.fillerrow{display:flex;gap:12px;align-items:baseline;padding:7px 0;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;color:#80868b}
.fillerrow .src{width:170px;flex:none;font-size:10.5px;letter-spacing:.2px}
.fillerrow .hd{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fillerrow .tm{font-size:10.5px}
.fillerrow:hover{color:var(--ink2)}

.ranges{display:flex;gap:3px;padding:8px 12px 0}
.rg{padding:4px 12px;border-radius:14px;font-size:11.5px;font-weight:600;letter-spacing:.3px;
  background:transparent;color:var(--ink2);border:0}
.rg:hover:not(.on){background:#f1f3f4}
.rg.on{background:#e8f0fe;color:var(--accent)}
.chartwrap{padding:4px 10px 10px}
.chartwrap canvas{cursor:crosshair}
.idxstrip{display:flex;gap:0;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
.idxcell{padding:11px 22px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;min-width:190px}
.idxcell:hover{background:#f8f9fa}
.idxcell .nm{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--ink2)}
.idxcell .vv{margin-top:3px;display:flex;gap:9px;align-items:baseline}
.idxcell .vv .num:first-child{font-size:16px;font-weight:600;letter-spacing:-.4px}
.hot{display:inline-block;font:700 8.5px var(--ui);letter-spacing:.7px;padding:1px 5px;
  border-radius:3px;background:#7b1fa2;color:#fff;vertical-align:middle;margin-left:4px}
button.mini{padding:3px 10px;font-size:11.5px;border-radius:5px}

.err{background:#fce8e6;border-radius:6px;color:#c5221f;padding:9px 12px;margin-top:11px;font-size:12.5px}
.ok{background:#e6f4ea;border-radius:6px;color:#137333;padding:9px 12px;margin-top:11px;font-size:12.5px}

/* -- portal -- */
.portal{background:#f8f9fa;min-height:100%}
.portal .masthead{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px}
.portal .masthead h1{margin:0;font:600 22px var(--ui);letter-spacing:-.6px}
.portal .masthead .tagline{font-size:12.5px;color:var(--ink2);margin-top:2px}
.portal .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
  gap:14px;padding:20px 28px;align-items:start}
.cal{width:100%;border-collapse:separate;border-spacing:4px}
.cal td{text-align:center;border:1px solid var(--line);border-radius:6px;padding:9px 0;
  font-family:var(--mono);font-size:12px;color:var(--ink2)}
.cal td.today{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cal td.past{color:#bdc1c6;background:#fafafa}

/* -- Quill Street -- */
.quill{background:#fff}
.quill .masthead{border-bottom:1px solid var(--line);padding:22px 28px 16px;text-align:left}
.quill .masthead h1{margin:0;font:400 30px var(--serif);letter-spacing:-.5px;color:#111}
.quill .masthead .sub{font:italic 12.5px var(--serif);color:var(--ink2);margin-top:3px}
.quill .navbar{border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:24px}
.quill .navbar span{padding:11px 0;font-size:11.5px;letter-spacing:.7px;font-weight:600;
  color:var(--ink2);text-transform:uppercase}
.quill .navbar span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.quill .wrap{padding:20px 28px 40px}
.quill .toolrow{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.quill article{font:16px/1.65 var(--serif);max-width:640px;color:#202124}
.quill article h3{font:600 15px var(--ui);margin:0 0 3px;letter-spacing:-.2px}
.quill .byline{font:italic 12.5px var(--serif);color:var(--ink2);margin-bottom:14px;
  padding-bottom:11px;border-bottom:1px solid var(--line)}

/* -- Tugmore -- */
.tug{background:#f8f9fa;min-height:100%}
.tug .bar{background:#0b3d6b;color:#fff;padding:14px 24px;display:flex;align-items:baseline;gap:12px}
.tug .bar b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.tug .bar .sm{font-size:11.5px;color:#9fc0dd}
.tug .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;gap:26px}
.tug .tabs div{padding:12px 0;font-size:13px;color:var(--ink2);font-weight:500}
.tug .tabs div.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tug .grid{display:grid;grid-template-columns:200px minmax(340px,1fr) 250px;
  gap:14px;padding:20px 24px 40px;align-items:start}
@media (max-width:1080px){.tug .grid{grid-template-columns:1fr}}
.tug .navlist div{padding:9px 15px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.tug .navlist div:last-child{border:0}
.tug .navlist div:hover{background:#f8f9fa}
.tug .navlist div.on{background:#e8f0fe;color:var(--accent);font-weight:600}
.tug .ticket label{display:block;margin:13px 0 5px;font-size:11px;font-weight:600;
  letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.tug .ticket label:first-child{margin-top:0}
.tug .ticket input,.tug .ticket select{width:100%}
.tug .big{font:600 32px var(--mono);letter-spacing:-1.5px}
.tug .quote-row{display:flex;gap:18px;align-items:baseline;padding:15px;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.tug .bidask{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tug .statline{padding:9px 15px;font-size:11.5px;color:var(--ink2);font-family:var(--mono)}

/* -- bank -- */
.ckh{background:#faf8f3;min-height:100%}
.ckh .crest{background:#0f2440;color:#d9bd74;padding:22px 28px;display:flex;align-items:center;gap:15px}
.ckh .crest .seal{width:44px;height:44px;border:2px solid #d9bd74;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);flex:none}
.ckh .crest h1{margin:0;font:400 20px var(--serif);letter-spacing:2.5px}
.ckh .crest .est{font-size:10px;color:#9d894f;letter-spacing:3px;margin-top:3px}
.ckh .wrap{padding:24px 28px;max-width:600px}
.ckh .photo{background:#efe9dc;border:1px solid #e0d8c6;border-radius:var(--r);padding:34px;
  text-align:center;font:italic 12.5px var(--serif);color:#9c9274;margin-top:14px}

/* -- mail -- */
.mail{display:flex;flex-direction:column;height:100%;min-height:100%;background:#fff}
.mail .hdr{padding:15px 22px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex:none}
.mail .hdr b{font-size:16px;font-weight:600;letter-spacing:-.3px}
.mail .split{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0}
@media (max-width:820px){.mail .split{grid-template-columns:1fr}}
.mail .list{border-right:1px solid var(--line);overflow-y:auto}
.mail .list .msg{padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.mail .list .msg:hover{background:#f8f9fa}
.mail .list .msg.on{background:#e8f0fe}
.mail .list .msg .from{display:flex;justify-content:space-between;gap:9px;align-items:center;
  font-size:12.5px;color:var(--ink2)}
.mail .list .msg.unread .from{color:var(--ink);font-weight:600}
.mail .list .msg .subj{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.mail .list .msg.unread .subj{font-weight:600}
.mail .list .msg .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent);flex:none;margin-right:5px}
.mail .read{padding:24px 30px 40px;overflow-y:auto}
.mail .read .mh{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.mail .read .mh h2{margin:0 0 5px;font:600 19px var(--ui);letter-spacing:-.4px}
.mail .read .mh .meta{font-size:12px;color:var(--ink2);font-family:var(--mono)}
.mail .read .bd{font:15px/1.7 var(--serif);max-width:620px;color:#202124}
.mail .read .bd p{margin:0 0 15px}
.mail .read .actions{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* -- checklist -- */
.chk{background:#fef7e0;border:1px solid #f5e0a3;border-radius:var(--r);padding:14px 18px;margin:20px 28px}
.chk h3{margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;color:#8a6d00}
.chk ol{margin:0;padding-left:20px;font-size:12.5px;color:#5f4c00}
.chk li{padding:2px 0}
.chk li.done{color:#b0a37a;text-decoration:line-through}

/* -- modal -- */
.veil{position:fixed;inset:0;background:rgba(32,33,36,.55);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.dlg{background:#fff;border-radius:12px;min-width:340px;max-width:560px;width:100%;
  box-shadow:0 12px 44px rgba(0,0,0,.32);overflow:hidden}
.dlg .tb{font-size:17px;font-weight:600;letter-spacing:-.3px;padding:22px 26px 0}
.dlg .bd{padding:14px 26px 0;font-size:13.5px;line-height:1.6}
.dlg .bd p{margin:0 0 12px}
.dlg .ft{padding:18px 26px 22px;display:flex;gap:9px;justify-content:flex-end}
.dlg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 20px;
  padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dlg dt{color:var(--ink2);font-size:12.5px}
.dlg dd{margin:0;text-align:right;font-family:var(--mono);font-size:13px}
textarea{width:100%;height:74px;font:11px var(--mono);border:1px solid var(--line2);
  border-radius:6px;padding:9px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
canvas{display:block;max-width:100%}
</style>
</head>
<body>

<div id="browser">

  <div class="tabstrip" id="tabstrip"></div>

  <div class="toolbar">
    <button class="iconbtn" id="nav-back" title="Back">&#8592;</button>
    <button class="iconbtn" id="nav-fwd" title="Forward">&#8594;</button>
    <button class="iconbtn" id="nav-reload" title="Reload">&#8635;</button>
    <div class="omni">
      <span class="lock">&#128274;</span>
      <input id="addr" spellcheck="false" autocomplete="off">
    </div>
    <div class="repchip" title="Your standing. Visible at all times.">
      Reputation <b id="repval">10.0</b>
    </div>
    <button class="iconbtn" id="btn-menu" title="Game menu">&#8942;</button>
  </div>

  <div class="bookmarks" id="bookmarks"></div>
  <div class="tape"><div class="run" id="tape"></div></div>
  <div id="viewport"></div>

  <div class="statusbar">
    <div class="cell"><span class="dotlive" id="st-dot"></span><span id="st-phase">—</span></div>
    <div class="cell num" id="st-clock">—</div>
    <div class="cell" id="st-date">—</div>
    <div class="cell grow" id="st-hint"></div>
    <div class="cell" id="st-ver"></div>
  </div>
</div>

<div id="modal-root"></div>

<script>
"use strict";
/* ===========================================================================
   1. CONFIG — every balance number in tier 1 lives here.
   ======================================================================== */
const CONFIG = {
  version: "0.3.0",

  mode: "normal",
  modes: {
    normal: { startCash: 500, startRep: 10 },
    hard:   { startCash: 100, startRep: 0  },
  },

  // Time. A business day is 200 ticks. Ten real minutes at 3s a tick.
  ticksPerDay: 200,
  tickMs: 3000,
  openMinute: 9 * 60 + 30,
  closeMinute: 16 * 60,

  // Calendar. 40 trading days a year, four quarters of ten.
  daysPerQuarter: 10,
  daysPerYear: 40,
  epochYear: 2026,        // the calendar year day 1 falls in

  // Market. Per-tick figures are derived from the daily ones, so the daily
  // numbers stay the ones worth tuning.
  dailyMarketVol: 0.006,
  dailyMarketDrift: 0.0010,
  dailySectorVol: 0.005,
  earlyBullTilt: 0.0025,        // hidden; fades once the tiers open up
  jumpChancePerTick: 0.00035,
  jumpSize: 0.010,
  overnightGapVol: 0.004,

  // Execution. You buy at the ask and sell at the bid. The spread is the
  // quiet cost of changing your mind too often.
  spreadFloor: 0.0006,
  // commission lives on each brokerage now, not here
  maxFloatFraction: 0.02,

  slots: 1,

const VOWELS = new Set("aeiouAEIOU");
const strongConsonants = w => w.split("").filter(c => /[a-z]/i.test(c) && !VOWELS.has(c));

function tickerFor(name, taken){
  const words = name.replace(/&/g, " ").split(/\s+/).filter(Boolean);
  let base;
  if (words.length >= 2){
    const cons = strongConsonants(words[0].slice(1));
    base = (words[0][0] + (cons[0] || words[0][1] || "X") + words[1][0]).toUpperCase();
  } else {
    const w = words[0];
    base = (w[0] + strongConsonants(w.slice(1)).slice(0, 3).join("")).toUpperCase();
    if (base.length < 3) base = w.slice(0, 3).toUpperCase();
  }
  if (!taken.has(base)) return base;
  // collisions resolve by extending a letter, then by substituting one
  const src = name.replace(/[^A-Za-z]/g, "").toUpperCase();
  for (const c of src + "XYZ"){
    const t = base + c;
    if (t.length <= 5 && !taken.has(t)) return t;
  }
  let n = 2;
  while (taken.has(base + n)) n++;
  return base + n;
}

const between = (r, lo, hi) => lo + r() * (hi - lo);

function generateUniverse(seed, anchors){
  const r = mulberry32(seed ^ 0x5bf03635);
  const p = arr => arr[Math.floor(r() * arr.length)];
  const taken = new Set(anchors.map(a => a.ticker));
  const usedNames = new Set(anchors.map(a => a.name));
  const out = anchors.slice();
  const sectorKeys = Object.keys(SECTOR_KIT);
  // Roles cycle within each sector rather than being drawn at random. Random
  // assignment can leave a role with no companies at all, and then every story
  // written against that role quietly moves nothing.
  const roleTurn = {};

  let guard = 0;
  while (out.length < CONFIG.universeSize && guard++ < 6000){
    const sector = sectorKeys[out.length % sectorKeys.length];
    const kit = SECTOR_KIT[sector];

    // three name shapes
    let name;
    const shape = r();
    if (shape < 0.28) name = p(ROOTS);
    else if (shape < 0.82) name = p(ROOTS) + " " + p(kit.desc);
    else {
      const a = p(SURNAMES); let b2 = p(SURNAMES);
      while (b2 === a) b2 = p(SURNAMES);
      name = r() < 0.5 ? `${a} & ${b2}` : `${a} ${b2}`;
    }
    if (usedNames.has(name)) continue;
    usedNames.add(name);

    const ticker = tickerFor(name, taken);
    taken.add(ticker);

    roleTurn[sector] = (roleTurn[sector] || 0);
    const roles = kit.roles[roleTurn[sector]++ % kit.roles.length];
    /* Market cap is drawn from a heavy tail, not a uniform range. Real markets
       are a handful of giants and a very long spine of companies nobody has
       heard of, and coverage only concentrates the way it does in life if the
       sizes concentrate first. AI and technology skew larger on top of that. */
    const u = Math.max(r(), 0.004);
    let cap = 3.0e8 * Math.pow(1 / u, 1.35);
    if (sector === "ai") cap *= 2.6;
    else if (sector === "technology") cap *= 1.5;
    else if (sector === "utilities" || sector === "realestate") cap *= 0.55;
    cap = Math.min(cap, 2.6e12);

    const price = Math.round(between(r, 9, 340) * 100) / 100;
    const float = Math.max(5e6, Math.round(cap / price));
    const line = p(kit.lines).replace(/\{n\}/g, String(Math.floor(between(r, 3, 60))))
      .replace(/\{input\}/g, p(["iron ore","bauxite","limestone","recovered scrap","potash"]))
      .replace(/\{output\}/g, p(["plate and coil","industrial gases","polymers","structural sections","fertiliser"]));

    out.push({
      ticker, name, sector, roles,
      price,
      beta: Math.round(between(r, 0.55, 1.55) * 100) / 100,
      vol: between(r, kit.vol[0], kit.vol[1]),
      drift: between(r, kit.drift[0], kit.drift[1]),
      div: Math.round(between(r, kit.div[0], kit.div[1]) * 10) / 10,
      float,
      employees: Math.round(between(r, 300, 60000) / 100) * 100,
      hq: p(CITIES),
      ceo: p(INITIALS) + ". " + p(LASTNAMES),
      founded: Math.floor(between(r, 1878, 1998)),
      liquidity: Math.min(0.97, 0.55 + Math.log10(float / 1e6) / 5),
      desc: `${name} ${line}. ` + p([
        "Margins are thin and volumes large, so small changes in input costs matter more than they look.",
        "Roughly two thirds of revenue is contracted a year ahead; the balance is exposed to spot pricing.",
        "The business is cyclical and carries more debt than its peers, which cuts both ways.",
        "Management has prioritised the dividend over growth for most of the last decade.",
        "Costs are dominated by labour and energy, and the company has limited ability to pass either through quickly.",
        "A single customer accounts for a meaningful share of revenue, a fact disclosed in the filings and rarely discussed.",
      ]),
    });
  }
  return out;
}


/* ===========================================================================
   3. ENGINE
   ======================================================================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1);
function gauss(){
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const money = n => (n < 0 ? "-$" : "$") + Math.abs(n)
  .toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
const pct = n => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const cls = n => n > 0.0001 ? "up" : n < -0.0001 ? "down" : "flat";

let S = null;

function newGame(seed){
  seed = seed || (Date.now() % 2147483647);
  rand = mulberry32(seed);
  const m = CONFIG.modes[CONFIG.mode];

  const assets = {};
  const listed = generateUniverse(seed, ANCHORS);
  for (const a of listed){
    const back = backfill(a);
    assets[a.ticker] = {
      ...a, price:a.price, open:a.price, prevClose:a.price,
      dayHigh:a.price, dayLow:a.price, volume:0,
      intraday:[a.price], intradayVol:[0],
      sessions:[],                    // recent completed days, tick by tick
      history:back.closes,            // every daily close, backfill onward
      histVol:back.vols,
      backfillLen:back.closes.length, // where the invented past ends
    };
  }

  S = {
    seed, tier:CONFIG.startTier, broker:"tugmore", positions:[],
    day:1, tick:0, phase:"closed", paused:false,
    cash:m.startCash, rep:m.startRep,
    assets,
    roleIndex: buildRoleIndex(assets),
    indices: buildIndices(assets),
    sectorState:Object.fromEntries(Object.keys(SECTORS).map(k => [k, 0])),
    mail:[], news:[], effects:[], schedule:null, openNews:null, newsFilter:"all",
    tutorial:{}, realTimePlayed:0, tradesMade:0,
    lastError:null, lastOk:null,
    tabs:[{ url:"nscrape.com/mail" }], activeTab:0,
    sortKey:"cap", sortDir:-1, watchSel:"IVS", quote:"IVS",
    search:"", lastAmt:"200", openMail:null, range:"1D", openIndex:"STR",
  };

  // Bank letter first so the Tugmore welcome lands on top of the inbox: it is
  // the one the opening dialog points at, and the first thing to read.
  backfillIndices();
  mailSeq = 0;
  deliver(MAILBOX.bankWelcome(), true);
  deliver(MAILBOX.welcome(), true);
  return S;
}

/* Several years of daily closes with a sector-appropriate trend. The chart is
   a lure by design: it shows the past, and the forward drift comes from the
   engine, not from this line. */
function backfill(a){
  const n = 3 * CONFIG.daysPerYear, closes = [], vols = [];
  // The chart is a lure. AI names show years of climbing because that is what
  // a bubble looks like from inside it, not because the engine owes them
  // anything going forward.
  const trend = a.drift * (a.sector === "ai" ? 4.2 : 2.2);
  let p = a.price / Math.pow(1 + trend, n);
  for (let i = 0; i < n; i++){
    const r = trend + a.vol * 0.8 * gauss();
    p *= Math.exp(r);
    closes.push(p);
    vols.push(Math.round(a.float * 0.004 * (0.5 + rand()) * (1 + Math.abs(r) * 40)));
  }
  const adj = a.price / closes[closes.length - 1];
  return { closes: closes.map(x => x * adj), vols };
}

/* role -> [tickers]. Rebuilt whenever the universe is built, and the only
   thing news effects ever resolve against. */
function buildRoleIndex(assets){
  const idx = {};
  for (const t in assets)
    for (const r of assets[t].roles || [])
      (idx[r] = idx[r] || []).push(t);
  return idx;
}

/* Tier 1 shows four names. It is not a filter over a visible list — the rest
   of the market simply is not there yet, with no greyed-out rows to tease it. */
function listedAssets(){
  if (S.tier >= 2) return Object.values(S.assets);
  return CONFIG.starterTickers.map(t => S.assets[t]).filter(Boolean);
}
const isListed = t => S.tier >= 2 || CONFIG.starterTickers.includes(t);

/* ---------------------------------------------------------------------------
   A CENTURY OF INVENTED HISTORY

   Purely cosmetic, and worth it. Each index runs back as far as the thing it
   is a parody of: the industrial average to 1896, the broad index to 1957, the
   composite to 1971. Long enough that pulling the chart out to MAX shows a
   shape a person actually recognises — the twenties boom, the crater after it,
   the post-war run, the seventies going nowhere in a hurry, the long bull, the
   bubble and the hole it left.

   Years that mattered are scripted. Every other year is drawn from a lognormal
   with a positive drift, because the honest long-run shape of an equity index
   is up and to the right with the floor falling out every couple of decades.

   None of this feeds the price engine. It is a lure, exactly like the
   companies' three-year charts: the past is dramatic, and the forward drift
   owes it nothing.
   ------------------------------------------------------------------------ */
const HISTORY_SCRIPT = {
  1907:-0.38, 1908:+0.46,                                  // the panic
  1915:+0.82, 1916:-0.04, 1917:-0.22, 1919:+0.30,
  1920:-0.33, 1921:+0.13,
  1924:+0.26, 1925:+0.30, 1926:+0.03, 1927:+0.29, 1928:+0.48,
  1929:-0.17, 1930:-0.34, 1931:-0.53, 1932:-0.23, 1933:+0.67, // the crater
  1937:-0.33, 1938:+0.28,
  1941:-0.15, 1942:+0.08, 1945:+0.27,
  1954:+0.44, 1958:+0.34,
  1962:-0.11, 1966:-0.19, 1968:+0.08,
  1969:-0.15, 1970:+0.05, 1973:-0.17, 1974:-0.28, 1975:+0.38, // the seventies
  1977:-0.12, 1981:-0.09,
  1982:+0.20, 1983:+0.23, 1985:+0.28, 1986:+0.23,
  1987:-0.02,                                                // crashed, ended flat
  1989:+0.28, 1990:-0.08, 1991:+0.27, 1995:+0.34, 1996:+0.20,
  1997:+0.31, 1998:+0.27, 1999:+0.20,
  2000:-0.10, 2001:-0.13, 2002:-0.23,                        // the unwind
  2003:+0.26, 2004:+0.09, 2005:+0.03, 2006:+0.14, 2007:+0.04,
  2008:-0.38, 2009:+0.23,                                    // the financial crisis
  2010:+0.13, 2011:0.00, 2012:+0.13, 2013:+0.30, 2014:+0.11,
  2015:-0.01, 2016:+0.10, 2017:+0.19, 2018:-0.06, 2019:+0.29,
  2020:+0.16,                                                // fell through the floor, closed up
  2021:+0.27, 2022:-0.19, 2023:+0.24,
};

/* The composite is the same market with the volume turned up: it runs harder
   in the boom and falls through the floor afterwards. */
const TECH_SCRIPT = {
  1973:-0.31, 1974:-0.35, 1975:+0.30,
  1990:-0.18, 1991:+0.57, 1995:+0.40, 1996:+0.23, 1997:+0.22,
  1998:+0.40, 1999:+0.86,
  2000:-0.39, 2001:-0.21, 2002:-0.32,
  2003:+0.50, 2008:-0.41, 2009:+0.44, 2013:+0.38, 2017:+0.28,
  2019:+0.35, 2020:+0.44, 2021:+0.21, 2022:-0.33, 2023:+0.43,
};

/* A crash inside a year that closed near flat still has to be visible, or 1987
   is just a boring sideways stretch. */
const INTRAYEAR_CRASH = { 1929:0.48, 1987:0.34, 1907:0.30, 2001:0.26,
                          2008:0.42, 2020:0.38, 2022:0.24 };

function deepHistory(def, endValue, rng){
  // ends where the constituent-derived three-year backfill takes over
  const startYear = def.since, endYear = CONFIG.epochYear - 3;
  const dpy = CONFIG.daysPerYear;
  const g = () => {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  const out = [];
  let p = def.sinceValue;
  for (let y = startYear; y < endYear; y++){
    let annual = (def.flavor === "tech" && TECH_SCRIPT[y] !== undefined)
      ? TECH_SCRIPT[y] : HISTORY_SCRIPT[y];
    if (annual === undefined){
      const vol = def.flavor === "tech" ? 0.26 : def.flavor === "old" ? 0.19 : 0.17;
      annual = Math.exp(0.072 + vol * g()) - 1;
    }
    const perDay = Math.pow(1 + annual, 1 / dpy) - 1;
    const noise = (def.flavor === "tech" ? 0.022 : 0.016);
    const dip = INTRAYEAR_CRASH[y];
    for (let d = 0; d < dpy; d++){
      p *= (1 + perDay) * Math.exp(noise * g());
      // a scripted intra-year crater, cut in fast and clawed back slowly
      if (dip){
        const t = d / dpy;
        const shape = t < 0.55 ? 0 : t < 0.65 ? (t - 0.55) / 0.10 : 1 - (t - 0.65) * 0.9;
        p *= 1 - dip * 0.055 * Math.max(0, shape);
      }
      out.push(Math.max(0.5, p));
    }
  }

  // Pin both ends without flattening the shape: spread the correction
  // geometrically across the series.
  const raw = out[out.length - 1];
  const k = Math.pow(endValue / raw, 1 / out.length);
  return out.map((v, i) => v * Math.pow(k, i + 1));
}

/* Membership is fixed when the world is built, so the index is a consistent
   basket rather than whatever happens to qualify this morning. */
function buildIndices(assets){
  const out = {};
  for (const k in INDICES){
    const def = INDICES[k];
    let members = Object.values(assets).filter(def.member);
    if (def.limit)
      members = members.sort((a, b) => marketCap(b) - marketCap(a)).slice(0, def.limit);
    const tickers = members.map(a => a.ticker);
    const divisor = def.weight === "price"
      ? members.reduce((t, a) => t + a.price, 0) / def.base
      : members.reduce((t, a) => t + marketCap(a), 0) / def.base;
    out[k] = { ...def, members:tickers, divisor,
               value:def.base, prevClose:def.base, open:def.base,
               intraday:[def.base], history:[], histVol:[] };
  }
  return out;
}

function indexValue(ix){
  let agg = 0;
  for (const t of ix.members){
    const a = S.assets[t];
    if (!a) continue;
    agg += ix.weight === "price" ? a.price : marketCap(a);
  }
  return agg / ix.divisor;
}

function updateIndices(){
  for (const k in S.indices){
    const ix = S.indices[k];
    ix.value = indexValue(ix);
    ix.intraday.push(ix.value);
  }
}

/* Backfill index history from the constituents' invented past, so the charts
   go back as far as the companies do. */
function backfillIndices(){
  const n = 3 * CONFIG.daysPerYear;
  for (const k in S.indices){
    const ix = S.indices[k];
    const hist = [];
    for (let d = 0; d < n; d++){
      let agg = 0;
      for (const t of ix.members){
        const a = S.assets[t];
        const px = a.history[d];
        if (px === undefined) continue;
        agg += ix.weight === "price" ? px : px * a.float;
      }
      hist.push(agg / ix.divisor);
    }
    const deep = deepHistory(ix, hist[0], mulberry32((S.seed ^ 0x9e3779b9) + k.charCodeAt(0)));
    ix.history = deep.concat(hist);
    ix.histVol = ix.history.map(() => 0);
    ix.backfillLen = ix.history.length;
    ix.inception = ix.since;
  }
}

const spread = a =>
  Math.max(CONFIG.spreadFloor, (1 - a.liquidity) * 0.010 + a.vol * 0.05) * broker().spreadMult;
const fee = () => broker().commission;
const askOf  = a => a.price * (1 + spread(a) / 2);
const bidOf  = a => a.price * (1 - spread(a) / 2);

function stepTick(){
  const tpd = CONFIG.ticksPerDay;
  runSchedule();
  const fx = effectDrift();

  const marketFactor = (CONFIG.dailyMarketDrift + CONFIG.earlyBullTilt) / tpd
                     + (CONFIG.dailyMarketVol / Math.sqrt(tpd)) * gauss()
                     + fx.market;

  const sVol = CONFIG.dailySectorVol / Math.sqrt(tpd);
  for (const k in S.sectorState) S.sectorState[k] = sVol * gauss() + (fx.sector[k] || 0);

  for (const t in S.assets){
    const a = S.assets[t];
    let jump = 0;
    if (rand() < CONFIG.jumpChancePerTick)
      jump = (rand() < 0.5 ? -1 : 1) * CONFIG.jumpSize * (0.5 + rand());

    const r = a.beta * marketFactor
            + SECTORS[a.sector].beta * S.sectorState[a.sector]
            + a.drift / tpd
            + (fx.ticker[t] || 0)
            + (a.vol / Math.sqrt(tpd)) * gauss()
            + jump;

    a.price = Math.max(0.01, a.price * Math.exp(r));
    a.dayHigh = Math.max(a.dayHigh, a.price);
    a.dayLow  = Math.min(a.dayLow, a.price);

    const tickVol = Math.round(a.float * 0.00002 * (0.5 + rand()) * (1 + Math.abs(r) * 260));
    a.volume += tickVol;
    a.intraday.push(a.price);
    a.intradayVol.push(tickVol);
  }
  updateIndices();
  S.tick++;
  if (S.tick >= CONFIG.ticksPerDay) closeDay();
}

function openDay(){
  for (const t in S.assets){
    const a = S.assets[t];
    a.prevClose = a.price;
    a.price = Math.max(0.01, a.price * Math.exp(CONFIG.overnightGapVol * gauss()));
    a.open = a.price;
    a.dayHigh = a.price; a.dayLow = a.price; a.volume = 0;
    a.intraday = [a.price]; a.intradayVol = [0];
  }
  for (const k in S.indices) S.indices[k].prevClose = S.indices[k].value;
  updateIndices();                       // prices gapped overnight; revalue first
  for (const k in S.indices){
    const ix = S.indices[k];
    ix.open = ix.value;
    ix.intraday = [ix.value];
  }
  S.tick = 0;
  S.phase = "open";
  scheduleDay();
  flash("Market open.");
  render();
}

function closeDay(){
  S.phase = "closed";
  for (const t in S.assets){
    const a = S.assets[t];
    // Archive the session tick by tick so week and hour views have real data
    // rather than a straight line between closes. Capped, because a thousand
    // companies' worth of tick history is not something to keep forever.
    a.sessions.push({ day:S.day, prices:a.intraday.slice(), vols:a.intradayVol.slice() });
    if (a.sessions.length > CONFIG.sessionsKept) a.sessions.shift();
    a.history.push(a.price);
    a.histVol.push(a.volume);
  }
  for (const k in S.indices){
    S.indices[k].history.push(S.indices[k].value);
    S.indices[k].histVol.push(0);
  }
  if (S.positions.length) step("hold_overnight");     // carrying it through is a step
  deliver(MAILBOX.newsletter());
  S.day++;
  flash("Market closed. Planning.");
  render();
}

/* -- orders. Refusals are plain text in the ticket, and each one re-renders,
      or the player is told nothing at all. ------------------------------- */
function fail(msg){ S.lastError = msg; render(); return false; }

function buy(ticker, dollars){
  S.lastError = S.lastOk = null;
  const a = S.assets[ticker];
  if (!a) return fail("No such ticker.");
  if (S.phase !== "open") return fail("The market is closed. Orders cannot be placed outside trading hours.");
  if (!isListed(ticker)) return fail("That security is not available on your account.");
  if (S.positions.some(x => x.ticker === ticker))
    return fail(`You already hold ${a.ticker}. Adding to a position is not supported on this account.`);
  if (S.positions.length >= slotCount())
    return fail(slotCount() === 1
      ? "You already hold a position. Your account supports one at a time."
      : `All ${slotCount()} position slots are in use. Close one first.`);
  if (!(dollars > 0)) return fail("Enter an amount to invest.");

  if (dollars + fee() > S.cash)
    return fail(`Insufficient cash. ${money(dollars)} plus ${money(fee())} commission `
              + `exceeds your balance of ${money(S.cash)}.`);

  const ask = askOf(a), shares = dollars / ask;
  const maxShares = a.float * CONFIG.maxFloatFraction;
  if (shares > maxShares)
    return fail(`Order too large. The maximum on ${a.ticker} is `
              + `${maxShares.toLocaleString("en-US",{maximumFractionDigits:0})} shares.`);

  S.cash -= dollars + fee();
  S.positions.push({ ticker, shares, costBasis:ask, openedDay:S.day,
                     openedTick:S.tick, commissionPaid:fee(), broker:S.broker });
  S.tradesMade++;
  S.lastOk = `Bought ${shares.toFixed(4)} ${a.ticker} at ${money(ask)}. `
           + `Commission ${money(fee())}.`;
  step("place_buy");
  render();
  return true;
}

function sell(ticker){
  S.lastError = S.lastOk = null;
  if (S.phase !== "open") return fail("The market is closed. Orders cannot be placed outside trading hours.");
  if (!S.positions.length) return fail("You have no position to sell.");

  const idx = ticker ? S.positions.findIndex(x => x.ticker === ticker) : 0;
  if (idx < 0) return fail(`You do not hold ${ticker}.`);
  const p = S.positions[idx], a = S.assets[p.ticker], bid = bidOf(a);
  const proceeds = p.shares * bid - fee();
  const pnl = proceeds - (p.shares * p.costBasis + p.commissionPaid);

  S.cash += proceeds;
  S.positions.splice(idx, 1);
  S.tradesMade++;

  // Reputation barely moves on an unleveraged trade: 4 x (pnl / net worth),
  // capped, then damped by distance from zero.
  let d = Math.max(-0.6, Math.min(0.6, 4 * (pnl / Math.max(netWorth(), 1))));
  if ((d > 0 && S.rep >= 0) || (d < 0 && S.rep <= 0)) d *= (100 - Math.abs(S.rep)) / 100;
  S.rep = Math.max(-100, Math.min(100, S.rep + d));

  S.lastOk = `Sold ${p.shares.toFixed(4)} ${a.ticker} at ${money(bid)}. `
           + `Realised ${pnl >= 0 ? "gain" : "loss"} of ${money(Math.abs(pnl))}.`;
  step("close_position");
  render();
  return true;
}

const netWorth = () =>
  S.cash + S.positions.reduce((t, p) => t + p.shares * bidOf(S.assets[p.ticker]), 0);

/* Slots come from the tier, and are the quiet backbone of difficulty: one slot
   forces conviction, three let you diversify away the bad luck. */
function slotCount(){ return S.tier >= 2 ? 3 : 1; }

function pnlOf(p){
  const a = S.assets[p.ticker], bid = bidOf(a);
  const value = p.shares * bid;
  return { bid, value, pnl: value - (p.shares * p.costBasis + p.commissionPaid) - fee() };
}
const holding = t => S.positions.find(p => p.ticker === t) || null;

/* -- calendar ------------------------------------------------------------ */
/* Day numbers go negative: the backfilled history sits before the career
   starts, and the chart has to label those years properly rather than
   clamping three invented years onto day one. Floor division and a
   positive modulo handle both directions. */
function gameDate(day){
  const idx = day - 1;
  const y = Math.floor(idx / CONFIG.daysPerYear);
  const inYear = ((idx % CONFIG.daysPerYear) + CONFIG.daysPerYear) % CONFIG.daysPerYear;
  const q = Math.floor(inYear / CONFIG.daysPerQuarter) + 1;
  const inQ = inYear % CONFIG.daysPerQuarter;
  const month = q * 3 - 3 + Math.floor(inQ / 4);
  const dom = 3 + (inQ % 4) * 7;
  const yr = CONFIG.epochYear + y;
  return { y:yr, q, month, dom, inQ, label:`${MONTHS[month].slice(0,3)} ${dom}, ${yr}` };
}
function clockLabel(){
  if (S.phase !== "open") return "--:--";
  const span = CONFIG.closeMinute - CONFIG.openMinute;
  const m = CONFIG.openMinute + Math.floor(span * (S.tick / CONFIG.ticksPerDay));
  return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

function step(id){
  if (S.tutorial[id]) return;
  S.tutorial[id] = true;
  flash("Noted.");
  if (id === "place_buy") deliver(MAILBOX.firstFill());
  checkTier();
  render();
}

function checkTier(){
  if (S.tier !== 1 || stepsDone() < STEPS.length) return;
  S.tier = 2;
  deliver(MAILBOX.tier2());
  setTimeout(showTier2, 60);
}

let mailSeq = 0;
function deliver(m, quiet){
  m.id = ++mailSeq; m.read = false; m.day = S ? S.day : 1;
  S.mail.unshift(m);
  if (!quiet) softRender();
}

/* Mail and stories arrive mid-session, and a full rebuild at that moment would
   close a dropdown or eat a half-typed order. Repaint the chrome always, the
   page only when the player is looking at something the arrival changes and is
   not in the middle of typing. */
function softRender(){
  if (!document.getElementById("viewport")) return;
  paintChrome();
  const base = currentTab().url.split("?")[0];
  const affected = base === "nscrape.com/mail" || base === "quillstreet.com/news";
  if (affected && !isTyping()){
    vp().innerHTML = siteFor(currentTab().url).render();
    paintCharts();
  }
  paintStatus();
}

/* ===========================================================================
   4b. NEWS AND EFFECTS

   The actual game. A story fires, and at the moment it fires its true effect
   already exists as a number: which assets, which direction, how hard, how
   soon, for how long. The prose is rendered from the same object, deliberately
   vaguely. The answer exists before you guess.

   Almost nothing names the company it moves. A rail strike hurts the steel
   mill that cannot ship and the food distributor that cannot deliver, and the
   article mentions neither. Working that out from the profile pages is the
   skill the whole game is built on.

   Being right pays out more often than being wrong, and never reliably:
   magnitude, delay and duration are all rolled at fire time, and one story in
   seven goes the other way regardless of how well you read it.
   ======================================================================== */

/* Slot pools. Every story is a template; filling the slots differently is what
   makes a small bank feel larger than it is. */
const SLOTS = {

             "the central plains","the mid-Atlantic"],

}

/* Each effect: t = ticker or sector:<name> or market. mag is the TOTAL move

/* Brokerages. Commission is a property of the firm, not of the game: Tugmore
   charges two dollars a trade because Tugmore charges two dollars a trade.
   Squirtr charges nothing and takes it back in the spread, which is the whole
   joke and also the honest slippage model. */
const BROKERAGES = {
  tugmore: { id:"tugmore", name:"Tugmore Direct", tier:1, commission:2.00, spreadMult:1.0,
             note:"Two dollars a trade, each way. Good at nothing, bad at nothing." },
  squirtr: { id:"squirtr", name:"Squirtr", tier:2, commission:0, spreadMult:2.6,
             note:"No commission. The spread is wider and nobody mentions it." },
  titwell: { id:"titwell", name:"Titwell Investments", tier:2, commission:1.00, spreadMult:0.85,
             note:"A dollar a trade, and the tightest quotes on the list." },
};
const broker = () => BROKERAGES[S.broker] || BROKERAGES.tugmore;
const availableBrokers = () => Object.values(BROKERAGES).filter(b => b.tier <= S.tier);

/* ---------------------------------------------------------------------------
   COVERAGE

   The press does not distribute itself evenly. A trillion-dollar accelerator
   designer is written about every day; a regional gas utility is written about
   when its rate case is decided. Coverage is driven by size first, then by
   how much the thing is being traded today, then by sector heat.

   The practical effect: most of the hundred companies are quiet most of the
   time, a dozen names carry the narrative, and a story about one of those
   dozen is worth reading because it is going to keep happening.
   ------------------------------------------------------------------------ */
const marketCap = a => a.price * a.float;

function coverageWeight(a){
  const capB = marketCap(a) / 1e9;
  let w = Math.pow(Math.max(capB, 0.05), 0.95);          // size dominates
  const turnover = a.volume / Math.max(a.float * 0.004, 1);
  w *= 1 + Math.min(2.5, turnover);                       // today's tape
  w *= SECTOR_COVERAGE[a.sector] || 1;                    // AI runs hot
  return w;
}

function weightedCompany(){
  const list = listedAssets();
  const weights = list.map(coverageWeight);
  let roll = rand() * weights.reduce((x, y) => x + y, 0);
  for (let i = 0; i < list.length; i++){
    roll -= weights[i];
    if (roll <= 0) return list[i];
  }
  return list[list.length - 1];
}

/* The most covered names, for the market summary and the coverage panel. */
function majors(n){
  return listedAssets().slice()
    .sort((a, b) => coverageWeight(b) - coverageWeight(a))
    .slice(0, n);
}

const absTick = () => (S.day - 1) * CONFIG.ticksPerDay + S.tick;

/* Roll a story's hidden truth. Everything here is decided now; the prose the
   player reads is rendered from the same object. */
function spawnEffects(story, subject){
  const inverted = rand() < CONFIG.newsInversionChance;
  for (const e of story.effects){
    let target = e.t;
    if (subject){
      if (target === "self") target = subject.ticker;
      else if (target === "sector") target = "sector:" + subject.sector;
    }
    const mag = e.mag * (0.45 + 1.15 * rand()) * (inverted ? -0.35 : 1);
    S.effects.push({
      t: target,
      dir: e.dir,
      mag,
      born: absTick(),
      delay: Math.floor(CONFIG.newsDelayMin + rand() * (CONFIG.newsDelayMax - CONFIG.newsDelayMin)),
      life: Math.floor(CONFIG.newsLifeMin + rand() * (CONFIG.newsLifeMax - CONFIG.newsLifeMin)),
    });
  }
}

/* Per-tick drift contributed by live effects, keyed by what they target.
   Front-loaded and decaying to nothing, integrating to the rolled magnitude. */
function effectDrift(){
  const out = { market:0, sector:{}, ticker:{} };
  const now = absTick();
  S.effects = S.effects.filter(e => now - e.born <= e.delay + e.life);
  for (const e of S.effects){
    const age = now - e.born;
    if (age < e.delay) continue;
    const u = (age - e.delay) / e.life;
    const perTick = e.dir * e.mag * (2 / e.life) * (1 - u);
    if (e.t === "market") out.market += perTick;
    else if (e.t.startsWith("sector:")){
      const k = e.t.slice(7);
      out.sector[k] = (out.sector[k] || 0) + perTick;
    } else if (e.t.startsWith("role:")){
      for (const tk of S.roleIndex[e.t.slice(5)] || [])
        out.ticker[tk] = (out.ticker[tk] || 0) + perTick;
    } else out.ticker[e.t] = (out.ticker[e.t] || 0) + perTick;
  }
  return out;
}

let storySeq = 0;
function fireStory(tpl, isFiller, subject){
  const outlet = OUTLETS[tpl.outlet];
  const co = subject ? {
    co: subject.name, tk: subject.ticker, sec: SECTORS[subject.sector].name,
    an: pick(SLOTS.analyst), idx: pick(Object.values(INDICES).map(i => i.name)),
    ord: pick(["eleventh","nineteenth","twenty-second","thirty-first","fourteenth"]),
    cutpct: String(20 + Math.floor(rand() * 45)),
    bb: (Math.max(0.4, marketCap(subject) / 1e9 * (0.05 + rand() * 0.2))).toFixed(1),
  } : null;
  const sub = str => co ? str.replace(/\{(\w+)\}/g, (m, k) => co[k] !== undefined ? co[k] : m) : str;
  const item = {
    n: ++storySeq,
    id: tpl.id || ("filler" + storySeq),
    outlet: tpl.outlet,
    outletName: outlet.name,
    author: pick(outlet.authors),
    tag: tpl.tag || null,
    head: sub(fill(tpl.head)),
    body: (tpl.body || []).map(x => sub(fill(x))),
    day: S.day,
    tick: S.tick,
    filler: !!isFiller,
    about: subject ? subject.ticker : null,
    read: false,
  };
  S.news.unshift(item);
  if (S.news.length > 120) S.news.pop();
  if (!isFiller) spawnEffects(tpl, subject);

  // Significant stories also land in the inbox; filler mostly does not, or the
  // inbox becomes unusable before the player has any way to filter it.
  if (!isFiller){
    deliver({
      from: outlet.name, addr: outlet.addr,
      subject: (item.tag ? item.tag + ": " : "") + item.head,
      body: item.body.concat([`— ${item.author}, ${outlet.name}`]),
      newsRef: item.n,
    });
  }
  flash(item.filler ? "New item in the feed." : "Story breaking.");
}

/* Three significant events a day plus filler, at unannounced ticks. */
function scheduleDay(){
  const slots = [];
  const spread_ = (n, kind) => {
    for (let i = 0; i < n; i++){
      const lo = Math.floor(CONFIG.ticksPerDay * (0.04 + 0.92 * i / n));
      const hi = Math.floor(CONFIG.ticksPerDay * (0.04 + 0.92 * (i + 1) / n));
      slots.push({ tick: lo + Math.floor(rand() * Math.max(1, hi - lo)), kind });
    }
  };
  spread_(CONFIG.storiesPerDay, "macro");
  spread_(S.tier >= 2 ? CONFIG.companyStoriesPerDay : 1, "company");
  for (let i = 0; i < CONFIG.fillerPerDay; i++)
    slots.push({ tick: Math.floor(rand() * CONFIG.ticksPerDay), kind:"filler" });
  S.schedule = slots.sort((a, b) => a.tick - b.tick);
}

/* Prefer stories the player has not seen recently, so a short bank does not
   feel short. */
function nextStory(){
  const recent = new Set(S.news.filter(x => !x.filler).slice(0, 8).map(x => x.id));
  const fresh = STORIES.filter(s => !recent.has(s.id));
  return pick(fresh.length ? fresh : STORIES);
}

/* Filler is noise, but the same piece of noise twice in a morning reads as a
   bug rather than as a slow news day. */
function nextFiller(){
  const usedToday = new Set(S.news.filter(x => x.filler && x.day === S.day).map(x => x.head));
  const fresh = FILLER.filter(f => !usedToday.has(f.head));
  return pick(fresh.length ? fresh : FILLER);
}

function excerpt(str, n){
  if (str.length <= n) return str.replace(/[.,;:\s]+$/, "");
  return str.slice(0, str.lastIndexOf(" ", n)).replace(/[.,;:\s]+$/, "");
}

/* Pick who the press writes about, then pick a story that fits them. */
function nextCompanyStory(){
  const subject = weightedCompany();
  const isAI = subject.sector === "ai";
  const pool = COMPANY_STORIES.filter(t => !t.only || (isAI && t.only === "ai"));
  const recent = new Set(S.news.filter(x => x.about === subject.ticker).slice(0, 4).map(x => x.id));
  const fresh = pool.filter(t => !recent.has(t.id));
  return { tpl: pick(fresh.length ? fresh : pool), subject };
}

function runSchedule(){
  if (!S.schedule) return;
  while (S.schedule.length && S.schedule[0].tick <= S.tick){
    const slot = S.schedule.shift();
    if (slot.kind === "filler") fireStory(nextFiller(), true);
    else if (slot.kind === "company"){
      const { tpl, subject } = nextCompanyStory();
      fireStory(tpl, false, subject);
    } else fireStory(nextStory(), false);
  }
}

/* ===========================================================================
   6. LIVE UPDATE

   The whole reason the page is usable while the market ticks. Rewrites only
   the numbers, so open dropdowns, focus and half-typed input all survive.
   ======================================================================== */
function liveUpdate(){
  const nodes = document.querySelectorAll("#viewport [data-lv]");
  for (const el of nodes){
    const kind = el.dataset.lv;
    const a = el.dataset.t ? S.assets[el.dataset.t] : null;
    if (el.dataset.t && !a && kind !== "idxval" && kind !== "idxchg") continue;
    const ch = a ? (a.price - a.prevClose) / a.prevClose * 100 : 0;

    switch (kind){
      case "price":
        el.textContent = money(a.price);
        if (el.classList.contains("big")) setTone(el, ch, "big");
        break;
      case "change":
        el.textContent = pct(ch); setTone(el, ch, "num"); break;
      case "bidask":
        el.textContent = `${money(bidOf(a))} / ${money(askOf(a))}`; break;
      case "bidaskLong":
        el.textContent = `Bid ${money(bidOf(a))}   Ask ${money(askOf(a))}`; break;
      case "vol":
        el.textContent = a.volume.toLocaleString("en-US"); break;
      case "range":
        el.textContent = `${money(a.dayLow)} – ${money(a.dayHigh)}`; break;
      case "stats":
        el.textContent = `Open ${money(a.open)} · High ${money(a.dayHigh)} `
                       + `· Low ${money(a.dayLow)} · Prev close ${money(a.prevClose)} `
                       + `· Vol ${a.volume.toLocaleString("en-US")}`;
        break;
      case "cash":     el.textContent = money(S.cash); break;
      case "clock":    el.textContent = clockLabel(); break;
      case "tickcount":el.textContent = `${S.tick} of ${CONFIG.ticksPerDay}`; break;
      case "phase":    el.textContent = S.phase === "open" ? "Open" : "Closed — planning"; break;
      case "phasetext":el.textContent = S.phase === "open" ? "Market open."
                         : "Market closed — orders resume at the next open."; break;
      case "cap": el.textContent = capLabel(a); break;
      case "idxval": { const ix = S.indices[el.dataset.t];
        if (ix) el.textContent = ix.value.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); break; }
      case "idxchg": { const ix = S.indices[el.dataset.t];
        if (ix){ const c = idxPct(ix); el.textContent = pct(c); setTone(el, c, "num"); } break; }
      case "rangenote": el.textContent = rangeNote(); break;
      case "poslast": { const h = holding(el.dataset.t); if (h) el.textContent = money(pnlOf(h).bid); break; }
      case "posvalue":{ const h = holding(el.dataset.t); if (h) el.textContent = money(pnlOf(h).value); break; }
      case "pospnl":  { const h = holding(el.dataset.t);
                        if (h){ const q = pnlOf(h); el.textContent = money(q.pnl); setTone(el, q.pnl, "num"); } break; }
    }
  }
  paintStatus();
}

/* ===========================================================================
   7. CHARTS

   Drawn at device resolution so the line is actually sharp, and fed from real
   retained data rather than only the current session. Five ranges, each with
   its own source:

     1H   the last in-game hour of ticks, crossing into yesterday if need be
     1D   this session, tick by tick
     1W   five trading days of ticks, stitched
     1Y   forty daily closes
     MAX  every close there is, invented past included
   ======================================================================== */
const TICKS_PER_HOUR =
  Math.round(CONFIG.ticksPerDay / ((CONFIG.closeMinute - CONFIG.openMinute) / 60));

const RANGES = [
  { id:"1H",  label:"1H"  },
  { id:"1D",  label:"1D"  },
  { id:"1W",  label:"1W"  },
  { id:"1Y",  label:"1Y"  },
  { id:"5Y",  label:"5Y"  },
  { id:"MAX", label:"Max" },
];

/* Recent sessions plus the live one, flattened, newest last. */
function flatTicks(a, days){
  const take = a.sessions.slice(-Math.max(0, days - 1));
  const prices = [], vols = [], marks = [];
  for (const s of take){
    marks.push({ i:prices.length, day:s.day });
    prices.push(...s.prices); vols.push(...s.vols);
  }
  if (a.intraday.length){
    marks.push({ i:prices.length, day:S.day });
    prices.push(...a.intraday); vols.push(...a.intradayVol);
  }
  return { prices, vols, marks };
}

function seriesFor(a, range){
  if (!a.sessions){                       // an index: closes and this session only
    if (range === "1Y" || range === "5Y" || range === "MAX"){
      const n = range === "1Y" ? CONFIG.daysPerYear
              : range === "5Y" ? CONFIG.daysPerYear * 5 : a.history.length;
      const prices = a.history.slice(-n);
      return { prices, vols:null, kind:"day", firstDay:S.day - prices.length, ref:undefined };
    }
    const src = a.intraday.length > 1 ? a.intraday : a.history.slice(-2);
    const n = range === "1H" ? Math.min(TICKS_PER_HOUR, src.length) : src.length;
    return { prices:src.slice(-n), vols:null, kind:"tick", span:"day",
             startTick:Math.max(0, S.tick - n + 1), ref:a.prevClose };
  }
  if (range === "1Y" || range === "5Y" || range === "MAX"){
    const n = range === "1Y" ? CONFIG.daysPerYear
            : range === "5Y" ? CONFIG.daysPerYear * 5 : a.history.length;
    const prices = a.history.slice(-n), vols = a.histVol.slice(-n);
    return { prices, vols, kind:"day", firstDay: S.day - prices.length, ref:undefined };
  }
  if (range === "1W"){
    const f = flatTicks(a, 5);
    return { ...f, kind:"tick", span:"week", ref:undefined };
  }
  if (range === "1H"){
    const f = flatTicks(a, 2);
    const n = Math.min(TICKS_PER_HOUR, f.prices.length);
    return { prices:f.prices.slice(-n), vols:f.vols.slice(-n), kind:"tick", span:"hour",
             startTick: Math.max(0, S.tick - n + 1), ref:undefined };
  }
  // 1D
  const src = a.intraday.length > 1 ? a
            : (a.sessions.length ? a.sessions[a.sessions.length - 1] : a);
  const prices = src.prices || a.intraday, vols = src.vols || a.intradayVol;
  return { prices, vols, kind:"tick", span:"day", startTick:0, ref:a.prevClose };
}

/* Even-stride downsample that always keeps the first and last point, so the
   latest price is never a stale sample. */
function downsample(arr, max){
  if (arr.length <= max) return { data:arr, stride:1 };
  const stride = Math.ceil(arr.length / max), out = [];
  for (let i = 0; i < arr.length; i += stride) out.push(arr[i]);
  if (out[out.length - 1] !== arr[arr.length - 1]) out.push(arr[arr.length - 1]);
  return { data:out, stride };
}

function sizeCanvas(cv, cssW, cssH){
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cssW + "px";
  cv.style.height = cssH + "px";
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function mountChart(cv, ticker, height){
  cv._ticker = ticker;
  cv._index = cv.dataset.indexChart || null;
  cv._height = height;
  if (!cv._wired){
    cv._wired = true;
    cv.addEventListener("mousemove", e => {
      const r = cv.getBoundingClientRect();
      cv._hoverX = e.clientX - r.left;
      drawChart(cv);
    });
    cv.addEventListener("mouseleave", () => { cv._hoverX = null; drawChart(cv); });
  }
  drawChart(cv);
}

function drawChart(cv){
  const a = cv._index ? S.indices[cv._index] : S.assets[cv._ticker];
  if (!a) return;
  const box = cv.parentElement;
  const cssW = Math.max(280, (box ? box.clientWidth : 620) - 20);
  const cssH = cv._height;
  const ctx = sizeCanvas(cv, cssW, cssH);

  const spec = seriesFor(a, S.range);
  let raw = spec.prices;
  if (!raw || !raw.length) raw = [a.price];
  if (raw.length === 1) raw = [raw[0], raw[0]];

  const ds = downsample(raw, CONFIG.chartMaxPoints);
  const series = ds.data;
  const vols = spec.vols && spec.vols.length
    ? downsample(spec.vols, CONFIG.chartMaxPoints).data : null;

  const pad = { l:8, r:62, t:12, b:22 };
  const volH = vols ? 40 : 0;
  const plotH = cssH - pad.t - pad.b - volH;
  const plotW = cssW - pad.l - pad.r;

  let lo = Math.min(...series), hi = Math.max(...series);
  if (spec.ref !== undefined){ lo = Math.min(lo, spec.ref); hi = Math.max(hi, spec.ref); }

  /* Over a century a linear axis renders the first fifty years as a flat line
     on the floor, so anything spanning more than an eightfold move gets a log
     axis. Decide that on the real range, before any padding. */
  const useLog = lo > 0 && hi / lo > 8;

  if (useLog){
    lo /= 1.10; hi *= 1.10;              // pad multiplicatively, or the floor
  } else {                                // collapses to nothing on a log scale
    const span = (hi - lo) || hi * 0.01 || 1;
    lo -= span * 0.12; hi += span * 0.12;
    lo = Math.max(lo, 0);                 // a price is never negative
  }
  const lLo = Math.log(Math.max(lo, 1e-9)), lHi = Math.log(Math.max(hi, 1e-8));

  const X = i => pad.l + plotW * (series.length === 1 ? 0 : i / (series.length - 1));
  const Y = v => useLog
    ? pad.t + plotH * (1 - (Math.log(Math.max(v, lo)) - lLo) / (lHi - lLo))
    : pad.t + plotH * (1 - (v - lo) / (hi - lo));

  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cssW, cssH);

  /* gridlines and the price scale, on the right like every real terminal */
  ctx.font = '11px ui-monospace,Menlo,monospace';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const axisLabelFor = v => v >= 10000 ? Math.round(v).toLocaleString("en-US")
                          : v >= 100 ? v.toFixed(0) : v.toFixed(2);
  for (let i = 0; i <= 4; i++){
    const v = useLog ? Math.exp(lLo + (lHi - lLo) * i / 4) : lo + (hi - lo) * i / 4;
    const y = Math.round(Y(v)) + 0.5;
    ctx.strokeStyle = "#f1f3f4"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
    ctx.fillStyle = "#9aa0a6";
    ctx.fillText(axisLabelFor(v), cssW - pad.r + 8, y);
  }
  if (useLog){
    ctx.fillStyle = "#bdc1c6"; ctx.font = '9.5px var(--ui)'; ctx.textAlign = "right";
    ctx.fillText("log", cssW - pad.r - 6, pad.t + 9);
    ctx.font = '11px ui-monospace,Menlo,monospace'; ctx.textAlign = "left";
  }

  /* previous close, where it means something */
  if (spec.ref !== undefined){
    const y = Math.round(Y(spec.ref)) + 0.5;
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "#bdc1c6";
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
    ctx.restore();
  }

  /* day boundaries on the week view */
  if (spec.span === "week" && spec.marks){
    ctx.save(); ctx.strokeStyle = "#e8eaed"; ctx.setLineDash([2, 3]);
    ctx.textAlign = "center"; ctx.fillStyle = "#bdc1c6"; ctx.font = '10px var(--ui)';
    for (const m of spec.marks){
      if (!m.i) continue;
      const x = Math.round(X(Math.floor(m.i / ds.stride))) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + plotH); ctx.stroke();
      ctx.fillText("Day " + m.day, x, cssH - 8);
    }
    ctx.restore();
  }

  /* volume */
  if (vols){
    const vmax = Math.max(...vols) || 1;
    ctx.fillStyle = "#eceef0";
    const bw = Math.max(1, plotW / vols.length - 0.5);
    for (let i = 0; i < vols.length; i++){
      const h = (vols[i] / vmax) * (volH - 8);
      ctx.fillRect(X(i) - bw / 2, cssH - pad.b - h, bw, h);
    }
  }

  const base = spec.ref !== undefined ? spec.ref : series[0];
  const last = series[series.length - 1];
  const rising = last >= base;
  const line = rising ? "#137333" : "#c5221f";

  /* soft area under the line */
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
  grad.addColorStop(0, rising ? "rgba(19,115,51,.14)" : "rgba(197,34,31,.14)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.beginPath();
  ctx.moveTo(X(0), pad.t + plotH);
  series.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(series.length - 1), pad.t + plotH);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  /* the line itself */
  ctx.strokeStyle = line; ctx.lineWidth = 1.6;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  series.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.stroke();

  /* last price, marked and labelled against the scale */
  const ly = Y(last);
  ctx.beginPath(); ctx.arc(X(series.length - 1), ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = line; ctx.fill();
  const lbl = last >= 10000 ? Math.round(last).toLocaleString("en-US") : last.toFixed(2);
  ctx.font = '11px ui-monospace,Menlo,monospace';
  const lw = ctx.measureText(lbl).width + 12;
  ctx.fillStyle = line;
  roundRect(ctx, cssW - pad.r + 3, ly - 9, lw, 18, 3); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(lbl, cssW - pad.r + 9, ly);

  /* time axis */
  ctx.fillStyle = "#bdc1c6"; ctx.font = '10px var(--ui)';
  ctx.textBaseline = "alphabetic";
  if (spec.span !== "week"){
    ctx.textAlign = "left";
    ctx.fillText(axisLabel(spec, 0, raw.length), pad.l, cssH - 8);
    ctx.textAlign = "right";
    ctx.fillText(axisLabel(spec, raw.length - 1, raw.length), cssW - pad.r, cssH - 8);
  }

  /* crosshair */
  if (cv._hoverX != null && cv._hoverX > pad.l && cv._hoverX < cssW - pad.r){
    const i = Math.max(0, Math.min(series.length - 1,
      Math.round((cv._hoverX - pad.l) / plotW * (series.length - 1))));
    const x = Math.round(X(i)) + 0.5, y = Y(series[i]);
    ctx.save();
    ctx.strokeStyle = "#9aa0a6"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + plotH); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.stroke();

    const chg = (series[i] - base) / base * 100;
    const val = cv._index
      ? series[i].toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
      : money(series[i]);
    const txt = `${val}   ${pct(chg)}`;
    const sub = axisLabel(spec, i * ds.stride, raw.length);
    ctx.font = '11px ui-monospace,Menlo,monospace';
    const w = Math.max(ctx.measureText(txt).width, ctx.measureText(sub).width) + 18;
    const bx = Math.min(Math.max(pad.l, x - w / 2), cssW - pad.r - w);
    ctx.fillStyle = "rgba(32,33,36,.92)";
    roundRect(ctx, bx, pad.t + 2, w, 36, 5); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(txt, bx + 9, pad.t + 13);
    ctx.fillStyle = "#9aa0a6"; ctx.font = '10px var(--ui)';
    ctx.fillText(sub, bx + 9, pad.t + 28);
  }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tickClock(t){
  const sp = CONFIG.closeMinute - CONFIG.openMinute;
  const m = CONFIG.openMinute + Math.floor(sp * (t / CONFIG.ticksPerDay));
  return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

function axisLabel(spec, i, total){
  if (spec.kind === "day") return gameDate(spec.firstDay + i + 1).label;
  if (spec.span === "hour") return tickClock((spec.startTick || 0) + i);
  if (spec.span === "week"){
    let day = S.day, off = i;
    if (spec.marks) for (const m of spec.marks) if (i >= m.i) { day = m.day; off = i - m.i; }
    return `Day ${day}, ${tickClock(off)}`;
  }
  return tickClock(i);
}

function rangeNote(){
  switch (S.range){
    case "1H":  return "The last hour of trading, tick by tick.";
    case "1D":  return "This session, tick by tick. Dashed line is yesterday's close.";
    case "1W":  return `Up to ${CONFIG.sessionsKept - 1} trading days of ticks, stitched. Dotted lines are the opens.`;
    case "1Y":  return "Forty daily closes — one in-game year.";
    case "5Y":  return "Five years of closes.";
    default: {
      const ix = S.indices[S.openIndex];
      if (ix && currentTab().url.indexOf("quillstreet.com/index") === 0)
        return `Every close since ${ix.inception}. Invented, of course — and the forward drift owes it nothing.`;
      return "Every close on record. The years before you arrived are invented, and the forward drift owes them nothing.";
    }
  }
}

function rangeBarHTML(){
  return `<div class="ranges">${RANGES.map(r =>
    `<button class="rg ${S.range === r.id ? "on" : ""}" data-range="${r.id}">${r.label}</button>`
  ).join("")}</div>`;
}

function paintCharts(){

function isTyping(){

function paintStatus(){

  document.getElementById("st-phase").textContent = open ? "Market open" : "Closed — planning";

/* ticker tape — the one piece of motion in the build */
let tapeRunning = false;
function paintTape(){
  const el = document.getElementById("tape");
  const cells = listedAssets().slice(0, 14).map(a => {
    const ch = (a.price - a.prevClose) / a.prevClose * 100;
    const k = ch > 0 ? "u" : ch < 0 ? "d" : "";
    const arrow = ch > 0 ? "▲" : ch < 0 ? "▼" : "▬";
    return `<span class="sym">${a.ticker}</span> <span class="${k}">${a.price.toFixed(2)} ${arrow} ${pct(ch)}</span>`;
  });
  const run = cells.join(" &nbsp;&nbsp;&middot;&nbsp;&nbsp; ") + " &nbsp;&nbsp;&middot;&nbsp;&nbsp; ";
  el.innerHTML = run + run + run;
  if (!tapeRunning){
    tapeRunning = true;
    let x = 0;
    (function loop(){
      x -= 0.5;
      if (Math.abs(x) > el.scrollWidth / 3) x = 0;
      el.style.transform = `translateX(${x}px)`;
      requestAnimationFrame(loop);
    })();
  }
}

function flash(msg){
  const el = document.getElementById("st-hint");

}
