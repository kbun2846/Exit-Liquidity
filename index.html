/* -- save / load --------------------------------------------------------- */
function snapshot(){
  return {
    v:1, seed:S.seed, tier:S.tier, day:S.day, tick:S.tick, phase:S.phase,
    cash:S.cash, rep:S.rep, positions:S.positions, broker:S.broker, tutorial:S.tutorial,
    tradesMade:S.tradesMade, realTimePlayed:S.realTimePlayed,
    range:S.range,
    prices:Object.fromEntries(Object.entries(S.assets).map(([k, a]) => [k, [a.price, a.prevClose]])),
    // The invented past regenerates identically from the seed, so only the
    // days actually played need storing. Tick-level sessions are not kept:
    // they would dwarf everything else in the code, and a reloaded save
    // rebuilds the week view as it goes.
    hist:Object.fromEntries(Object.entries(S.assets).map(([k, a]) =>
      [k, [a.history.slice(a.backfillLen).map(x => +x.toFixed(4)),
           a.histVol.slice(a.backfillLen)]])),
    mail:S.mail.slice(0, 20),
    ixhist:Object.fromEntries(Object.entries(S.indices).map(([k, ix]) =>
      [k, ix.history.slice(ix.backfillLen).map(x => +x.toFixed(3))])),
    news:S.news.slice(0, 40),
    effects:S.effects,
    schedule:S.schedule,
  };
}

/* btoa only speaks Latin-1 and the copy is full of em dashes, so go through
   UTF-8 both ways. Encoding straight to btoa throws the moment a newsletter
   lands, which silently produces an empty save code. */
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(code){
  const bin = atob(code), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const saveCode = () => { try { return b64(JSON.stringify(snapshot())); } catch { return ""; } };
function save(){ try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(snapshot())); } catch {} }

function applySnapshot(o){
  if (!o || o.v !== 1) return false;
  newGame(o.seed);
  S.tier = o.tier; S.day = o.day; S.tick = o.tick; S.phase = o.phase;
  S.cash = o.cash; S.rep = o.rep;
  S.positions = Array.isArray(o.positions) ? o.positions : (o.position ? [o.position] : []);
  S.broker = o.broker || "tugmore";
  S.tutorial = o.tutorial || {}; S.tradesMade = o.tradesMade || 0;
  S.realTimePlayed = o.realTimePlayed || 0;
  S.range = o.range || "1D";
  for (const k in o.hist || {}){
    const a = S.assets[k]; if (!a) continue;
    const [closes, vols] = o.hist[k];
    a.history = a.history.slice(0, a.backfillLen).concat(closes || []);
    a.histVol = a.histVol.slice(0, a.backfillLen).concat(vols || []);
  }
  if (Array.isArray(o.mail) && o.mail.length){
    S.mail = o.mail;
    mailSeq = Math.max(0, ...o.mail.map(m => m.id || 0));
  }
  for (const k in o.ixhist || {}){
    const ix = S.indices[k]; if (!ix) continue;
    ix.history = ix.history.slice(0, ix.backfillLen).concat(o.ixhist[k] || []);
    ix.histVol = ix.history.map(() => 0);
    if (ix.history.length) ix.value = ix.prevClose = ix.history[ix.history.length - 1];
  }
  if (Array.isArray(o.news)){
    S.news = o.news;
    storySeq = Math.max(0, ...o.news.map(x => x.n || 0), 0);
  }
  // Effects in flight are restored too: a story that fired this morning is
  // still working on the price, and losing that on reload would quietly
  // reverse a trade the player made for a good reason.
  S.effects = Array.isArray(o.effects) ? o.effects : [];
  S.schedule = Array.isArray(o.schedule) ? o.schedule : null;
  for (const k in o.prices || {}){
    if (!S.assets[k]) continue;
    S.assets[k].price = o.prices[k][0];
    S.assets[k].prevClose = o.prices[k][1];
    S.assets[k].open = o.prices[k][0];
    S.assets[k].dayHigh = o.prices[k][0];
    S.assets[k].dayLow = o.prices[k][0];
    S.assets[k].intraday = [o.prices[k][0]];
    S.assets[k].intradayVol = [0];
  }
  return true;
}
function loadCode(code){ try { return applySnapshot(JSON.parse(unb64(code))); } catch { return false; } }
function loadLocal(){
  try {
    const raw = localStorage.getItem(CONFIG.saveKey);
    return raw ? applySnapshot(JSON.parse(raw)) : false;
  } catch { return false; }
}

/* ===========================================================================
   9. CLOCK + EVENTS + BOOT
   ======================================================================== */
let clockHandle = null;
function restartClock(){
  clearInterval(clockHandle);
  clockHandle = setInterval(() => {
    S.realTimePlayed += CONFIG.tickMs / 1000;
    if (S.phase !== "open" || S.paused) return;
    const before = S.phase;
    stepTick();
    // A tick never rebuilds the page. It rewrites the numbers and repaints the
    // chart, so dropdowns stay open and half-typed input survives.
    if (S.phase === before){ liveUpdate(); paintCharts(); paintTape(); }
    if (S.tick % 20 === 0) save();
  }, CONFIG.tickMs);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-tab],[data-mail],[data-quote],[data-watch],[data-sort],[data-trade],[data-range],[data-news],[data-newsfilter],[data-sellone],[data-index]");
  if (t){
    if (t.dataset.sellone !== undefined) return sell(t.dataset.sellone);
    if (t.dataset.index !== undefined){
      S.openIndex = t.dataset.index; S.openNews = null; return go("quillstreet.com/index");
    }
    if (t.dataset.news !== undefined){
      S.openNews = +t.dataset.news; return go("quillstreet.com/news");
    }
    if (t.dataset.newsfilter !== undefined){
      S.newsFilter = t.dataset.newsfilter; S.openNews = null; return render();
    }
    if (t.dataset.range !== undefined){
      // Swap the range without rebuilding the page, so the order ticket keeps
      // whatever the player has typed into it.
      S.range = t.dataset.range;
      document.querySelectorAll(".rg").forEach(b =>
        b.classList.toggle("on", b.dataset.range === S.range));
      paintCharts(); liveUpdate();
      return;
    }
    // Any plain navigation drops the open article, so the bookmark and the
    // back link both land on the feed rather than on whatever was last read.
    if (t.dataset.go !== undefined){ S.openNews = null; return go(t.dataset.go); }
    if (t.dataset.tab !== undefined){ S.activeTab = +t.dataset.tab; return render(); }
    if (t.dataset.mail !== undefined){ S.openMail = +t.dataset.mail; return render(); }
    if (t.dataset.quote !== undefined){
      S.quote = S.watchSel = t.dataset.quote; return go("quillstreet.com/quote");
    }
    if (t.dataset.watch !== undefined){ S.watchSel = t.dataset.watch; return render(); }
    if (t.dataset.trade !== undefined){ S.watchSel = t.dataset.trade; return go("tugmore.com"); }
    if (t.dataset.sort !== undefined){
      S.sortDir = (S.sortKey === t.dataset.sort) ? -S.sortDir : 1;
      S.sortKey = t.dataset.sort; return render();
    }
  }

  switch (e.target.id){
    case "btn-menu": return showGameMenu();
    case "nav-go": return go(document.getElementById("addr").value.trim());
    case "nav-reload": return render();
    case "nav-back": case "nav-fwd": return flash("History is not implemented in this build.");
    case "q-go": {
      S.search = document.getElementById("q-search").value;
      if (S.search.trim()) step("search_ticker");
      return render();
    }
    case "q-clear": S.search = ""; return render();
    case "t-buy": {
      S.lastAmt = document.getElementById("t-amt").value;
      const sym = document.getElementById("t-sym").value.trim().toUpperCase();
      if (!S.assets[sym]) return fail(`No security listed under "${esc(sym)}".`);
      S.watchSel = sym;
      return buy(sym, parseFloat(S.lastAmt));
    }
    case "t-sell": return sell(S.watchSel);
    case "btn-openday": return openDay();
    case "btn-skipday":
      return dialog("Skip the rest of the day", `
        <p>The day runs on without you. Prices move, and anything you hold moves with them.
        You cannot place or close an order until the next open.</p>
        <p class="small muted">No fee at this stage of your career.</p>`,
        [{ label:"Skip", fn: () => { while (S.phase === "open") stepTick(); render(); } },
         { label:"Cancel" }]);
  }
});

/* keep the chart and ticket in step with the symbol dropdown */
document.addEventListener("change", e => {
  if (e.target.id === "t-broker"){
    S.broker = e.target.value;
    S.lastError = S.lastOk = null;
    flash(`Routing through ${broker().name}.`);
    return render();
  }
  if (e.target.id === "t-sym"){
    // Carry the typed amount across the re-render, or picking a different
    // symbol silently throws away what the player just entered.
    const amt = document.getElementById("t-amt");
    if (amt) S.lastAmt = amt.value;
    S.watchSel = e.target.value;
    render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const el = document.activeElement;
  if (!el) return;
  if (el.id === "addr") go(el.value.trim());
  if (el.id === "q-search"){
    S.search = el.value;
    if (S.search.trim()) step("search_ticker");
    render();
  }
  if (el.id === "t-amt" && S.phase === "open"){
    S.lastAmt = el.value;
    buy(document.getElementById("t-sym").value, parseFloat(el.value));
  }
});

/* Charts are sized from their container, so they have to be redrawn when the
   window changes. Debounced, because resize fires continuously. */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(paintCharts, 120);
});

(function boot(){
  if (!loadLocal()) newGame();
  render();
  restartClock();
  if (S.phase === "closed" && S.day === 1 && S.tick === 0){
    dialog("Exit Liquidity", `
      <p>You have five hundred dollars, four dull companies and room for one position at a time.</p>
      <p class="small">Nothing here will tell you what to do. Your mail is the only instruction you
      get, and the market never explains itself. Start by reading it.</p>
      <p class="small muted">A trading day is ten real minutes. The market is closed right now &mdash;
      open it from the order ticket at Tugmore Direct when you are ready.</p>`,
      [{ label:"Open the mail", fn: () => go("nscrape.com/mail") }]);
  }
})();
</script>
</body>
