function capLabel(a){
  const c = marketCap(a);
  if (c >= 1e12) return "$" + (c / 1e12).toFixed(2) + "T";
  if (c >= 1e9)  return "$" + (c / 1e9).toFixed(1) + "B";
  return "$" + (c / 1e6).toFixed(0) + "M";
}

function checklistHTML(){
  if (S.tier !== 1) return "";
  return `<div class="chk">
    <h3>Getting started &middot; ${stepsDone()} of ${STEPS.length}</h3>
    <ol>${STEPS.map(s => `<li class="${S.tutorial[s.id] ? "done" : ""}">${s.label}</li>`).join("")}</ol>
  </div>`;
}

/* ===========================================================================
   6. LIVE UPDATE

   The whole reason the page is usable while the market ticks. Rewrites only
   the numbers, so open dropdowns, focus and half-typed input all survive.
   ======================================================================== */
function liveUpdate(){
  const nodes = document.querySelectorAll("#viewport [data-lv]");
  for (const el of nodes){
    const kind = el.dataset.lv;
    const a = el.dataset.t ? S.assets[el.dataset.t] : null;
    if (el.dataset.t && !a && kind !== "idxval" && kind !== "idxchg") continue;
    const ch = a ? (a.price - a.prevClose) / a.prevClose * 100 : 0;

    switch (kind){
      case "price":
        el.textContent = money(a.price);
        if (el.classList.contains("big")) setTone(el, ch, "big");
        break;
      case "change":
        el.textContent = pct(ch); setTone(el, ch, "num"); break;
      case "bidask":
        el.textContent = `${money(bidOf(a))} / ${money(askOf(a))}`; break;
      case "bidaskLong":
        el.textContent = `Bid ${money(bidOf(a))}   Ask ${money(askOf(a))}`; break;
      case "vol":
        el.textContent = a.volume.toLocaleString("en-US"); break;
      case "range":
        el.textContent = `${money(a.dayLow)} – ${money(a.dayHigh)}`; break;
      case "stats":
        el.textContent = `Open ${money(a.open)} · High ${money(a.dayHigh)} `
                       + `· Low ${money(a.dayLow)} · Prev close ${money(a.prevClose)} `
                       + `· Vol ${a.volume.toLocaleString("en-US")}`;
        break;
      case "cash":     el.textContent = money(S.cash); break;
      case "clock":    el.textContent = clockLabel(); break;
      case "tickcount":el.textContent = `${S.tick} of ${CONFIG.ticksPerDay}`; break;
      case "phase":    el.textContent = S.phase === "open" ? "Open" : "Closed — planning"; break;
      case "phasetext":el.textContent = S.phase === "open" ? "Market open."
                         : "Market closed — orders resume at the next open."; break;
      case "cap": el.textContent = capLabel(a); break;
      case "idxval": { const ix = S.indices[el.dataset.t];
        if (ix) el.textContent = ix.value.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); break; }
      case "idxchg": { const ix = S.indices[el.dataset.t];
        if (ix){ const c = idxPct(ix); el.textContent = pct(c); setTone(el, c, "num"); } break; }
      case "rangenote": el.textContent = rangeNote(); break;
      case "poslast": { const h = holding(el.dataset.t); if (h) el.textContent = money(pnlOf(h).bid); break; }
      case "posvalue":{ const h = holding(el.dataset.t); if (h) el.textContent = money(pnlOf(h).value); break; }
      case "pospnl":  { const h = holding(el.dataset.t);
                        if (h){ const q = pnlOf(h); el.textContent = money(q.pnl); setTone(el, q.pnl, "num"); } break; }
    }
  }
  paintStatus();
}
function setTone(el, n, base){
  el.className = `${base} ${cls(n)}`;
}

/* ===========================================================================
   7. CHARTS

   Drawn at device resolution so the line is actually sharp, and fed from real
   retained data rather than only the current session. Five ranges, each with
   its own source:

     1H   the last in-game hour of ticks, crossing into yesterday if need be
     1D   this session, tick by tick
     1W   five trading days of ticks, stitched
     1Y   forty daily closes
     MAX  every close there is, invented past included
   ======================================================================== */
const TICKS_PER_HOUR =
  Math.round(CONFIG.ticksPerDay / ((CONFIG.closeMinute - CONFIG.openMinute) / 60));

const RANGES = [
  { id:"1H",  label:"1H"  },
  { id:"1D",  label:"1D"  },
  { id:"1W",  label:"1W"  },
  { id:"1Y",  label:"1Y"  },
  { id:"5Y",  label:"5Y"  },
  { id:"MAX", label:"Max" },
];

/* Recent sessions plus the live one, flattened, newest last. */
function flatTicks(a, days){
  const take = a.sessions.slice(-Math.max(0, days - 1));
  const prices = [], vols = [], marks = [];
  for (const s of take){
    marks.push({ i:prices.length, day:s.day });
    prices.push(...s.prices); vols.push(...s.vols);
  }
  if (a.intraday.length){
    marks.push({ i:prices.length, day:S.day });
    prices.push(...a.intraday); vols.push(...a.intradayVol);
  }
  return { prices, vols, marks };
}

function seriesFor(a, range){
  if (!a.sessions){                       // an index: closes and this session only
    if (range === "1Y" || range === "5Y" || range === "MAX"){
      const n = range === "1Y" ? CONFIG.daysPerYear
              : range === "5Y" ? CONFIG.daysPerYear * 5 : a.history.length;
      const prices = a.history.slice(-n);
      return { prices, vols:null, kind:"day", firstDay:S.day - prices.length, ref:undefined };
    }
    const src = a.intraday.length > 1 ? a.intraday : a.history.slice(-2);
    const n = range === "1H" ? Math.min(TICKS_PER_HOUR, src.length) : src.length;
    return { prices:src.slice(-n), vols:null, kind:"tick", span:"day",
             startTick:Math.max(0, S.tick - n + 1), ref:a.prevClose };
  }
  if (range === "1Y" || range === "5Y" || range === "MAX"){
    const n = range === "1Y" ? CONFIG.daysPerYear
            : range === "5Y" ? CONFIG.daysPerYear * 5 : a.history.length;
    const prices = a.history.slice(-n), vols = a.histVol.slice(-n);
    return { prices, vols, kind:"day", firstDay: S.day - prices.length, ref:undefined };
  }
  if (range === "1W"){
    const f = flatTicks(a, 5);
    return { ...f, kind:"tick", span:"week", ref:undefined };
  }
  if (range === "1H"){
    const f = flatTicks(a, 2);
    const n = Math.min(TICKS_PER_HOUR, f.prices.length);
    return { prices:f.prices.slice(-n), vols:f.vols.slice(-n), kind:"tick", span:"hour",
             startTick: Math.max(0, S.tick - n + 1), ref:undefined };
  }
  // 1D
  const src = a.intraday.length > 1 ? a
            : (a.sessions.length ? a.sessions[a.sessions.length - 1] : a);
  const prices = src.prices || a.intraday, vols = src.vols || a.intradayVol;
  return { prices, vols, kind:"tick", span:"day", startTick:0, ref:a.prevClose };
}

/* Even-stride downsample that always keeps the first and last point, so the
   latest price is never a stale sample. */
function downsample(arr, max){
  if (arr.length <= max) return { data:arr, stride:1 };
  const stride = Math.ceil(arr.length / max), out = [];
  for (let i = 0; i < arr.length; i += stride) out.push(arr[i]);
  if (out[out.length - 1] !== arr[arr.length - 1]) out.push(arr[arr.length - 1]);
  return { data:out, stride };
}

function sizeCanvas(cv, cssW, cssH){
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cssW + "px";
  cv.style.height = cssH + "px";
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function mountChart(cv, ticker, height){
  cv._ticker = ticker;
  cv._index = cv.dataset.indexChart || null;
  cv._height = height;
  if (!cv._wired){
    cv._wired = true;
    const at = clientX => {
      cv._hoverX = clientX - cv.getBoundingClientRect().left;
      drawChart(cv);
    };
    cv.addEventListener("mousemove", e => at(e.clientX));
    cv.addEventListener("mouseleave", () => { cv._hoverX = null; drawChart(cv); });

    /* A finger is a cursor that can only be in one place at a time and takes
       the page with it. Drag along the chart to scrub, lift to clear. */
    cv.addEventListener("touchstart", e => {
      if (e.touches.length !== 1) return;
      at(e.touches[0].clientX);
    }, { passive:true });
    cv.addEventListener("touchmove", e => {
      if (e.touches.length !== 1) return;
      e.preventDefault();               // scrub instead of scrolling the page
      at(e.touches[0].clientX);
    }, { passive:false });
    const clear = () => {
      // leave the readout up briefly, then drop it — otherwise it vanishes
      // the instant you lift and you never get to read the number
      setTimeout(() => { cv._hoverX = null; drawChart(cv); }, 2200);
    };
    cv.addEventListener("touchend", clear, { passive:true });
    cv.addEventListener("touchcancel", clear, { passive:true });
  }
  drawChart(cv);
}

function drawChart(cv){
  const a = cv._index ? S.indices[cv._index] : S.assets[cv._ticker];
  if (!a) return;
  const box = cv.parentElement;
  const cssW = Math.max(280, (box ? box.clientWidth : 620) - 20);
  const cssH = cv._height;
  const ctx = sizeCanvas(cv, cssW, cssH);

  const spec = seriesFor(a, S.range);
  let raw = spec.prices;
  if (!raw || !raw.length) raw = [a.price];
  if (raw.length === 1) raw = [raw[0], raw[0]];

  const ds = downsample(raw, CONFIG.chartMaxPoints);
  const series = ds.data;
  const vols = spec.vols && spec.vols.length
    ? downsample(spec.vols, CONFIG.chartMaxPoints).data : null;

  const pad = { l:8, r:62, t:12, b:22 };
  const volH = vols ? 40 : 0;
  const plotH = cssH - pad.t - pad.b - volH;
  const plotW = cssW - pad.l - pad.r;

  let lo = Math.min(...series), hi = Math.max(...series);
  if (spec.ref !== undefined){ lo = Math.min(lo, spec.ref); hi = Math.max(hi, spec.ref); }

  /* Over a century a linear axis renders the first fifty years as a flat line
     on the floor, so anything spanning more than an eightfold move gets a log
     axis. Decide that on the real range, before any padding. */
  const useLog = lo > 0 && hi / lo > 8;

  if (useLog){
    lo /= 1.10; hi *= 1.10;              // pad multiplicatively, or the floor
  } else {                                // collapses to nothing on a log scale
    const span = (hi - lo) || hi * 0.01 || 1;
    lo -= span * 0.12; hi += span * 0.12;
    lo = Math.max(lo, 0);                 // a price is never negative
  }
  const lLo = Math.log(Math.max(lo, 1e-9)), lHi = Math.log(Math.max(hi, 1e-8));

  const X = i => pad.l + plotW * (series.length === 1 ? 0 : i / (series.length - 1));
  const Y = v => useLog
    ? pad.t + plotH * (1 - (Math.log(Math.max(v, lo)) - lLo) / (lHi - lLo))
    : pad.t + plotH * (1 - (v - lo) / (hi - lo));

  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cssW, cssH);

  /* gridlines and the price scale, on the right like every real terminal */
  ctx.font = '11px ui-monospace,Menlo,monospace';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const axisLabelFor = v => v >= 10000 ? Math.round(v).toLocaleString("en-US")
                          : v >= 100 ? v.toFixed(0) : v.toFixed(2);
  for (let i = 0; i <= 4; i++){
    const v = useLog ? Math.exp(lLo + (lHi - lLo) * i / 4) : lo + (hi - lo) * i / 4;
    const y = Math.round(Y(v)) + 0.5;
    ctx.strokeStyle = "#f1f3f4"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
    ctx.fillStyle = "#9aa0a6";
    ctx.fillText(axisLabelFor(v), cssW - pad.r + 8, y);
  }
  if (useLog){
    ctx.fillStyle = "#bdc1c6"; ctx.font = '9.5px var(--ui)'; ctx.textAlign = "right";
    ctx.fillText("log", cssW - pad.r - 6, pad.t + 9);
    ctx.font = '11px ui-monospace,Menlo,monospace'; ctx.textAlign = "left";
  }

  /* previous close, where it means something */
  if (spec.ref !== undefined){
    const y = Math.round(Y(spec.ref)) + 0.5;
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "#bdc1c6";
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(cssW - pad.r, y); ctx.stroke();
    ctx.restore();
  }

  /* day boundaries on the week view */
  if (spec.span === "week" && spec.marks){
    ctx.save(); ctx.strokeStyle = "#e8eaed"; ctx.setLineDash([2, 3]);
    ctx.textAlign = "center"; ctx.fillStyle = "#bdc1c6"; ctx.font = '10px var(--ui)';
    for (const m of spec.marks){
      if (!m.i) continue;
      const x = Math.round(X(Math.floor(m.i / ds.stride))) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + plotH); ctx.stroke();
      ctx.fillText("Day " + m.day, x, cssH - 8);
    }
    ctx.restore();
  }

  /* volume */
  if (vols){
    const vmax = Math.max(...vols) || 1;
    ctx.fillStyle = "#eceef0";
    const bw = Math.max(1, plotW / vols.length - 0.5);
    for (let i = 0; i < vols.length; i++){
      const h = (vols[i] / vmax) * (volH - 8);
      ctx.fillRect(X(i) - bw / 2, cssH - pad.b - h, bw, h);
    }
  }

  const base = spec.ref !== undefined ? spec.ref : series[0];
  const last = series[series.length - 1];
  const rising = last >= base;
  const line = rising ? "#137333" : "#c5221f";

  /* soft area under the line */
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
  grad.addColorStop(0, rising ? "rgba(19,115,51,.14)" : "rgba(197,34,31,.14)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.beginPath();
  ctx.moveTo(X(0), pad.t + plotH);
  series.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(series.length - 1), pad.t + plotH);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  /* the line itself */
  ctx.strokeStyle = line; ctx.lineWidth = 1.6;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  series.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
  ctx.stroke();

  /* last price, marked and labelled against the scale */
  const ly = Y(last);
  ctx.beginPath(); ctx.arc(X(series.length - 1), ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = line; ctx.fill();
  const lbl = last >= 10000 ? Math.round(last).toLocaleString("en-US") : last.toFixed(2);
  ctx.font = '11px ui-monospace,Menlo,monospace';
  const lw = ctx.measureText(lbl).width + 12;
  ctx.fillStyle = line;
  roundRect(ctx, cssW - pad.r + 3, ly - 9, lw, 18, 3); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(lbl, cssW - pad.r + 9, ly);

  /* time axis */
  ctx.fillStyle = "#bdc1c6"; ctx.font = '10px var(--ui)';
  ctx.textBaseline = "alphabetic";
  if (spec.span !== "week"){
    ctx.textAlign = "left";
    ctx.fillText(axisLabel(spec, 0, raw.length), pad.l, cssH - 8);
    ctx.textAlign = "right";
    ctx.fillText(axisLabel(spec, raw.length - 1, raw.length), cssW - pad.r, cssH - 8);
  }

  /* crosshair */
  if (cv._hoverX != null && cv._hoverX > pad.l && cv._hoverX < cssW - pad.r){
    const i = Math.max(0, Math.min(series.length - 1,
      Math.round((cv._hoverX - pad.l) / plotW * (series.length - 1))));
    const x = Math.round(X(i)) + 0.5, y = Y(series[i]);
    ctx.save();
    ctx.strokeStyle = "#9aa0a6"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + plotH); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.stroke();

    const chg = (series[i] - base) / base * 100;
    const val = cv._index
      ? series[i].toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
      : money(series[i]);
    const txt = `${val}   ${pct(chg)}`;
    const sub = axisLabel(spec, i * ds.stride, raw.length);
    ctx.font = '11px ui-monospace,Menlo,monospace';
    const w = Math.max(ctx.measureText(txt).width, ctx.measureText(sub).width) + 18;
    const coarse = window.matchMedia("(pointer:coarse)").matches;
    const bx = coarse
      ? Math.min(Math.max(pad.l, x < cssW / 2 ? x + 14 : x - w - 14), cssW - pad.r - w)
      : Math.min(Math.max(pad.l, x - w / 2), cssW - pad.r - w);
    ctx.fillStyle = "rgba(32,33,36,.92)";
    roundRect(ctx, bx, pad.t + 2, w, 36, 5); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(txt, bx + 9, pad.t + 13);
    ctx.fillStyle = "#9aa0a6"; ctx.font = '10px var(--ui)';
    ctx.fillText(sub, bx + 9, pad.t + 28);
  }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function tickClock(t){
  const sp = CONFIG.closeMinute - CONFIG.openMinute;
  const m = CONFIG.openMinute + Math.floor(sp * (t / CONFIG.ticksPerDay));
  return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

function axisLabel(spec, i, total){
  if (spec.kind === "day") return gameDate(spec.firstDay + i + 1).label;
  if (spec.span === "hour") return tickClock((spec.startTick || 0) + i);
  if (spec.span === "week"){
    let day = S.day, off = i;
    if (spec.marks) for (const m of spec.marks) if (i >= m.i) { day = m.day; off = i - m.i; }
    return `Day ${day}, ${tickClock(off)}`;
  }
  return tickClock(i);
}

function rangeNote(){
  switch (S.range){
    case "1H":  return "The last hour of trading, tick by tick.";
    case "1D":  return "This session, tick by tick. Dashed line is yesterday's close.";
    case "1W":  return `Up to ${CONFIG.sessionsKept - 1} trading days of ticks, stitched. Dotted lines are the opens.`;
    case "1Y":  return "Forty daily closes — one in-game year.";
    case "5Y":  return "Five years of closes.";
    default: {
      const ix = S.indices[S.openIndex];
      if (ix && currentTab().url.indexOf("quillstreet.com/index") === 0)
        return `Every close since ${ix.inception}. Invented, of course — and the forward drift owes it nothing.`;
      return "Every close on record. The years before you arrived are invented, and the forward drift owes them nothing.";
    }
  }
}

/* ticker tape — the one piece of motion in the build */
let tapeRunning = false;
function paintTape(){
  const el = document.getElementById("tape");
  const cells = listedAssets().slice(0, 14).map(a => {
    const ch = (a.price - a.prevClose) / a.prevClose * 100;
    const k = ch > 0 ? "u" : ch < 0 ? "d" : "";
    const arrow = ch > 0 ? "▲" : ch < 0 ? "▼" : "▬";
    return `<span class="sym">${a.ticker}</span> <span class="${k}">${a.price.toFixed(2)} ${arrow} ${pct(ch)}</span>`;
  });
  const run = cells.join(" &nbsp;&nbsp;&middot;&nbsp;&nbsp; ") + " &nbsp;&nbsp;&middot;&nbsp;&nbsp; ";
  el.innerHTML = run + run + run;
  if (!tapeRunning){
    tapeRunning = true;
    let x = 0;
    (function loop(){
      x -= 0.5;
      if (Math.abs(x) > el.scrollWidth / 3) x = 0;
      el.style.transform = `translateX(${x}px)`;
      requestAnimationFrame(loop);
    })();
  }
}

/* Developer tools. Deliberately blunt: these reach straight into state and
   skip every rule the game otherwise enforces. That is the point of them. */
function devAction(cmd){
  const [k, v] = cmd.split(":");
  if (k === "cash") S.cash += +v;
  if (k === "rep")  S.rep = clampRep(v === "set60" ? 60 : S.rep + +v);
  if (k === "tier"){
    if (v === "22"){ S.tier = 22; S.peakNetWorth = Math.max(S.peakNetWorth, tierDef(22).nw); }
    else S.tier = Math.max(1, Math.min(FINAL_TIER, S.tier + +v));
    const d = tierDef(S.tier);
    if (d.nw) S.peakNetWorth = Math.max(S.peakNetWorth, d.nw);
  }
  if (k === "lic"){
    if (v === "all") S.licences = Object.keys(LICENCES);
    else S.licences = [];
  }
  if (k === "day"){
    const n = +v;
    for (let i = 0; i < n; i++){
      if (S.phase !== "open") openDay();
      while (S.phase === "open") stepTick();
    }
  }
  if (k === "tax") fileTaxes();
  if (k === "tut"){ for (const st of STEPS) S.tutorial[st.id] = true; checkTier(); }
  closeDialog();
  render();
  setTimeout(showGameMenu, 30);
}

/* One line describing what a given tier is worth, built from the tier data so
   it cannot drift away from what the game actually does. */
function tierReward(t){
  const bits = [];
  if (t.nw) bits.push(`${money(t.nw * CONFIG.tierCashBonusFrac)} credit`);
  if (t.licence){
    const L = LICENCES[t.licence];
    bits.push(L.rep ? `${L.name} (reputation ${L.rep})` : L.name);
  }
  if (t.slots) bits.push(`${t.slots} position slots`);
  if (t.type === "boost") bits.push("reputation bump");
  if (t.type === "final") bits.push("career complete");
  return bits.join(" \u00b7 ");
}

function snapshot(){
  return {
    v:1, seed:S.seed, tier:S.tier, day:S.day, tick:S.tick, phase:S.phase,
    cash:S.cash, rep:S.rep, positions:S.positions, broker:S.broker, tutorial:S.tutorial,

    bank:S.bank, loans:S.loans, convicted:S.convicted, handle:S.handle, caughtPump:S.caughtPump,
    pin:S.pin, unlocked:S.unlocked,
    taxPeriod:S.taxPeriod, taxBill:S.taxBill, taxCarry:S.taxCarry, audited:S.audited,
    tradesMade:S.tradesMade, realTimePlayed:S.realTimePlayed,
    range:S.range,
    prices:Object.fromEntries(Object.entries(S.assets).map(([k, a]) => [k, [a.price, a.prevClose]])),
    // The invented past regenerates identically from the seed, so only the
    // days actually played need storing. Tick-level sessions are not kept:
    // they would dwarf everything else in the code, and a reloaded save
    // rebuilds the week view as it goes.
    hist:Object.fromEntries(Object.entries(S.assets).map(([k, a]) =>
      [k, [a.history.slice(a.backfillLen).map(x => +x.toFixed(4)),
           a.histVol.slice(a.backfillLen)]])),
    mail:S.mail.slice(0, 20),
    ixhist:Object.fromEntries(Object.entries(S.indices).map(([k, ix]) =>
      [k, ix.history.slice(ix.backfillLen).map(x => +x.toFixed(3))])),
    news:S.news.slice(0, 40),
    effects:S.effects,
    schedule:S.schedule,
  };
}

/* btoa only speaks Latin-1 and the copy is full of em dashes, so go through
   UTF-8 both ways. Encoding straight to btoa throws the moment a newsletter
   lands, which silently produces an empty save code. */
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(code){
  const bin = atob(code), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const saveCode = () => { try { return b64(JSON.stringify(snapshot())); } catch { return ""; } };
function save(){ try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(snapshot())); } catch {} }

/* True when this session began by loading a save rather than starting a
   career. It is how a save written before passcodes existed is recognised. */
let bootedFromSave = false;

function applySnapshot(o){
  if (!o || o.v !== 1) return false;
  newGame(o.seed);
  S.tier = o.tier; S.day = o.day; S.tick = o.tick; S.phase = o.phase;
  S.cash = o.cash; S.rep = o.rep;
  S.positions = Array.isArray(o.positions) ? o.positions : (o.position ? [o.position] : []);
  S.broker = o.broker || "tugmore";
  S.licences = Array.isArray(o.licences) ? o.licences : [];
  S.peakNetWorth = o.peak || S.cash;
  S.careerComplete = !!o.careerComplete;
  S.bank = o.bank || {}; S.loans = o.loans || []; S.convicted = !!o.convicted;
  if (o.handle) S.handle = o.handle;
  S.pin = o.pin || null; S.unlocked = o.unlocked || {};
  S.caughtPump = o.caughtPump || null;
  S.taxPeriod = o.taxPeriod || newTaxPeriod(); S.taxBill = o.taxBill || null;
  S.taxCarry = o.taxCarry || 0; S.audited = !!o.audited;
  S.tutorial = o.tutorial || {}; S.tradesMade = o.tradesMade || 0;
  S.realTimePlayed = o.realTimePlayed || 0;
  S.range = o.range || "1D";
  for (const k in o.hist || {}){
    const a = S.assets[k]; if (!a) continue;
    const [closes, vols] = o.hist[k];
    a.history = a.history.slice(0, a.backfillLen).concat(closes || []);
    a.histVol = a.histVol.slice(0, a.backfillLen).concat(vols || []);
  }
  if (Array.isArray(o.mail) && o.mail.length){
    S.mail = o.mail;
    mailSeq = Math.max(0, ...o.mail.map(m => m.id || 0));
  }
  for (const k in o.ixhist || {}){
    const ix = S.indices[k]; if (!ix) continue;
    ix.history = ix.history.slice(0, ix.backfillLen).concat(o.ixhist[k] || []);
    ix.histVol = ix.history.map(() => 0);
    if (ix.history.length) ix.value = ix.prevClose = ix.history[ix.history.length - 1];
  }
  if (Array.isArray(o.news)){
    S.news = o.news;
    storySeq = Math.max(0, ...o.news.map(x => x.n || 0), 0);
  }
  // Effects in flight are restored too: a story that fired this morning is
  // still working on the price, and losing that on reload would quietly
  // reverse a trade the player made for a good reason.
  S.effects = Array.isArray(o.effects) ? o.effects : [];
  S.schedule = Array.isArray(o.schedule) ? o.schedule : null;
  for (const k in o.prices || {}){
    if (!S.assets[k]) continue;
    S.assets[k].price = o.prices[k][0];
    S.assets[k].prevClose = o.prices[k][1];
    S.assets[k].open = o.prices[k][0];
    S.assets[k].dayHigh = o.prices[k][0];
    S.assets[k].dayLow = o.prices[k][0];
    S.assets[k].intraday = [o.prices[k][0]];
    S.assets[k].intradayVol = [0];
  }
  return true;
}
function loadCode(code){ try { return applySnapshot(JSON.parse(unb64(code))); } catch { return false; } }
function loadLocal(){
  try {
    const raw = localStorage.getItem(CONFIG.saveKey);
    return raw ? applySnapshot(JSON.parse(raw)) : false;
  } catch { return false; }
}

/* ===========================================================================
   9. CLOCK + EVENTS + BOOT
   ======================================================================== */
let clockHandle = null;
function restartClock(){
  clearInterval(clockHandle);
  clockHandle = setInterval(() => {
    S.realTimePlayed += CONFIG.tickMs / 1000;
    if (S.phase !== "open" || S.paused) return;
    const before = S.phase;
    stepTick();
    // A tick never rebuilds the page. It rewrites the numbers and repaints the
    // chart, so dropdowns stay open and half-typed input survives.
    if (S.phase === before){ liveUpdate(); paintCharts(); paintTape(); }
    if (S.tick % 20 === 0) save();
  }, CONFIG.tickMs);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-tab],[data-mail],[data-quote],[data-watch],[data-sort],[data-trade],[data-range],[data-news],[data-newsfilter],[data-sellone],[data-index],[data-licence],[data-bank],[data-openbank],[data-deposit],[data-withdraw],[data-loan],[data-repay],[data-repayall],[data-mailfilter],[data-ladder],[data-tabclose],[data-newtab],[data-post],[data-bagelsub],[data-scoop],[data-pump],[data-ad],[data-wiki],[data-amt],[data-broker-switch],[data-wiener],[data-arc],[data-mine],[data-minelvl],[data-snake],[data-poll],[data-lucky],[data-unlock],[data-note]");
  if (t){
    if (t.dataset.sellone !== undefined) return sell(t.dataset.sellone);
    if (t.dataset.licence !== undefined) return buyLicence(t.dataset.licence);
    if (t.dataset.bank !== undefined){ S.openBank = t.dataset.bank; S.lastError = S.lastOk = null; return go("bank.com/" + t.dataset.bank); }
    if (t.dataset.openbank !== undefined) return openAccount(t.dataset.openbank);
    if (t.dataset.deposit !== undefined){
      const v = parseFloat((document.getElementById("bk-amt") || {}).value);
      return deposit(t.dataset.deposit, v);
    }
    if (t.dataset.withdraw !== undefined){
      const v = parseFloat((document.getElementById("bk-amt") || {}).value);
      return withdraw(t.dataset.withdraw, v);
    }
    if (t.dataset.loan !== undefined){
      const v = parseFloat((document.getElementById("bk-loan") || {}).value);
      return takeLoan(t.dataset.loan, v);
    }
    if (t.dataset.repay !== undefined){
      const v = parseFloat((document.getElementById("bk-repay") || {}).value);
      return repayLoan(+t.dataset.repay, v);
    }
    if (t.dataset.repayall !== undefined){
      const l = S.loans[+t.dataset.repayall];
      return l && repayLoan(+t.dataset.repayall, l.owed);
    }
    if (t.dataset.index !== undefined){
      S.openIndex = t.dataset.index; S.openNews = null; return go("quillstreet.com/index");
    }
    if (t.dataset.news !== undefined){
      S.openNews = +t.dataset.news; return go("quillstreet.com/news");
    }
    if (t.dataset.ladder !== undefined){ closeDialog(); return showLadder(); }
    if (t.dataset.post !== undefined){ S.openPost = t.dataset.post; return go("bagel.com"); }
    if (t.dataset.bagelsub !== undefined){ S.bagelSub = t.dataset.bagelsub; S.openPost = null; return render(); }
    if (t.dataset.scoop !== undefined){ S.scoopChannel = t.dataset.scoop; return render(); }
    if (t.dataset.wiki !== undefined){ S.wikiPage = t.dataset.wiki; return render(); }
    if (t.dataset.amt !== undefined){
      S.lastAmt = String(t.dataset.amt);
      const el = document.getElementById("t-amt");
      if (el){ el.value = S.lastAmt; return; }
      return render();
    }
    if (t.dataset.wiener !== undefined){ S.wienerShow = t.dataset.wiener === "1"; return render(); }

    if (t.dataset.lucky !== undefined){
      const pool = listedAssets().filter(a => !a.fund);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (!pick) return;
      S.quote = S.watchSel = pick.ticker;
      flash(`${pick.ticker} it is. Do with that what you like.`);
      return go("quillstreet.com/quote");
    }
    if (t.dataset.unlock !== undefined) return tryUnlock(t.dataset.unlock);
    if (t.dataset.note !== undefined){ S.noteShow = t.dataset.note === "1"; return render(); }
    if (t.dataset.poll !== undefined){ S.poll = { day:S.day, pick:+t.dataset.poll }; return render(); }
    if (t.dataset.snake !== undefined){
      const [dx,dy] = t.dataset.snake.split(",").map(Number);
      return snakeGo(dx,dy);
    }
    if (t.dataset.minelvl !== undefined){ mineNew(t.dataset.minelvl); return render(); }
    if (t.dataset.mine !== undefined){
      const i = +t.dataset.mine, m = ARC.mine;
      if (!m) return;
      if (m.dead || m.won) return;
      if (m.flagMode) mineFlag(i); else mineOpen(i);
      paintMines();
      if (m.dead || m.won) return render();
      return;
    }
    if (t.dataset.arc !== undefined){
      const k = t.dataset.arc;
      if (k === "close") return arcClose();
      if (k === "snake-start"){ snakeGo(1,0); return render(); }
      if (k === "snake-again"){ snakeNew(); render(); return snakeGo(1,0); }
      if (k === "mine-again"){ mineNew(ARC.mine ? ARC.mine.level : "beginner"); return render(); }
      if (k === "mine-flagmode"){ if (ARC.mine) ARC.mine.flagMode = !ARC.mine.flagMode; return render(); }
      if (currentTab().url !== "gargle.com") go("gargle.com");
      return arcOpen(k);
    }
    if (t.dataset.brokerSwitch !== undefined){
      S.broker = t.dataset.brokerSwitch; S.lastError = S.lastOk = null;
      flash(`Routing through ${broker().name}.`); return render();
    }
    if (t.dataset.pump !== undefined) return actOnPump(t.dataset.pump);
    if (t.dataset.ad !== undefined){ S.openPost = null; return go(t.dataset.ad); }
    if (t.dataset.mailfilter !== undefined){
      S.mailFilter = t.dataset.mailfilter; S.openMail = null; return render();
    }
    if (t.dataset.newsfilter !== undefined){
      S.newsFilter = t.dataset.newsfilter; S.openNews = null; return render();
    }
    if (t.dataset.range !== undefined){
      // Swap the range without rebuilding the page, so the order ticket keeps
      // whatever the player has typed into it.
      S.range = t.dataset.range;
      document.querySelectorAll(".rg").forEach(b =>
        b.classList.toggle("on", b.dataset.range === S.range));
      paintCharts(); liveUpdate();
      return;
    }
    // Any plain navigation drops the open article, so the bookmark and the
    // back link both land on the feed rather than on whatever was last read.
    if (t.dataset.go !== undefined){ S.openNews = null; S.openPost = null; return go(t.dataset.go); }
    if (t.dataset.tabclose !== undefined){
      const i = +t.dataset.tabclose;
      S.tabs.splice(i, 1);
      S.activeTab = Math.max(0, Math.min(S.activeTab, S.tabs.length - 1));
      return render();
    }
    if (t.dataset.tab !== undefined){ S.activeTab = +t.dataset.tab; return render(); }
    if (t.dataset.newtab !== undefined){
      S.tabs.push({ url:"nscrape.com" });
      S.activeTab = S.tabs.length - 1;
      return render();
    }
    if (t.dataset.mail !== undefined){ S.openMail = +t.dataset.mail; return render(); }
    if (t.dataset.quote !== undefined){
      S.quote = S.watchSel = t.dataset.quote; return go("quillstreet.com/quote");
    }
    if (t.dataset.watch !== undefined){ S.watchSel = t.dataset.watch; return render(); }
    if (t.dataset.trade !== undefined){ S.watchSel = t.dataset.trade; return go("tugmore.com"); }
    if (t.dataset.sort !== undefined){
      S.sortDir = (S.sortKey === t.dataset.sort) ? -S.sortDir : 1;
      S.sortKey = t.dataset.sort; return render();
    }
  }

  switch (e.target.id){
    case "su-create": return finishSetup();
    case "sc-changepin": { closeDialog(); return changePasscode(); }
    case "btn-menu": return showGameMenu();
    case "nav-go": return go(document.getElementById("addr").value.trim());
    case "nav-reload": return render();
    case "nav-back": case "nav-fwd": return flash("History is not implemented in this build.");
    case "q-go": {
      S.search = document.getElementById("q-search").value;
      if (S.search.trim()) step("search_ticker");
      return render();
    }
    case "q-clear": S.search = ""; return render();
    case "hub-go": {
      const el = document.getElementById("hub-q");
      S.gargleQ = el ? el.value : "";
      arcStop(); ARC.active = null;
      return go("gargle.com");
    }
    case "gg-go": {
      const el = document.getElementById("gg-q");
      S.gargleQ = el ? el.value : "";
      return render();
    }
    case "t-buy": {
      S.lastAmt = document.getElementById("t-amt").value;
      const sym = document.getElementById("t-sym").value.trim().toUpperCase();
      if (!S.assets[sym]) return fail(`No security listed under "${esc(sym)}".`);
      S.watchSel = sym;
      return buy(sym, parseFloat(S.lastAmt));
    }
    case "t-sell": return sell(S.watchSel);
    case "btn-openday": return openDay();
    case "btn-skipday":
      return dialog("Skip the rest of today", `
        <p>The day runs on without you. News fires, prices move, and anything you hold moves with
        them. You cannot place or close an order until the next open.</p>
        <p class="small muted">${money(CONFIG.skipDayFee)}, in cash. Nothing will be sold to cover it.</p>`,
        [{ label:"Skip", fn:() => runSkip(1) }, { label:"Cancel", fn:render }]);
    case "btn-skipweek":
      return dialog("Skip five days", `
        <p>Five trading days run in full without you. Everything that would have happened happens,
        and you find out afterwards.</p>
        <p class="small muted">${money(CONFIG.skipWeekFee)} for the week, against
        ${money(CONFIG.skipDayFee * CONFIG.skipWeekDays)} a day at a time. Sitting out a long stretch
        is a normal decision, not an impatience tax.</p>`,
        [{ label:"Skip the week", fn:() => runSkip(CONFIG.skipWeekDays) }, { label:"Cancel", fn:render }]);
    case "pay-tax": return payTaxes();
    case "pri-enter": {
      const v = (document.getElementById("pri-code") || {}).value || "";
      /* The passcode is in the letter that arrives with the tier. Anything at
         all works once you are a client, because the lock is theatre and the
         real gate is the two million pounds. */
      /* The door is real now. The code is the one you chose on day one, and
         the two million is still the part that actually stops people. */
      if (S.tier >= 22 && v.trim() === S.pin){
        S.primaUnlocked = true; S.primaBad = false;
        (S.unlocked = S.unlocked || {}).prima = true;
      } else S.primaBad = true;
      return render();
    }
  }
});

/* keep the chart and ticket in step with the symbol dropdown */
document.addEventListener("change", e => {
  if (e.target.id === "t-broker"){
    S.broker = e.target.value;
    S.lastError = S.lastOk = null;
    flash(`Routing through ${broker().name}.`);
    return render();
  }
  if (e.target.id === "t-sym"){
    // Carry the typed amount across the re-render, or picking a different
    // symbol silently throws away what the player just entered.
    const amt = document.getElementById("t-amt");
    if (amt) S.lastAmt = amt.value;
    S.watchSel = e.target.value;
    render();
  }
});

/* The setup fields correct themselves as you type and the preview follows,
   without a re-render, because a re-render takes the cursor with it. */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "su-handle"){
    const clean = el.value.toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 16);
    if (clean !== el.value) el.value = clean;
    const out = el.nextElementSibling && el.nextElementSibling.querySelector("b");
    if (out) out.textContent = (handleOk(clean) ? clean : "\u2014\u2014\u2014") + "@nscrape.com";
    return;
  }
  if (el.id === "su-pin" || el.id === "cp-pin" || el.id === "lock-code" || el.id === "pri-code"){
    const digits = el.value.replace(/[^0-9]/g, "").slice(0, 4);
    if (digits !== el.value) el.value = digits;
  }
});

const SNAKE_KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                     w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };

document.addEventListener("contextmenu", e => {
  const t = e.target.closest("[data-mine]");
  if (!t || !ARC.mine) return;
  e.preventDefault();
  if (ARC.mine.dead || ARC.mine.won) return;
  mineFlag(+t.dataset.mine); paintMines();
});

document.addEventListener("keydown", e => {
  /* Snake takes the arrow keys while it is on screen, and gives them straight
     back the moment it is not. */
  if (ARC.active === "snake" && document.getElementById("snake-cv") && !isTyping()){
    const k = SNAKE_KEYS[e.key] || SNAKE_KEYS[e.key.toLowerCase()];
    if (k){ e.preventDefault(); return snakeGo(k[0], k[1]); }
    if (e.key === " " || e.key === "Enter"){
      e.preventDefault();
      const g = ARC.snake;
      if (!g.alive){ snakeNew(); render(); }
      return snakeGo(1,0);
    }
  }
  /* Girthmore has keys instead of buttons, because a terminal has keys instead
     of buttons. Only while the terminal is the page you are looking at, and
     never while a field has focus. */
  if (S.broker === "girthmore" && currentTab().url === "tugmore.com" && !isTyping()
      && !document.querySelector(".veil")){
    const k = e.key.toLowerCase();
    if (k === "b"){ e.preventDefault();
      return buy(S.watchSel, parseFloat(S.lastAmt) || 0); }
    if (k === "s"){ e.preventDefault(); return sell(S.watchSel); }
  }
  if (e.key !== "Enter") return;
  const el = document.activeElement;
  if (!el) return;
  if (el.id === "addr") go(el.value.trim());
  if (el.id === "lock-code"){
    const btn = document.querySelector("[data-unlock]");
    if (btn) tryUnlock(btn.dataset.unlock);
    return;
  }
  if (el.id === "su-handle" || el.id === "su-pin") return finishSetup();
  if (el.id === "cp-pin"){ const b0 = document.querySelector('[data-dlg="0"]'); if (b0) b0.click(); return; }
  if (el.id === "gg-q"){ S.gargleQ = el.value; render(); return; }
  if (el.id === "hub-q"){ S.gargleQ = el.value; arcStop(); ARC.active = null; go("gargle.com"); return; }
  if (el.id === "q-search"){
    S.search = el.value;
    if (S.search.trim()) step("search_ticker");
    render();
  }
  if (el.id === "t-amt" && S.phase === "open"){
    S.lastAmt = el.value;
    buy(document.getElementById("t-sym").value, parseFloat(el.value));
  }
});

/* Charts are sized from their container, so they have to be redrawn when the
   window changes. Debounced, because resize fires continuously. */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(paintCharts, 120);
});

(function boot(){
  bootedFromSave = loadLocal();
  if (!bootedFromSave) newGame();
  render();
  restartClock();
  if (!S.pin) showSetup();
})();
</script>
